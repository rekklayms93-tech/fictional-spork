<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Fantasy League of Legends sur les Worlds 2026 : draft, duels quotidiens et mercato entre amis.">
<style>
/* Base reset (same as the claude.ai page skeleton) */
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Fantasy Worlds 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Saira+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: broadcast-style score band on top, tabbed operating views below, one column on phones */
:root{
  --bg:#EEF1F6; --surface:#FFFFFF; --sunk:#E4E8F0; --ink:#111725; --muted:#5A6476; --line:#D6DCE6;
  --accent:#2950C8; --accent-ink:#FFFFFF; --turn:#C97E00; --turn-soft:#FFF3DC;
  --good:#1D8456; --bad:#BC3C35; --good-soft:#E2F4EA; --bad-soft:#FBE6E4;
  --band:#141B2B; --band-ink:#EEF2FA; --band-muted:#9AA6BD;
  --r-top:#B5534A; --r-jng:#3F8A55; --r-mid:#7A55B8; --r-adc:#C08A1E; --r-sup:#2F7FA8; --r-team:#5A6476;
  --f-display:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --f-hex:"Cinzel","Trajan Pro",Georgia,serif;
  /* Champ-select room: one deliberate dark look in both themes */
  --cs-bg:#010A13; --cs-glow:#0B2236; --cs-panel:#091428; --cs-panel2:#0E1A2C; --cs-line:#1E2D3D; --cs-line-gold:#463714;
  --cs-gold:#C8AA6E; --cs-gold-hi:#F0E6D2; --cs-gold-dim:#785A28; --cs-ink:#CDBE91; --cs-muted:#7B8794;
  --cs-blue:#0AC8B9; --cs-blue-dim:#0A3640; --cs-red:#E84057; --cs-red-dim:#3A1018; --cs-ok:#3FC97B;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1018; --surface:#141A26; --sunk:#0F141E; --ink:#E6EBF4; --muted:#8C96A9; --line:#242E42;
  --accent:#7094FF; --accent-ink:#0C1018; --turn:#F0B03A; --turn-soft:#2B2312;
  --good:#4CC28A; --bad:#EE7468; --good-soft:#12271D; --bad-soft:#2C1614;
  --band:#070A10; --band-ink:#EEF2FA; --band-muted:#8792A8;
  --r-top:#E07B70; --r-jng:#6CC184; --r-mid:#A98AE6; --r-adc:#E6B54E; --r-sup:#5DB3DE; --r-team:#8C96A9;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1018; --surface:#141A26; --sunk:#0F141E; --ink:#E6EBF4; --muted:#8C96A9; --line:#242E42;
  --accent:#7094FF; --accent-ink:#0C1018; --turn:#F0B03A; --turn-soft:#2B2312;
  --good:#4CC28A; --bad:#EE7468; --good-soft:#12271D; --bad-soft:#2C1614;
  --band:#070A10; --band-ink:#EEF2FA; --band-muted:#8792A8;
  --r-top:#E07B70; --r-jng:#6CC184; --r-mid:#A98AE6; --r-adc:#E6B54E; --r-sup:#5DB3DE; --r-team:#8C96A9;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.band{background:var(--band);color:var(--band-ink)}
.band .wrap{padding-block:20px 0}
.brand{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,6vw,46px);line-height:.95;letter-spacing:.01em;margin:0;text-transform:uppercase}
.brand h1 span{color:var(--turn)}
.brand .sub{color:var(--band-muted);font-size:13px;letter-spacing:.06em;text-transform:uppercase;margin-top:6px}
.who{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.who label{color:var(--band-muted)}
.who select{background:#ffffff14;border:1px solid #ffffff26;border-radius:6px;padding:6px 8px;color:var(--band-ink)}
.who select option{color:#111725}
.ticker{display:flex;gap:6px 18px;flex-wrap:wrap;margin-top:16px;font-size:13px;color:var(--band-muted)}
.ticker b{color:var(--band-ink);font-weight:600}
.ticker .dot{width:6px;height:6px;border-radius:50%;background:var(--turn);display:inline-block;margin-right:6px;vertical-align:middle}
nav.tabs{display:flex;gap:2px;margin-top:16px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{background:none;border:0;padding:10px 14px 12px;color:var(--band-muted);font-family:var(--f-display);font-weight:600;font-size:17px;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;position:relative}
nav.tabs button[aria-selected="true"]{color:var(--band-ink);border-bottom-color:var(--turn)}
nav.tabs button:hover{color:var(--band-ink)}
nav.tabs .badge{display:inline-block;min-width:8px;height:8px;border-radius:50%;background:var(--turn);margin-left:6px;vertical-align:middle}

main .wrap{padding-block:22px 48px;display:grid;gap:22px}
h2{font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:.02em;text-transform:uppercase;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:18px;letter-spacing:.03em;text-transform:uppercase;margin:0}
.lede{color:var(--muted);margin:4px 0 0;max-width:65ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.stack{display:grid;gap:12px}
.muted{color:var(--muted)}
.small{font-size:13px}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:13px}
select.in,input.in{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:8px 10px;min-width:0}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:4px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:2px;background:var(--rc,var(--r-team))}
.rc-TOP{--rc:var(--r-top)}.rc-JNG{--rc:var(--r-jng)}.rc-MID{--rc:var(--r-mid)}.rc-ADC{--rc:var(--r-adc)}.rc-SUP{--rc:var(--r-sup)}.rc-TEAM{--rc:var(--r-team)}
.team{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.pill{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.turn{background:var(--turn-soft);color:var(--turn)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.notice{border-left:4px solid var(--turn);background:var(--turn-soft);padding:12px 14px;border-radius:6px}
.notice.info{border-left-color:var(--accent);background:var(--sunk)}
.err{color:var(--bad)}

.tscroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;background:var(--sunk);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.rank{font-family:var(--f-display);font-weight:800;font-size:22px;width:44px;color:var(--muted)}
tr.lead .rank{color:var(--turn)}
.name{font-weight:600}
.big{font-family:var(--f-display);font-weight:700;font-size:20px}
.rec{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.02em;white-space:nowrap}
.rec .w{color:var(--good)} .rec .l{color:var(--bad)}
.cell-p{display:grid;gap:1px;min-width:86px}
.cell-p .pn{font-weight:600;font-size:13px;white-space:nowrap}
.cell-p .pp{font-family:var(--f-mono);font-size:12px;color:var(--muted)}

.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.day{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-width:92px;cursor:pointer;text-align:left}
.day[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.day .dn{font-family:var(--f-display);font-weight:700;font-size:16px;letter-spacing:.03em}
.day .dd{font-size:12px;color:var(--muted)}
.day .dw{font-size:12px;font-weight:600;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}

/* Duels */
.duels{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.duel{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.duel.mine{border-color:var(--turn);box-shadow:inset 0 0 0 1px var(--turn)}
.duel .side{min-width:0}
.duel .side.b{text-align:right}
.duel .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.duel .rc{font-size:12px;color:var(--muted)}
.duel .sc{font-family:var(--f-display);font-weight:800;font-size:24px;white-space:nowrap;font-variant-numeric:tabular-nums}
.duel .sc .vs{color:var(--muted);font-size:15px;margin:0 6px;font-weight:600}
.duel .won .nm{color:var(--good)}

/* Draft + cards */
.draft-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:820px){.draft-grid{grid-template-columns:1fr}}
.onclock{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--band);color:var(--band-ink);border-radius:10px;padding:14px 18px}
.onclock .k{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--band-muted)}
.onclock .v{font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1.05;text-transform:uppercase}
.onclock .v.me{color:var(--turn)}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters .seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface);flex-wrap:wrap}
.filters .seg button{border:0;background:none;padding:7px 10px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.filters .seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.pool{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.card{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;display:grid;gap:6px;text-align:left;cursor:pointer;position:relative;min-width:0}
.card:hover:not(:disabled){border-color:var(--accent)}
.card:disabled{cursor:not-allowed}
.card.taken{opacity:.42}
.card.blocked{opacity:.6}
.card.sel{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.card.out{border-color:var(--bad);box-shadow:inset 0 0 0 2px var(--bad)}
.card .pn{font-family:var(--f-display);font-weight:700;font-size:19px;line-height:1.05;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .meta{display:flex;justify-content:space-between;align-items:center;gap:6px}
.card .owner{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.confirm{border:1px solid var(--accent);background:var(--surface);border-radius:10px;padding:14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.rosters{display:grid;gap:10px}
.rosters.wide{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.roster{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px}
.roster.now{border-color:var(--turn);box-shadow:inset 0 0 0 1px var(--turn)}
.roster .rh{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:6px}
.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.slot{background:var(--sunk);border-radius:5px;padding:5px 6px;min-width:0}
.slot .sl{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.slot .sv{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .sv.empty{color:var(--muted);font-weight:400}
.log{display:grid;gap:6px;max-height:320px;overflow:auto;font-size:13px}
.log div{display:flex;gap:8px;align-items:baseline}
.log .void{text-decoration:line-through;color:var(--muted)}

.step{display:grid;gap:10px}
.step-h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.step-h .n{font-family:var(--f-display);font-weight:800;font-size:15px;color:var(--accent);letter-spacing:.06em;text-transform:uppercase}

.lineup{display:grid;gap:8px}
.lu-row{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
@media (max-width:480px){.lu-row{grid-template-columns:1fr}}
.plays{font-size:12px;font-weight:600}
.plays.yes{color:var(--good)} .plays.no{color:var(--muted)}

.rules-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.scale td:last-child{font-family:var(--f-mono);text-align:right;white-space:nowrap}
.prose li{max-width:65ch}
.prose ul{padding-left:18px;margin:6px 0}

/* ===== Champ select ===== */
.cs{background:radial-gradient(ellipse 90% 60% at 50% -10%, var(--cs-glow) 0%, var(--cs-bg) 70%);color:var(--cs-ink);border:1px solid var(--cs-line-gold);padding:18px;display:grid;gap:16px;color-scheme:dark;min-width:0}
.cs-top{display:grid;justify-items:center;text-align:center;gap:2px;padding-bottom:12px;border-bottom:1px solid var(--cs-line-gold);position:relative}
.cs-phase{font-family:var(--f-display);font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--cs-blue)}
.cs-title{font-family:var(--f-hex);font-weight:800;font-size:clamp(24px,4.6vw,38px);letter-spacing:.06em;text-transform:uppercase;color:var(--cs-gold-hi);line-height:1.1;text-wrap:balance}
.cs-title.me{color:var(--cs-gold);text-shadow:0 0 18px color-mix(in srgb, var(--cs-gold) 45%, transparent)}
.cs-sub{font-size:14px;color:var(--cs-muted)}
.cs-sub b{color:var(--cs-gold-hi)}
.cs-timer{font-family:var(--f-mono);font-size:15px;color:var(--cs-gold);margin-top:6px;letter-spacing:.06em}
.cs-count{position:absolute;right:0;top:0;font-family:var(--f-display);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--cs-muted)}
.cs-grid{display:grid;grid-template-columns:minmax(190px,240px) minmax(0,1fr) minmax(190px,240px);grid-template-areas:"left center right";gap:14px;align-items:start}
.cs-side{grid-area:left;display:grid;gap:8px}
.cs-side.right{grid-area:right}
.cs-center{grid-area:center;display:grid;gap:12px;min-width:0}
@media (max-width:900px){.cs-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"left right" "center center"}}
@media (max-width:420px){.cs{padding:12px} .cs-grid{gap:8px}}

.csp{background:linear-gradient(90deg, var(--cs-blue-dim), var(--cs-panel) 55%);border:1px solid var(--cs-line);border-left:3px solid var(--cs-blue);padding:8px 10px;display:grid;gap:6px;min-width:0;position:relative}
.cs-side.right .csp{background:linear-gradient(270deg, var(--cs-red-dim), var(--cs-panel) 55%);border-left:1px solid var(--cs-line);border-right:3px solid var(--cs-red);text-align:right}
.csp.now{border-color:var(--cs-gold);box-shadow:0 0 0 1px var(--cs-gold), 0 0 22px color-mix(in srgb, var(--cs-gold) 30%, transparent)}
.csp.now::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(100deg, transparent 30%, color-mix(in srgb, var(--cs-gold) 14%, transparent) 50%, transparent 70%);background-size:250% 100%}
@media (prefers-reduced-motion:no-preference){.csp.now::after{animation:sheen 2.4s linear infinite}}
@keyframes sheen{from{background-position:130% 0}to{background-position:-130% 0}}
.csp-h{display:flex;align-items:center;gap:8px;justify-content:space-between;min-width:0}
.cs-side.right .csp-h{flex-direction:row-reverse}
.csp-name{font-family:var(--f-hex);font-weight:700;font-size:15px;color:var(--cs-gold-hi);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.csp-pos{font-family:var(--f-mono);font-size:11px;color:var(--cs-muted);margin-right:6px}
.cs-side.right .csp-pos{margin:0 0 0 6px}
.csp-st{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;color:var(--cs-muted)}
.csp-st.turn{color:var(--cs-gold)} .csp-st.ok{color:var(--cs-ok)} .csp-st.free{color:var(--cs-muted)}
.csp-on{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--cs-ok);margin:0 5px;vertical-align:middle}
.csp-rows{display:grid;gap:2px;font-size:13px}
.csp-row{display:grid;grid-template-columns:46px minmax(0,1fr);gap:6px;align-items:baseline}
.cs-side.right .csp-row{grid-template-columns:minmax(0,1fr) 46px}
.cs-side.right .csp-row .rl{order:2}
.csp-row .rl{font-family:var(--f-display);font-weight:700;font-size:11px;letter-spacing:.08em;color:var(--rc,var(--cs-muted))}
.csp-row .pv{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--cs-gold-hi);font-weight:600}
.csp-row .pv.empty{color:var(--cs-muted);font-weight:400}
.csp-row .pv.hover{color:var(--cs-gold);font-style:italic}
.csp-row.team{border-top:1px solid var(--cs-line);padding-top:3px;margin-top:2px}
.csp-row.subs .pv{color:var(--cs-ink)}
.csp .join{justify-self:start;font-size:12px;padding:3px 10px}
.cs-side.right .csp .join{justify-self:end}

.cs-filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cs-seg{display:flex;flex-wrap:wrap;border:1px solid var(--cs-line-gold);background:var(--cs-panel)}
.cs-seg button{border:0;background:none;color:var(--cs-muted);padding:7px 10px;font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.cs-seg button[aria-pressed="true"]{color:var(--cs-gold-hi);background:var(--cs-line-gold)}
.cs input.in,.cs select.in{background:var(--cs-panel);border:1px solid var(--cs-line-gold);color:var(--cs-gold-hi);border-radius:0}
.cs-pool{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px;max-height:620px;overflow:auto;padding:2px}
.cst{position:relative;display:grid;gap:3px;align-content:end;min-height:92px;padding:8px;border:1px solid var(--cs-line);background:linear-gradient(180deg, var(--cs-panel2), var(--cs-panel));color:var(--cs-gold-hi);text-align:left;cursor:pointer;overflow:hidden;min-width:0}
.cst::before{content:attr(data-team);position:absolute;top:2px;right:6px;font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1;color:var(--cs-line);letter-spacing:.02em}

<script>
(() => {
const ROLES = ['TOP','JNG','MID','ADC','SUP'];
const ALLR = [...ROLES,'TEAM'];
const SLOTS = ['TOP','JNG','MID','ADC','SUP','TEAM','SUB1','SUB2'];
const SLOT_FR = {TOP:'Top',JNG:'Jungle',MID:'Mid',ADC:'ADC',SUP:'Support',TEAM:'Équipe',SUB1:'Sub 1',SUB2:'Sub 2'};
const ROLE_FR = {TOP:'Top',JNG:'Jungle',MID:'Mid',ADC:'ADC',SUP:'Support',TEAM:'Équipe'};
const PICKS_PER_SEAT = 8, MAX_SWAPS = 2;

const TEAMS = [
  {code:'GEN', name:'Gen.G', p:['Kiin','Canyon','Chovy','Ruler','Duro']},
  {code:'HLE', name:'Hanwha Life Esports', p:['Zeus','Kanavi','Zeka','Gumayusi','Delight']},
  {code:'T1',  name:'T1', p:['Doran','Oner','Faker','Peyz','Keria']},
  {code:'DK',  name:'Dplus KIA', p:['Siwoo','Lucid','ShowMaker','Smash','Career']},
  {code:'AL',  name:"Anyone's Legend", p:['Breathe','Tarzan','Shanks','hope','Kael']},
  {code:'BLG', name:'Bilibili Gaming', p:['bin','XUN','Knight','Viper','ON']},
  {code:'TES', name:'Top Esports', p:['369','Tian','Creme','JackeyLove','Zhuo']},
  {code:'IG',  name:'Invictus Gaming', p:['TheShy','Wei','Rookie','JiaQi','meiko']},
  {code:'G2',  name:'G2 Esports', p:['BrokenBlade','SkewMond','Caps','Hans Sama','Labrov']},
  {code:'MKOI',name:'Movistar KOI', p:['Myrwn','Elyoya','jojopyun','Supa','Alvaro']},
  {code:'KC',  name:'Karmine Corp', p:['Canna','Yike','Kyeahoo','Caliste','Busio']},
  {code:'TL',  name:'Team Liquid', p:['Morgan','Josedeodo','Quid','Yeon','CoreJJ']},
  {code:'LYON',name:'LYON', p:['Dhokla','Inspired','Saint','Berserker','Isles']},
  {code:'TSW', name:'Team Secret Whales', p:['Pun','Hizto','Dire','Eddie','Bie']},
  {code:'CFO', name:'CTBC Flying Oyster', p:['Rest','Shad0w','Pout','Doggo','Kino']},
  {code:'LOS', name:'LOS', p:['ZEST','Curse','Feisty','Duduhh','Ackerman']},
];
const PLAYERS = {};
TEAMS.forEach(t => {
  ROLES.forEach((r,i) => PLAYERS[t.code+'-'+r] = {id:t.code+'-'+r, name:t.p[i], role:r, team:t.code});
  PLAYERS[t.code+'-TEAM'] = {id:t.code+'-TEAM', name:t.name, role:'TEAM', team:t.code};
});
const ROLE_ORDER = p => ALLR.indexOf(PLAYERS[p].role);

const DAYS = [
  {id:'d01', date:'2026-10-23', stage:'Swiss', fmt:'Ronde 1 · Bo1', lock:'2026-10-23T17:00:00Z'},
  {id:'d02', date:'2026-10-24', stage:'Swiss', fmt:'Ronde 2 · Bo1', lock:'2026-10-24T17:00:00Z'},
  {id:'d03', date:'2026-10-25', stage:'Swiss', fmt:'Ronde 3 · Bo3 (2-0 et 0-2)', lock:'2026-10-25T17:00:00Z'},
  {id:'d04', date:'2026-10-26', stage:'Swiss', lock:'2026-10-26T17:00:00Z'},
  {id:'d05', date:'2026-10-28', stage:'Swiss', lock:'2026-10-28T17:00:00Z'},
  {id:'d06', date:'2026-10-29', stage:'Swiss', lock:'2026-10-29T17:00:00Z'},
  {id:'d07', date:'2026-10-30', stage:'Swiss', lock:'2026-10-30T17:00:00Z'},
  {id:'d08', date:'2026-10-31', stage:'Swiss', lock:'2026-10-31T17:00:00Z'},
  {id:'d09', date:'2026-11-03', stage:'Quart', lock:'2026-11-03T18:00:00Z'},
  {id:'d10', date:'2026-11-04', stage:'Quart', lock:'2026-11-04T18:00:00Z'},
  {id:'d11', date:'2026-11-05', stage:'Quart', lock:'2026-11-05T18:00:00Z'},
  {id:'d12', date:'2026-11-06', stage:'Quart', lock:'2026-11-06T18:00:00Z'},
  {id:'d13', date:'2026-11-07', stage:'Demi', lock:'2026-11-07T18:00:00Z'},
  {id:'d14', date:'2026-11-08', stage:'Demi', lock:'2026-11-08T18:00:00Z'},
  {id:'d15', date:'2026-11-14', stage:'Finale', lock:'2026-11-14T18:00:00Z'},
];
DAYS.forEach((d,i) => { d.n = i+1; d.i = i; if(!d.fmt) d.fmt = d.stage; });
const DN = DAYS.length;

// Riot Fantasy LCS 2014 scale without first blood and multi-kills (not available automatically), plus damage share.
// Team: win, dragons, barons, towers, plus a series bonus.
const SCORE = {k:2, d:-0.5, a:1.5, cs:0.01, dmg:0.1, big:2, tWin:2, tDr:1, tBn:2, tTw:1, tSeries:2};
// Points are averaged over the games played that day, so a Bo3 weighs the same as a Bo1.
function playerPoints(s){
  if(!s) return 0; const v = x => Number(s[x])||0; return playerTotal(s) / Math.max(1, v('g'));
}
function playerTotal(s){
  if(!s) return 0; const v = x => Number(s[x])||0;
  return SCORE.k*v('k') + SCORE.d*v('d') + SCORE.a*v('a') + SCORE.cs*v('cs') + SCORE.dmg*v('dmg')
       + SCORE.big*v('big');
}
function teamPoints(t){
  if(!t) return 0; const v = x => Number(t[x])||0; const g = Math.max(1, v('gw') + v('gl'));
  const perGame = SCORE.tWin*v('gw') + SCORE.tDr*v('dr') + SCORE.tBn*v('bn') + SCORE.tTw*v('tw');
  return perGame/g + SCORE.tSeries*v('sw');
}

// ---------- State ----------
const S = {db:null, me:null, isOwner:false, readOnly:false,
  config:null, picks:[], lineups:{}, stats:{}, schedule:{}, moves:[], matchups:{},
  tab:'classement', viewSeat:null, dayId:null, poolRole:'ALL', poolTeam:'ALL', poolQuery:'', pending:null,
  tx:null, faRole:'ALL', confirmReset:false, room:null, peers:[], loaded:{config:false,picks:false,moves:false,matchups:false,leagues:false}, genBusy:{}, lid:null, leagues:[], joinCode:null, invite:undefined};
let M = null; // computed model

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => (Math.round(n*10)/10).toLocaleString('fr-FR',{minimumFractionDigits:1,maximumFractionDigits:1});
const pad = n => String(n).padStart(3,'0');
const store = {get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,3000)}
const dtFmt = new Intl.DateTimeFormat('fr-FR',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit',timeZone:'Europe/Paris'});
const dFmt = new Intl.DateTimeFormat('fr-FR',{weekday:'short',day:'numeric',month:'short',timeZone:'UTC'});
const dayDate = d => dFmt.format(new Date(d.date+'T12:00:00Z'));
const dLong = new Intl.DateTimeFormat('fr-FR',{weekday:'long',day:'numeric',month:'long',timeZone:'UTC'});
const dayLong = d => { const t = dLong.format(new Date(d.date+'T12:00:00Z')); return t.charAt(0).toUpperCase()+t.slice(1); };
const lockOf = d => new Date((S.config?.locks||{})[d.id] || d.lock);
const isLocked = d => Date.now() >= lockOf(d).getTime();
const seats = () => S.config?.seats || [];
const N = () => seats().length;
const seatName = i => seats()[i]?.name || '—';
const totalPicks = () => N()*PICKS_PER_SEAT;
const pname = pid => PLAYERS[pid]?.name || '—';

// ---------- Draft helpers ----------
function seatForPick(n){
  const order = S.config.order, k = order.length, round = Math.floor(n/k), idx = n%k;
  return order[round%2===0 ? idx : k-1-idx];
}
function draftSlots(){ const r = seats().map(()=>({})); S.picks.forEach(p => { if(r[p.seat]) r[p.seat][p.slot] = p.pid; }); return r; }
function draftOwner(){ const m={}; S.picks.forEach(p=>m[p.pid]=p.seat); return m; }
function draftDone(){ return !!S.config && N()>0 && S.picks.length >= totalPicks(); }
function onClock(){ if(!S.config || S.config.status!=='draft' || draftDone()) return null; return seatForPick(S.picks.length); }
const LG = () => 'leagues/'+S.lid;
const isComm = () => !!(S.config && S.me && S.config.owner === S.me);
function canActFor(seat){ if(S.readOnly) return false; if(isComm()) return true; const s = seats()[seat]; return !!(s && S.me && s.uid === S.me); }
function mySeat(){ if(!S.me) return null; const i = seats().findIndex(s=>s.uid===S.me); return i<0?null:i; }
// One position per round: 1 Top, 2 Jungle, 3 Mid, 4 ADC, 5 Support, 6 pro team, 7-8 subs (any player position, no team).
const MAIN_ROUNDS = 6;
const ROUND_ROLE = ['TOP','JNG','MID','ADC','SUP','TEAM'];
const ROUND_LABEL = ['Tops','Junglers','Mids','ADC','Supports','Équipes','Remplaçants','Remplaçants'];
const ROUND_ASK = ['ton Top','ton Jungler','ton Mid','ton ADC','ton Support','ton équipe','un remplaçant, n’importe quel poste','ton deuxième remplaçant, n’importe quel poste'];
function slotFor(roster, player){
  const filled = Object.keys(roster).length;
  if(filled >= PICKS_PER_SEAT) return null;
  if(filled < MAIN_ROUNDS) return player.role===ROUND_ROLE[filled] && !roster[player.role] ? player.role : null;
  if(player.role==='TEAM') return null;
  return !roster.SUB1 ? 'SUB1' : (!roster.SUB2 ? 'SUB2' : null);
}
function blockReason(roster, player){
  const filled = Object.keys(roster).length;
  if(filled >= MAIN_ROUNDS) return player.role==='TEAM' ? 'Pas en sub' : '';
  return player.role!==ROUND_ROLE[filled] ? 'Tour des '+ROUND_LABEL[filled] : '';
}

// ---------- Season engine (rosters replayed from draft + moves) ----------
const kindOf = pid => PLAYERS[pid].role==='TEAM' ? 'TEAM' : 'PLAYER';
function covers(list){ return ROLES.every(r=>list.some(p=>PLAYERS[p].role===r)) && list.filter(p=>PLAYERS[p].role==='TEAM').length===1; }
const windowOf = ms => { const i = DAYS.findIndex(d => lockOf(d).getTime() > ms); return i<0 ? DN : i; };
const moveTime = m => Date.parse(m.at) || 0;

function effectiveLineup(seat, k, roster){
  const out = {};
  ROLES.forEach(r => {
    let pick = null;
    for(let i=k;i>=0 && !pick;i--){ const lu = S.lineups[DAYS[i].id+'-s'+seat]; const pid = lu && lu[r]; if(pid && roster.includes(pid) && PLAYERS[pid]?.role===r) pick = pid; }
    out[r] = pick || roster.find(p=>PLAYERS[p].role===r) || null;
  });
  out.TEAM = roster.find(p=>PLAYERS[p].role==='TEAM') || null;
  out._saved = !!S.lineups[DAYS[k].id+'-s'+seat];
  return out;
}
// ---- Days without a match ----
// A pick whose pro team has no match that day scores its average of previous days:
// 100% if the team is still in the tournament (qualified, or simply not scheduled), 50% if it is eliminated.
const REST = {alive:1, out:0.5};
function teamPlayed(k, code){ const st = S.stats[DAYS[k]?.id]; return !!(st && st.teams && st.teams[code]); }
function teamState(k, code){
  let w = 0, l = 0, ko = false;
  for(let j=0;j<k;j++){
    const t = S.stats[DAYS[j].id]?.teams?.[code]; if(!t) continue;
    if(DAYS[j].stage==='Swiss'){ w += Number(t.sw)||0; l += Number(t.sl)||0; }
    else if((Number(t.sl)||0) > 0) ko = true;
  }
  return (l>=3 || ko) ? 'out' : (w>=3 ? 'qualified' : 'alive');
}
function pastAvg(pid, k){
  const p = PLAYERS[pid]; let sum = 0, n = 0;
  for(let j=0;j<k;j++){
    const st = S.stats[DAYS[j].id]; if(!st) continue;
    if(p.role==='TEAM'){ const t = st.teams?.[p.team]; if(t){ sum += teamPoints(t); n++; } }
    else { const s = st.players?.[pid]; if(s && Number(s.g)>0){ sum += playerPoints(s); n++; } }
  }
  return n ? sum/n : 0;
}
function pickScore(pid, k){
  const st = S.stats[DAYS[k].id]; if(!st || !pid) return {pts:0, note:''};
  const p = PLAYERS[pid];
  if(teamPlayed(k, p.team)) return {pts: p.role==='TEAM' ? teamPoints(st.teams[p.team]) : playerPoints(st.players?.[pid]), note:''};
  const state = teamState(k, p.team);
  return {pts: pastAvg(pid, k) * (state==='out' ? REST.out : REST.alive), note: state==='out' ? 'out' : 'rest'};
}
function scoreSeat(seat, k, roster, st){
  const lu = effectiveLineup(seat, k, roster); const parts = {}; let total = 0;
  const used = new Set([...ROLES.map(r=>lu[r]), lu.TEAM].filter(Boolean));
  ROLES.forEach(r => {
    let pid = lu[r];
    let sc = st && pid ? pickScore(pid, k) : {pts:0, note:''};
    // Auto-sub: a starter without a match gives way to a bench player of the same position who played, if he scored more
    if(st && pid && !teamPlayed(k, PLAYERS[pid].team)){
      const alt = roster.find(q => !used.has(q) && PLAYERS[q].role===r && teamPlayed(k, PLAYERS[q].team) && Number(st.players?.[q]?.g)>0);
      if(alt){ const asc = pickScore(alt, k); if(asc.pts > sc.pts){ used.add(alt); pid = alt; sc = {pts:asc.pts, note:'sub'}; } }
    }
    parts[r] = {pid, pts:sc.pts, note:sc.note}; total += sc.pts;
  });
  const c = lu.TEAM; const sc = st && c ? pickScore(c, k) : {pts:0, note:''};
  parts.TEAM = {pid:c, pts:sc.pts, note:sc.note}; total += sc.pts;
  return {seat, total, parts};
}
const NOTE_FR = {rest:'repos · moyenne', out:'éliminé · moyenne ×0,5', sub:'remplaçant auto'};
function stateTag(k, pid){
  if(!pid) return ''; const st = teamState(k, PLAYERS[pid].team);
  return st==='out' ? '<span class="plays no">Équipe éliminée</span>' : (st==='qualified' ? '<span class="plays yes">Équipe qualifiée</span>' : '');
}
function computeResult(E, k){
  const d = DAYS[k], mu = S.matchups[d.id], st = S.stats[d.id];
  if(!mu || !st || !Array.isArray(mu.pairs)) return null;
  const scores = {}; seats().forEach((_,s) => scores[s] = scoreSeat(s, k, E.snaps[k][s]||[], st));
  const duels = mu.pairs.filter(p => Array.isArray(p) && p.length===2 && scores[p[0]] && scores[p[1]]).map(([a,b]) => {
    const sa = scores[a].total, sb = scores[b].total, tie = Math.abs(sa-sb) < 1e-9;
    return {a, b, sa, sb, winner: tie?null:(sa>sb?a:b), loser: tie?null:(sa>sb?b:a)};
  });
  return {final: !!st.final, scores, duels};
}
function isFree(E, pid){ return !E.rosters.some(r => r.includes(pid)); }
function freeAgents(E){ return Object.keys(PLAYERS).filter(pid => isFree(E,pid)); }
function lockedOut(E, seat, w){
  const res = E.results[w-1]; if(!res) return false;
  const d = res.duels.find(x => x.loser===seat); return !!(d && !E.steals[(w-1)+':'+d.winner]);
}
function checkMove(E, m){
  const R = E.rosters, seat = m.seat, roster = R[seat];
  if(!roster) return 'Équipe inconnue';
  const w = windowOf(moveTime(m));
  if(m.type==='steal'){
    const k = DAYS.findIndex(d=>d.id===m.forDay);
    if(k<0 || w!==k+1) return 'Hors délai';
    const res = E.results[k]; if(!res || !res.final) return 'Résultats pas encore validés';
    const duel = res.duels.find(d=>d.winner===seat); if(!duel || duel.loser!==m.from) return 'Pas de victoire contre cette équipe';
    if(E.steals[k+':'+seat]) return 'Prise déjà faite';
    if(!R[m.from]?.includes(m.take)) return 'Ce joueur n’est plus chez l’adversaire';
    if(!roster.includes(m.release)) return 'Ce joueur n’est pas dans ton équipe';
    if(kindOf(m.take)!==kindOf(m.release)) return 'Une équipe s’échange uniquement contre une équipe';
    if(!covers(roster.filter(p=>p!==m.release).concat(m.take))) return 'Ton équipe doit garder au moins un joueur par poste';
    return null;
  }
  if(w<1 || w>=DN) return 'Mercato fermé';
  const prev = E.results[w-1]; if(!prev || !prev.final) return 'Mercato fermé tant que les stats de la journée ne sont pas validées';
  if(m.type==='refill'){
    if(roster.length!==PICKS_PER_SEAT-1) return 'Rien à remplacer';
    if(!PLAYERS[m.add] || !isFree(E,m.add)) return 'Ce pro n’est plus libre';
    const hasTeam = roster.some(p=>PLAYERS[p].role==='TEAM');
    if(hasTeam && PLAYERS[m.add].role==='TEAM') return 'Tu as déjà une équipe';
    if(!hasTeam && PLAYERS[m.add].role!=='TEAM') return 'Tu dois reprendre une équipe';
    if(!covers([...roster, m.add])){
      const miss = ROLES.find(r=>!roster.some(p=>PLAYERS[p].role===r));
      if(miss && freeAgents(E).some(p=>PLAYERS[p].role===miss)) return 'Il te manque un '+ROLE_FR[miss]+' : prends un '+ROLE_FR[miss];
    }
    return null;
  }
  if(m.type==='swap'){
    if(roster.length<PICKS_PER_SEAT) return 'Remplace d’abord le joueur qu’on t’a pris';
    if(lockedOut(E, seat, w)) return 'Attends que ton adversaire ait pris son joueur';
    if((E.swaps[w+':'+seat]||0) >= MAX_SWAPS) return 'Plus de changement disponible avant la prochaine journée';
    if(!roster.includes(m.drop)) return 'Ce joueur n’est pas dans ton équipe';
    if(!PLAYERS[m.add] || !isFree(E,m.add)) return 'Ce pro n’est plus libre';
    if(kindOf(m.add)!==kindOf(m.drop)) return 'Une équipe s’échange uniquement contre une équipe';
    if(!covers(roster.filter(p=>p!==m.drop).concat(m.add))) return 'Ton équipe doit garder au moins un joueur par poste';
    return null;
  }
  return 'Mouvement inconnu';
}
function applyMove(E, m){
  const R = E.rosters, w = windowOf(moveTime(m));
  if(m.type==='steal'){
    const k = DAYS.findIndex(d=>d.id===m.forDay);
    R[m.from] = R[m.from].filter(p=>p!==m.take);
    R[m.seat] = R[m.seat].filter(p=>p!==m.release).concat(m.take);
    E.steals[k+':'+m.seat] = m;
  } else if(m.type==='refill'){ R[m.seat] = R[m.seat].concat(m.add); }
  else if(m.type==='swap'){ R[m.seat] = R[m.seat].filter(p=>p!==m.drop).concat(m.add); E.swaps[w+':'+m.seat] = (E.swaps[w+':'+m.seat]||0)+1; }
}
function compute(){
  const E = {rosters: seats().map(()=>[]), snaps:{}, results:{}, steals:{}, swaps:{}, status:{}};
  [...S.picks].sort((a,b)=>a.n-b.n).forEach(p => { if(E.rosters[p.seat] && isFree(E,p.pid)) E.rosters[p.seat].push(p.pid); });
  const moves = [...S.moves].sort((a,b)=> moveTime(a)-moveTime(b) || (a.id<b.id?-1:1));
  let i = 0;
  const step = m => { const err = checkMove(E,m); E.status[m.id] = err; if(!err) applyMove(E,m); };
  for(let k=0;k<DN;k++){
    const lk = lockOf(DAYS[k]).getTime();
    while(i<moves.length && moveTime(moves[i]) < lk){ step(moves[i]); i++; }
    E.snaps[k] = E.rosters.map(r=>r.slice());
    E.results[k] = computeResult(E, k);
  }
  while(i<moves.length){ step(moves[i]); i++; }
  E.moves = moves;
  return E;
}
function standings(){
  const rows = seats().map((_,i)=>({seat:i, w:0, d:0, l:0, pts:0, played:0}));
  for(let k=0;k<DN;k++){
    const res = M.results[k]; if(!res) continue;
    res.duels.forEach(x => {
      [x.a,x.b].forEach(s=>{ rows[s].played++; rows[s].pts += res.scores[s].total; });
      if(x.winner===null){ rows[x.a].d++; rows[x.b].d++; } else { rows[x.winner].w++; rows[x.loser].l++; }
    });
  }
  return rows.sort((a,b)=> b.w-a.w || b.d-a.d || b.pts-a.pts || a.seat-b.seat);
}
function swissPairs(k){
  const rows = seats().map((_,i)=>({seat:i, w:0, d:0, pts:0}));
  const met = new Set();
  for(let j=0;j<k;j++){
    (S.matchups[DAYS[j].id]?.pairs||[]).forEach(([a,b])=>{ met.add(a+'-'+b); met.add(b+'-'+a); });
    const res = M.results[j]; if(!res) continue;
    res.duels.forEach(x=>{ rows[x.a].pts+=res.scores[x.a].total; rows[x.b].pts+=res.scores[x.b].total; if(x.winner===null){rows[x.a].d++;rows[x.b].d++;} else rows[x.winner].w++; });
  }
  const order = rows.sort((a,b)=> b.w-a.w || b.d-a.d || b.pts-a.pts || a.seat-b.seat).map(r=>r.seat);
  const used = new Set(), pairs = [];
  for(const a of order){
    if(used.has(a)) continue; used.add(a);
    let b = order.find(x=>!used.has(x) && !met.has(a+'-'+x));
    if(b===undefined) b = order.find(x=>!used.has(x));
    if(b===undefined) break;
    used.add(b); pairs.push([a,b]);
  }
  return pairs;
}
function randomPairs(n){
  const ids = Array.from({length: n ?? N()},(_,i)=>i); for(let i=ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]];}
  const pairs=[]; for(let i=0;i+1<ids.length;i+=2) pairs.push([ids[i],ids[i+1]]); return pairs;
}
function duelOf(k, seat){ const p = (S.matchups[DAYS[k]?.id]?.pairs||[]).find(x=>x.includes(seat)); return p ? (p[0]===seat?p[1]:p[0]) : null; }
const currentWindow = () => windowOf(Date.now());
const nextDay = () => DAYS[Math.min(currentWindow(), DN-1)];
function teamsPlaying(day){
  const sc = S.schedule[day.id]; if(!sc || !Array.isArray(sc.matches)) return null;
  const set = new Set(); sc.matches.forEach(m => (m||[]).forEach(t=>set.add(t))); return set;
}
function obligations(seat){
  // What this seat must or can do in the current mercato window
  const w = currentWindow(); const out = {w, open:false, reason:'', steal:null, waitSteal:null, refill:false, swapsLeft:0};
  if(w<1){ out.reason = 'Le mercato ouvre après la J1, dès que les stats sont validées.'; return out; }
  if(w>=DN){ out.reason = 'La saison est terminée.'; return out; }
  const res = M.results[w-1];
  if(!res || !res.final){ out.reason = `Le mercato ouvre dès que les stats de la J${w} sont validées (chaque matin vers 7h).`; return out; }
  out.open = true;
  const duel = res.duels.find(d=>d.a===seat||d.b===seat);
  if(duel && duel.winner===seat && !M.steals[(w-1)+':'+seat]) out.steal = {from:duel.loser, k:w-1};
  if(duel && duel.loser===seat && !M.steals[(w-1)+':'+duel.winner]) out.waitSteal = duel.winner;
  const roster = M.rosters[seat]||[];
  out.refill = roster.length===PICKS_PER_SEAT-1;
  out.needTeam = !roster.some(p=>PLAYERS[p].role==='TEAM');
  out.swapsLeft = (out.waitSteal!==null || roster.length<PICKS_PER_SEAT) ? 0 : Math.max(0, MAX_SWAPS-(M.swaps[w+':'+seat]||0));
  return out;
}
function todo(seat){ if(seat===null || !draftDone()) return false; const o = obligations(seat); return !!(o.steal || o.refill); }

function rollState(){ const r = S.config?.rolls; return r && Object.keys(r).length ? r : null; }

function startRollAnim(){
  const rolls = rollState(); if(!rolls) return;
  try{ if(matchMedia('(prefers-reduced-motion: reduce)').matches) return; }catch(_){}
  const asc = Object.keys(rolls).map(Number).sort((a,b)=>rolls[a]-rolls[b]); // lowest stops first, first pick last
  const t0 = Date.now(), stops = {};
  asc.forEach((s,k) => stops[s] = t0 + 900 + k*260);
  S.anim = {stops, end: t0 + 900 + asc.length*260 + 700};
  clearInterval(S.animTimer); S.animTimer = setInterval(tickRoll, 55);
  if(S.tab!=='draft'){ S.tab = 'draft'; }
  render();

function tickRoll(){
  if(!S.anim){ clearInterval(S.animTimer); return; }
  const now = Date.now(), rolls = rollState() || {};
  document.querySelectorAll('[data-roll-seat]').forEach(el => {
    const s = Number(el.dataset.rollSeat), stop = S.anim.stops[s];
    if(stop===undefined) return;
    if(now >= stop){ if(!el.classList.contains('done')){ el.textContent = rolls[s]; el.classList.add('done','pop'); } }
    else el.textContent = 1+Math.floor(Math.random()*100);
  });
  if(now >= S.anim.end){ clearInterval(S.animTimer); S.anim = null; render(); }
}

    return `<section class="cs">
      <div class="cs-top"><div class="cs-phase">Fantasy Worlds 2026</div><div class="cs-title">Roulette du first pick</div><div class="cs-sub">Chaque joueur tire un nombre de 1 à 100. Le plus gros score choisit en premier.</div></div>
      <div class="cs-grid">${left}${center}${right}</div>
    </section>`;
  }
  const center = `<div class="cs-center"><div class="cs-lobby">
      <div class="cs-phase">Salon de draft</div>
      <div class="cs-title" style="font-size:clamp(22px,4vw,30px)">${nReady} / ${N()} prêts</div>
      <div class="cs-bar"><span style="width:${N()?Math.round(nReady/N()*100):0}%"></span></div>
      ${me!==null && !S.readOnly ? `<button class="hexbtn ${iAmReady?'ready':''}" id="ready-toggle">${iAmReady?'Prêt ✓':'Prêt'}</button>${iAmReady?'<p>Clique à nouveau pour annuler.</p>':''}`
        : (S.me && !S.readOnly ? '<p>Rejoins ta place dans une des colonnes, puis clique sur Prêt.</p>' : '<p>Tu regardes le salon. Le commissaire peut faire les choix à la place des joueurs.</p>')}
      ${owner ? `<button class="ghost" id="roll-order">${nReady===N()?'Lancer la roulette':'Lancer la roulette sans attendre ('+nReady+'/'+N()+' prêts)'}</button>` : '<p>Quand tout le monde est prêt, le commissaire lance la roulette du first pick.</p>'}
      <p class="small">Roulette de 1 à 100 pour chacun : le plus gros score a le first pick. Draft en serpent, poste par poste : Tops, Junglers, Mids, ADC, Supports, équipes, puis 2 tours de remplaçants.</p>
    </div></div>`;
  return `<section class="cs">
    <div class="cs-top"><div class="cs-phase">Fantasy Worlds 2026</div><div class="cs-title">Sélection des joueurs</div><div class="cs-sub">En attente des joueurs</div></div>
    <div class="cs-grid">${left}${center}${right}</div>
  </section>`;
}

// Draft
function viewDraft(){
  if(!N()) return setupOrWait();
  if(S.config.status==='lobby') return viewLobby();
  const R = draftSlots(), own = draftOwner(), oc = onClock(), done = draftDone(), me = mySeat();
  const actor = oc!==null && canActFor(oc);
  const filled = oc!==null ? Object.keys(R[oc]).length : 0;
  // Follow the round: switch the pool filter to the position being drafted
  if(!done && S.lastRound!==filled){ S.lastRound = filled; S.poolRole = filled < MAIN_ROUNDS ? ROUND_ROLE[filled] : 'ALL'; S.poolTeam='ALL'; }
  const next = !done && S.picks.length+1 < totalPicks() ? seatForPick(S.picks.length+1) : null;
  const P = peerInfo();
  let title, sub;
  if(done){ title = 'Draft terminée'; sub = 'Place aux duels. Les effectifs évoluent ensuite dans le Mercato.'; }
  else if(oc===me){ title = 'À ton tour'; sub = 'Choisis '+ROUND_ASK[filled]+'.'; }
  else { title = 'Au tour de '+esc(seatName(oc)); sub = actor ? 'Tu peux choisir à sa place (commissaire).' : (next===me && me!==null ? '<b>Tu es le prochain.</b> Prépare ton choix.' : 'En attente de son choix.'); }
  const roster = oc!==null ? R[oc] : {};
  const q = S.poolQuery.trim().toLowerCase();
  const list = Object.values(PLAYERS).filter(p =>
    (S.poolRole==='ALL' || p.role===S.poolRole) && (S.poolTeam==='ALL' || p.team===S.poolTeam) &&
    (!q || p.name.toLowerCase().includes(q) || p.team.toLowerCase().includes(q)));
  list.sort((a,b)=> (own[a.id]!==undefined) - (own[b.id]!==undefined) || TEAMS.findIndex(t=>t.code===a.team)-TEAMS.findIndex(t=>t.code===b.team) || ALLR.indexOf(a.role)-ALLR.indexOf(b.role));
  const tiles = list.map(p => {
    const taken = own[p.id]!==undefined;
    const slot = !taken && oc!==null ? slotFor(roster,p) : null;
    const clickable = actor && !taken && !!slot;
    const why = taken ? esc(seatName(own[p.id])) : (oc!==null && !slot ? blockReason(roster,p) : (slot && slot.startsWith('SUB') ? 'Remplaçant' : ''));
    const hb = (P.hoveredBy[p.id]||[]).filter(s=>s!==me);
    return `<button class="cst ${taken?'taken':''} ${!taken&&oc!==null&&!slot?'blocked':''} ${S.pending===p.id?'sel':''} ${hb.length?'peer':''}" data-pick="${p.id}" data-team="${p.team}" style="--rc:var(--r-${p.role.toLowerCase()})" ${clickable?'':'disabled'} title="${esc(p.name)} · ${p.team} · ${ROLE_FR[p.role]}">
      <span class="rb"></span>${hb.length?`<span class="hv">${esc(seatName(hb[0]))} survole</span>`:''}
      <span class="tr">${p.role==='JNG'?'JGL':(p.role==='TEAM'?'ÉQUIPE':p.role)}</span><span class="nm">${esc(p.name)}</span><span class="ow">${p.role==='TEAM'?p.team:(why||p.team)}</span></button>`;
  }).join('') || '<p style="color:var(--cs-muted)">Aucun joueur ne correspond.</p>';
  const sel = S.pending && PLAYERS[S.pending] && oc!==null ? PLAYERS[S.pending] : null;
  const selSlot = sel ? slotFor(roster, sel) : null;
  const lock = done ? '' : `<div class="cs-lock">
      <div class="what">${sel && selSlot ? `<b>${esc(sel.name)}</b> · ${sel.team} → ${SLOT_FR[selSlot]}${oc!==me?' pour <b>'+esc(seatName(oc))+'</b>':''}` : (actor ? 'Clique sur un joueur pour le survoler, puis verrouille.' : 'Les joueurs survolés par les autres apparaissent en bleu.')}</div>
      <div class="row">${sel?'<button class="ghost" id="pick-cancel">Annuler</button>':''}<button class="hexbtn" id="pick-ok" ${actor && sel && selSlot ? '' : 'disabled'}>Verrouiller</button></div></div>`;
  const teamOpts = ['ALL',...TEAMS.map(t=>t.code)].map(c=>`<option value="${c}" ${S.poolTeam===c?'selected':''}>${c==='ALL'?'Toutes les équipes':c+' · '+esc(TEAMS.find(t=>t.code===c).name)}</option>`).join('');
  const [left, right] = csSides('draft');
  const last = S.picks.slice(-8).reverse().map(p=>`<span>#${p.n+1} <b>${esc(seatName(p.seat))}</b> → ${esc(pname(p.pid))}</span>`).join('');
  const round = Math.min(Math.floor(S.picks.length/N())+1, PICKS_PER_SEAT);
  return `<section class="cs">
    <div class="cs-top">
      <div class="cs-count">${done?'':`Choix ${S.picks.length+1} / ${totalPicks()}`}</div>
      <div class="cs-phase">${done ? 'Draft terminée' : `Tour ${round} / ${PICKS_PER_SEAT} · ${ROUND_LABEL[round-1]}`}</div>
      <div class="cs-title ${oc===me&&!done?'me':''}">${title}</div>
      <div class="cs-sub">${sub}</div>
      ${done?'':`<div class="cs-timer" id="cs-timer">${clock(lastPickTime())}</div>`}
    </div>
    <div class="cs-grid">${left}
      <div class="cs-center">
        <div class="cs-filters">
          <div class="cs-seg">${['ALL',...ALLR].map(r=>`<button data-role="${r}" aria-pressed="${S.poolRole===r}">${r==='ALL'?'Tous':(r==='JNG'?'JGL':r==='TEAM'?'Équipes':r)}</button>`).join('')}</div>
          <select class="in" id="pool-team" aria-label="Équipe">${teamOpts}</select>
          <input class="in" id="pool-q" placeholder="Chercher un joueur" value="${esc(S.poolQuery)}" aria-label="Chercher un joueur">
        </div>
        <div class="cs-pool">${tiles}</div>
        ${lock}
      </div>${right}
    </div>
    ${last?`<div class="cs-log">${last}</div>`:''}
    ${isComm() && !S.readOnly && S.picks.length ? '<div><button class="ghost" id="undo-pick">Annuler le dernier choix</button></div>' : ''}
  </section>`;
}

// Lineup
function viewLineup(){
  if(!N()) return setupOrWait();
  if(!draftDone()) return `<div class="panel stack"><h2>Compo</h2><p class="lede">Les compos s’ouvrent une fois la draft terminée (${S.picks.length}/${totalPicks()} choix faits).</p></div>`;
  const seat = S.viewSeat ?? 0; const day = DAYS.find(d=>d.id===S.dayId) || nextDay(); const k = day.i;
  const locked = isLocked(day); const roster = locked ? (M.snaps[k][seat]||[]) : (M.rosters[seat]||[]);
  const lu = effectiveLineup(seat, k, roster);
  const editable = canActFor(seat) && (!locked || isComm());
  const playing = teamsPlaying(day);
  const playTag = pid => { if(!pid) return ''; const stTag = stateTag(k, pid); if(!playing) return stTag; return (playing.has(PLAYERS[pid].team) ? '<span class="plays yes">Joue ce jour</span>' : '<span class="plays no">Ne joue pas</span>') + (stTag ? ' '+stTag : ''); };
  const rows = ROLES.map(r => {
    const opts = roster.filter(p=>PLAYERS[p].role===r);
    const field = !lu[r] ? '<div class="err">Aucun joueur à ce poste</div>' : (editable && opts.length>1
      ? `<select class="in" id="lu-${r}">${opts.map(pid=>`<option value="${pid}" ${lu[r]===pid?'selected':''}>${esc(pname(pid))} · ${PLAYERS[pid].team}</option>`).join('')}</select>`
      : `<div><b>${esc(pname(lu[r]))}</b> <span class="team">${PLAYERS[lu[r]].team}</span></div>`);
    return `<div class="lu-row"><span class="chip rc-${r}">${ROLE_FR[r]}</span>${field}${playTag(lu[r])}</div>`;
  }).join('') + `<div class="lu-row"><span class="chip rc-TEAM">Équipe</span><div><b>${esc(lu.TEAM?pname(lu.TEAM):'Aucune équipe')}</b></div>${playTag(lu.TEAM)}</div>`;
  const starters = new Set([...ROLES.map(r=>lu[r]), lu.TEAM]);
  const bench = roster.filter(p=>!starters.has(p)).map(pid=>`${esc(pname(pid))} <span class="chip rc-${PLAYERS[pid].role}">${ROLE_FR[PLAYERS[pid].role]}</span>`).join(' · ');
  const opp = duelOf(k, seat);
  const dayBtns = DAYS.map(d=>`<button class="day" data-luday="${d.id}" aria-pressed="${d===day}"><div class="dn">J${d.n}</div><div class="dd">${esc(dayDate(d))}</div><div class="dw muted">${isLocked(d)?'Verrouillée':'Ouverte'}</div></button>`).join('');
  return `<section class="stack">
    <div><h2>Compo de ${esc(seatName(seat))}</h2><p class="lede">Choisis un titulaire par poste parmi ton effectif. Sans changement, ta compo précédente est reprise.</p></div>
    <div class="days">${dayBtns}</div>
    <div class="spread"><div><b>J${day.n} · ${esc(dayLong(day))} · ${esc(day.fmt)}</b>${opp!==null?` · contre <b>${esc(seatName(opp))}</b>`:''} <span class="muted small">— ${locked?'verrouillée depuis':'verrouillage'} ${esc(dtFmt.format(lockOf(day)))}</span></div>
      <span class="pill ${locked?'':'good'}">${locked?'Verrouillée':'Modifiable'}</span></div>
    ${!playing ? '<div class="notice info small">Le programme de cette journée n’est pas encore connu. Il s’affiche dès le tirage du tour.</div>' : ''}
    ${roster.length<PICKS_PER_SEAT && !locked ? '<div class="notice small">Ton effectif est incomplet : remplace le joueur qu’on t’a pris dans le Mercato.</div>' : ''}
    <div class="lineup">${rows}</div>
    <div class="muted small">Banc : ${bench||'—'}</div>
    ${editable ? `<div class="row"><button class="btn primary" id="lu-save">Enregistrer pour la J${day.n}</button>${locked?'<span class="err small">Journée verrouillée : modification commissaire.</span>':''}</div>` : (canActFor(seat)?'':'<div class="muted small">Seul le propriétaire de cette équipe (ou le commissaire) peut modifier la compo.</div>')}
  </section>`;
}

// Mercato
function playerCard(pid, opts={}){
  const p = PLAYERS[pid];
  return `<button class="card ${opts.cls||''}" ${opts.attr||''} ${opts.disabled?'disabled':''}>
    <div class="meta"><span class="chip rc-${p.role}">${ROLE_FR[p.role]}</span><span class="team">${p.team}</span></div>
    <div class="pn">${esc(p.name)}</div><div class="owner">${opts.note||'&nbsp;'}</div></button>`;
}
function viewMercato(){
  if(!N()) return setupOrWait();
  if(!draftDone()) return `<div class="panel stack"><h2>Mercato</h2><p class="lede">Le mercato s’ouvre après la draft et la première journée.</p></div>`;
  const seat = S.viewSeat ?? 0; const o = obligations(seat); const act = canActFor(seat);
  const roster = (M.rosters[seat]||[]).slice().sort((a,b)=>ROLE_ORDER(a)-ROLE_ORDER(b));
  const fa = freeAgents(M).filter(p=>S.faRole==='ALL'||PLAYERS[p].role===S.faRole).sort((a,b)=>ROLE_ORDER(a)-ROLE_ORDER(b) || TEAMS.findIndex(t=>t.code===PLAYERS[a].team)-TEAMS.findIndex(t=>t.code===PLAYERS[b].team));
  const tx = S.tx && S.tx.seat===seat ? S.tx : null;
  const nd = DAYS[Math.min(o.w, DN-1)];
  let blocks = [];
  if(!o.open){
    blocks.push(`<div class="notice info">${esc(o.reason)}</div>`);
  } else {
    const deadline = `avant le verrouillage de la J${nd.n} (${esc(dtFmt.format(lockOf(nd)))})`;
    // 1. Steal
    if(o.steal){
      const from = o.steal.from; const opp = (M.rosters[from]||[]).slice().sort((a,b)=>ROLE_ORDER(a)-ROLE_ORDER(b));
      const t = tx && tx.mode==='steal' ? tx : null;
      const releaseOk = pid => t && t.a && kindOf(pid)===kindOf(t.a) && covers(roster.filter(p=>p!==pid).concat(t.a));
      blocks.push(`<section class="panel step">
        <div class="step-h"><span class="n">Victoire</span><h3>Prends un joueur à ${esc(seatName(from))}</h3><span class="muted small">${deadline}</span></div>
        <p class="muted small" style="margin:0">Choisis un joueur de son effectif, puis celui que tu relâches (il devient libre). Une équipe se prend contre ton équipe.</p>
        <div class="label">1 · Joueur à prendre</div>
        <div class="pool">${opp.map(pid=>playerCard(pid,{attr:`data-steal="${pid}"`, cls:t?.a===pid?'sel':'', disabled:!act})).join('')}</div>
        ${t && t.a ? `<div class="label">2 · Joueur à relâcher</div><div class="pool">${roster.map(pid=>playerCard(pid,{attr:`data-release="${pid}"`, cls:t.b===pid?'out':'', disabled:!act||!releaseOk(pid), note:releaseOk(pid)?'':'Impossible'})).join('')}</div>` : ''}
        ${t && t.a && t.b ? `<div class="confirm"><div>Prendre <b>${esc(pname(t.a))}</b> et relâcher <b>${esc(pname(t.b))}</b> ?</div><div class="row"><button class="btn" id="tx-cancel">Annuler</button><button class="btn primary" id="tx-ok">Valider</button></div></div>` : ''}
      </section>`);
    } else if(M.steals[(o.w-1)+':'+seat]){
      const m = M.steals[(o.w-1)+':'+seat];
      blocks.push(`<div class="notice info small">Prise faite : <b>${esc(pname(m.take))}</b> récupéré chez ${esc(seatName(m.from))}, <b>${esc(pname(m.release))}</b> relâché.</div>`);
    }
    if(o.waitSteal!==null) blocks.push(`<div class="notice">Tu as perdu contre <b>${esc(seatName(o.waitSteal))}</b>. Il choisit un joueur dans ton équipe. Ton mercato s’ouvre dès que c’est fait.</div>`);
    // 2. Refill
    if(o.refill){
      const t = tx && tx.mode==='refill' ? tx : null;
      const miss = ROLES.find(r=>!roster.some(p=>PLAYERS[p].role===r));
      const cand = freeAgents(M).filter(p => o.needTeam ? PLAYERS[p].role==='TEAM' : PLAYERS[p].role!=='TEAM').sort((a,b)=>ROLE_ORDER(a)-ROLE_ORDER(b));
      const okAdd = pid => !checkMove(M,{type:'refill', seat, add:pid, at:new Date().toISOString()});
      blocks.push(`<section class="panel step">
        <div class="step-h"><span class="n">Remplacement gratuit</span><h3>${o.needTeam?'Reprends une équipe':'Complète ton effectif'}</h3><span class="muted small">ne compte pas dans tes changements</span></div>
        <p class="muted small" style="margin:0">${o.needTeam?'On t’a pris ton équipe : choisis une équipe libre.':(miss?`Il te manque un ${ROLE_FR[miss]} : choisis un ${ROLE_FR[miss]} libre.`:'Choisis n’importe quel pro libre.')}</p>
        <div class="pool">${cand.map(pid=>playerCard(pid,{attr:`data-refill="${pid}"`, cls:t?.a===pid?'sel':'', disabled:!act||!okAdd(pid)})).join('')}</div>
        ${t && t.a ? `<div class="confirm"><div>Ajouter <b>${esc(pname(t.a))}</b> à ton effectif ?</div><div class="row"><button class="btn" id="tx-cancel">Annuler</button><button class="btn primary" id="tx-ok">Valider</button></div></div>` : ''}
      </section>`);
    }
    // 3. Swaps
    const t = tx && tx.mode==='swap' ? tx : null;
    const dropOk = pid => t && t.a && kindOf(pid)===kindOf(t.a) && covers(roster.filter(p=>p!==pid).concat(t.a));
    blocks.push(`<section class="panel step">
      <div class="step-h"><span class="n">Changements</span><h3>Échanger avec un pro libre</h3><span class="pill ${o.swapsLeft?'good':''}">${o.swapsLeft} / ${MAX_SWAPS} restants</span></div>
      <p class="muted small" style="margin:0">${o.swapsLeft ? `Choisis un pro libre ci-dessous, puis le joueur de ton effectif qu’il remplace, ${deadline}.` : (o.waitSteal!==null ? 'Disponible après la prise de ton adversaire.' : (roster.length<PICKS_PER_SEAT ? 'Disponible une fois ton effectif complété.' : 'Tu as utilisé tes changements pour cette journée.'))}</p>
      ${t && t.a ? `<div class="label">Joueur qui sort pour ${esc(pname(t.a))}</div><div class="pool">${roster.map(pid=>playerCard(pid,{attr:`data-drop="${pid}"`, cls:t.b===pid?'out':'', disabled:!act||!dropOk(pid), note:dropOk(pid)?'':'Impossible'})).join('')}</div>` : ''}
      ${t && t.a && t.b ? `<div class="confirm"><div>Faire entrer <b>${esc(pname(t.a))}</b> à la place de <b>${esc(pname(t.b))}</b> ?</div><div class="row"><button class="btn" id="tx-cancel">Annuler</button><button class="btn primary" id="tx-ok">Valider</button></div></div>` : ''}
    </section>`);
  }
  const swapOn = o.open && o.swapsLeft>0 && act;
  const faHtml = `<section class="stack">
    <div class="spread"><h3>Joueurs et équipes libres (${freeAgents(M).length})</h3>
      <div class="filters"><div class="seg">${['ALL',...ALLR].map(r=>`<button data-farole="${r}" aria-pressed="${S.faRole===r}">${r==='ALL'?'Tous':ROLE_FR[r]}</button>`).join('')}</div></div></div>
    <div class="pool">${fa.map(pid=>playerCard(pid,{attr:`data-swapin="${pid}"`, cls:tx?.mode==='swap'&&tx.a===pid?'sel':'', disabled:!swapOn, note: teamState(Math.min(currentWindow(),DN-1), PLAYERS[pid].team)==='out' ? 'Équipe éliminée' : (swapOn?'Faire entrer':'')})).join('') || '<p class="muted">Aucun pro libre à ce poste.</p>'}</div>
  </section>`;
  const teams = `<section class="stack"><h3>Effectifs actuels</h3><div class="rosters wide">${seats().map((_,i)=>{
      const r = (M.rosters[i]||[]).slice().sort((a,b)=>ROLE_ORDER(a)-ROLE_ORDER(b));
      return `<div class="roster ${i===seat?'now':''}"><div class="rh"><b>${esc(seatName(i))}</b><span class="muted small">${r.length}/${PICKS_PER_SEAT}</span></div>
        <div class="slots">${r.map(pid=>`<div class="slot"><div class="sl">${ROLE_FR[PLAYERS[pid].role]}</div><div class="sv">${esc(pname(pid))}</div></div>`).join('')}</div></div>`;}).join('')}</div></section>`;
  const log = M.moves.slice().reverse().slice(0,40).map(m=>{
    const bad = M.status[m.id]; const k = windowOf(moveTime(m));
    const txt = m.type==='steal' ? `<b>${esc(seatName(m.seat))}</b> prend ${esc(pname(m.take))} à ${esc(seatName(m.from))}, relâche ${esc(pname(m.release))}`
      : m.type==='refill' ? `<b>${esc(seatName(m.seat))}</b> remplace avec ${esc(pname(m.add))}`
      : `<b>${esc(seatName(m.seat))}</b> fait entrer ${esc(pname(m.add))}, sort ${esc(pname(m.drop))}`;
    return `<div><span class="pill">avant J${Math.min(k+1,DN)}</span><span class="${bad?'void':''}">${txt}</span>${bad?`<span class="err small">annulé : ${esc(bad)}</span>`:''}</div>`;
  }).join('') || '<span class="muted">Aucun mouvement pour l’instant.</span>';
  return `<section class="stack"><div><h2>Mercato de ${esc(seatName(seat))}</h2><p class="lede">Après chaque journée : le gagnant de chaque duel prend un joueur au perdant, le perdant se renforce gratuitement, puis chacun peut faire ${MAX_SWAPS} changements avec les pros libres.</p></div>
    ${blocks.join('')}</section>${faHtml}${teams}
    <section class="stack"><div class="spread"><h3>Historique</h3>${isComm()&&!S.readOnly&&S.moves.length?'<button class="btn sm" id="undo-move">Annuler le dernier mouvement</button>':''}</div><div class="panel log">${log}</div></section>`;
}

// Journées
function viewDays(){
  if(!N()) return setupOrWait();
  const day = DAYS.find(d=>d.id===S.dayId) || DAYS[[...Array(DN).keys()].reverse().find(k=>M.results[k]) ?? 0];
  const k = day.i, res = M.results[k], st = S.stats[day.id];
  const dayBtns = DAYS.map(d=>`<button class="day" data-dsday="${d.id}" aria-pressed="${d===day}"><div class="dn">J${d.n}</div><div class="dd">${esc(dayDate(d))}</div><div class="dw muted">${S.stats[d.id]?(S.stats[d.id].final?'Stats finales':'Provisoires'):'—'}</div></button>`).join('');
  const sched = S.schedule[day.id]?.matches;
  const schedHtml = Array.isArray(sched) && sched.length ? `<div class="row small"><span class="label">Matchs pros</span>${sched.map(m=>`<span class="pill">${esc(m[0])} vs ${esc(m[1])}</span>`).join('')}</div>` : '';
  const pairs = S.matchups[day.id]?.pairs || [];
  let body;
  if(res){
    const order = res.duels.flatMap(x=>[x.a,x.b]);
    body = `<div class="duels">${res.duels.map(x=>duelCard(x.a,x.b,x.sa,x.sb,x.winner)).join('')}</div>
    <div class="tscroll"><table>
    <thead><tr><th>Joueur</th>${ALLR.map(r=>`<th>${ROLE_FR[r]}</th>`).join('')}<th class="r">Total</th></tr></thead>
    <tbody>${order.map(s=>{const x=res.scores[s]; const d=res.duels.find(z=>z.a===s||z.b===s); const tag = d.winner===s?'<span class="pill good">Victoire</span>':(d.winner===null?'<span class="pill">Nul</span>':'<span class="pill bad">Défaite</span>');

function topPlayers(st, k){
  const arr = Object.entries(st.players||{}).filter(([pid])=>PLAYERS[pid]).map(([pid,s])=>({pid,s,pts:playerPoints(s)})).sort((a,b)=>b.pts-a.pts).slice(0,10);

  const snap = M.snaps[k]; const ownerAt = pid => snap.findIndex(r=>r.includes(pid));
  return `<h3>Meilleurs pros de la journée</h3><div class="tscroll"><table>

}

function toLocalInput(d){ const z=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}T${z(d.getHours())}:${z(d.getMinutes())}`; }

// ---------- Writes ----------
async function write(fn, okMsg){
  try{ const r = await fn(); if(okMsg && r!==false) toast(okMsg); }
  catch(e){
    if(e && e.code==='invalid_argument'){ S.readOnly = true; toast('Tu peux consulter la partie mais pas la modifier.'); render(); }
    else if(e && e.code==='quota_exceeded'){ toast('Espace de stockage plein.'); }
    else { toast('Échec de l’enregistrement, réessaie.'); }
  }
}
async function toggleReady(){
  const me = mySeat(); if(me===null) return;
  const cur = !!(S.config.ready||{})[me];
  await write(()=>S.db.doc(LG()).update({ready:{[String(me)]: !cur}}), cur ? 'Tu n’es plus prêt' : 'Prêt !');
}
async function rollOrder(){
  if(!isComm() || rollState()) return;
  // Distinct values 1-100, so ties never happen
  const pool = Array.from({length:100},(_,i)=>i+1);
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
  const rolls = {}; seats().forEach((_,i)=>rolls[String(i)] = pool[i]);
  const order = seats().map((_,i)=>i).sort((a,b)=>pool[b]-pool[a]);
  await write(()=>S.db.doc(LG()).update({rolls, order, rolledAt:new Date().toISOString()}));
}
async function launchDraft(){
  if(!isComm()) return;
  if(!rollState()){ toast('Lance d’abord la roulette du first pick.'); return; }
  await write(()=>S.db.doc(LG()).update({status:'draft', startedAt:new Date().toISOString()}), 'La draft commence');
}
async function claimSeat(i){
  const ref = S.db.doc(LG());
  await write(async()=>{
    const lease = await ref.acquire({holder:S.me, ttlMs:5000});
    if(!lease.acquired){ toast('Quelqu’un réclame une place, réessaie.'); return false; }
    const cfg = (await ref.get()).data(); if(!cfg) return false;
    const ss = cfg.seats.map(s=>({...s}));
    if(ss.some(s=>s.uid===S.me)) return false;
    if(ss[i].uid){ toast('Cette place est déjà prise.'); return false; }
    ss[i].uid = S.me; const members = [...(cfg.members||[])]; if(!members.includes(S.me)) members.push(S.me); await ref.update({seats:ss, members});
    S.viewSeat = i; store.set('fw-view:'+S.lid, String(i)); toast('Place réclamée : '+ss[i].name);
  });
}
async function confirmPick(){
  const pid = S.pending; const n = S.picks.length; const seat = onClock(); S.pending = null;
  if(seat===null || !canActFor(seat)) return render();
  const slot = slotFor(draftSlots()[seat], PLAYERS[pid]);
  if(!slot || draftOwner()[pid]!==undefined){ toast('Ce choix n’est plus possible.'); return render(); }
  const ref = S.db.doc(LG()+'/picks/p'+pad(n));
  await write(async()=>{
    const lease = await ref.acquire({holder:S.me||'owner', ttlMs:5000});
    if(!lease.acquired){ toast('Un autre choix est en cours.'); return false; }
    const snap = await ref.get(); if(snap.exists && snap.data().pid){ toast('Ce choix vient d’être fait.'); return false; }
    await ref.set({n, seat, pid, slot, at:new Date().toISOString(), by:S.me||null});
    toast(pname(pid)+' verrouillé pour '+seatName(seat));
  });
  setPresence({hover:null});
}
async function undoPick(){ const last = S.picks[S.picks.length-1]; if(!last) return; await write(()=>S.db.doc(LG()+'/picks/p'+pad(last.n)).delete(),'Dernier choix annulé'); }
async function saveLineup(){
  const seat = S.viewSeat ?? 0; const day = DAYS.find(d=>d.id===S.dayId) || nextDay(); const k = day.i;
  const locked = isLocked(day); if(locked && !isComm()){ toast('Journée verrouillée.'); return; }
  const roster = locked ? M.snaps[k][seat] : M.rosters[seat];
  const cur = effectiveLineup(seat, k, roster);
  const data = {seat, day:day.id, savedAt:new Date().toISOString(), by:S.me||null};
  for(const r of ROLES){ const v = $('#lu-'+r)?.value || cur[r]; if(v){ if(!roster.includes(v) || PLAYERS[v].role!==r){ toast('Compo invalide au poste '+ROLE_FR[r]); return; } data[r]=v; } }
  await write(()=>S.db.doc(LG()+'/lineups/'+day.id+'-s'+seat).set(data), 'Compo enregistrée pour la J'+day.n);
}
async function submitMove(m){
  S.tx = null;
  m.at = new Date().toISOString(); m.by = S.me || null;
  const err = checkMove(M, m); if(err){ toast(err); render(); return; }
  const id = 'm'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  m.id = id;
  await write(async()=>{
    const lock = S.db.doc(LG()+'/locks/mercato');
    const lease = await lock.acquire({holder:S.me||'owner', ttlMs:4000});
    if(!lease.acquired){ toast('Un autre mouvement est en cours, réessaie.'); return false; }
    await S.db.doc(LG()+'/moves/'+id).set(m);
  }, m.type==='steal' ? pname(m.take)+' rejoint '+seatName(m.seat) : m.type==='refill' ? pname(m.add)+' rejoint '+seatName(m.seat) : 'Changement enregistré');
}
async function undoMove(){ const last = M.moves[M.moves.length-1]; if(!last) return; await write(()=>S.db.doc(LG()+'/moves/'+last.id).delete(), 'Dernier mouvement annulé'); }
async function saveLocks(){
  const locks = {};
  DAYS.forEach(d=>{ const v=$('#lock-'+d.id)?.value; if(v){ const t=new Date(v); if(!isNaN(t) && t.getTime()!==new Date(d.lock).getTime()) locks[d.id]=t.toISOString(); }});
  await write(()=>S.db.doc(LG()).update({locks}), 'Verrous enregistrés');
}
async function regenPairs(){ const nd = nextDay(); if(isLocked(nd)) return; S.genBusy={}; await write(()=>S.db.doc(LG()+'/matchups/'+nd.id).delete(), 'Affiches retirées : elles vont être recalculées'); }
async function resetAll(){
  S.confirmReset=false;
  await write(async()=>{
    for(const p of [...S.picks].reverse()) await S.db.doc(LG()+'/picks/p'+pad(p.n)).delete();
    for(const k of Object.keys(S.lineups)) await S.db.doc(LG()+'/lineups/'+k).delete();
    for(const m of S.moves) await S.db.doc(LG()+'/moves/'+m.id).delete();
    for(const k of Object.keys(S.matchups)) await S.db.doc(LG()+'/matchups/'+k).delete();
    const cfg = {...S.config, status:'lobby', ready:{}, rolls:null, rolledAt:null, startedAt:null, order:seats().map((_,i)=>i)};
    await S.db.doc(LG()).set(cfg);
    await S.db.doc(LG()+'/matchups/d01').set({pairs: randomPairs(), createdAt:new Date().toISOString(), how:'tirage'});
  }, 'Partie réinitialisée : retour au salon');
}
// Pairings are generated by whichever player opens the page first once they are due
async function maybeGenerate(){
  if(!M || S.readOnly || !S.config || !N() || (!isComm() && mySeat()===null)) return;
  let k = -1, how = 'swiss';
  if(!S.matchups.d01) { k = 0; how = 'tirage'; }
  else for(let j=1;j<DN;j++){ if(!S.matchups[DAYS[j].id] && S.matchups[DAYS[j-1].id] && M.results[j-1]?.final){ k=j; break; } }
  if(k<0 || S.genBusy[k]) return;
  S.genBusy[k] = true;
  try{
    const ref = S.db.doc(LG()+'/matchups/'+DAYS[k].id);
    const lease = await ref.acquire({holder:S.me||'owner', ttlMs:5000});
    if(!lease.acquired) return;
    const snap = await ref.get(); if(snap.exists && snap.data().pairs) return;
    await ref.set({pairs: k===0 ? randomPairs() : swissPairs(k), createdAt:new Date().toISOString(), how});
  }catch(e){ S.genBusy[k] = false; }
}

  </section>`;
  return `<section class="stack"><div><h2>Ligues</h2><p class="lede">Les ligues où tu joues, l’invitation de ta ligue et la création d’une nouvelle ligue.</p></div>
    ${join}<h3>Mes ligues</h3><div class="rosters wide">${mine}</div>${invite}${create}</section>`;
}
async function createLeague(){
  const name = ($('#lg-name')?.value||'').trim() || 'Ma ligue';
  const pseudo = ($('#lg-pseudo')?.value||'').trim() || 'Joueur 1';
  const n = Number(store.get('fw-setup-n')) || 8;
  const lid = 'L'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  const seatsArr = Array.from({length:n},(_,i)=> i===0 ? {name:pseudo, uid:S.me} : {name:'Place libre', uid:null});
  const cfg = {name, owner:S.me, members:[S.me], code:genCode(), size:n, status:'lobby', seats:seatsArr, order:seatsArr.map((_,i)=>i), ready:{}, locks:{}, createdAt:new Date().toISOString()};
  let ok = false;
  await write(async()=>{
    await S.db.doc('leagues/'+lid).set(cfg);
    await S.db.doc('leagues/'+lid+'/matchups/d01').set({pairs: randomPairs(n), createdAt:new Date().toISOString(), how:'tirage'});
    ok = true;
  }, 'Ligue créée : '+name);
  if(ok){ openLeague(lid); S.tab = 'ligues'; render(); }
}
async function findInvite(){
  if(!S.db || !S.joinCode) return;
  try{ const qs = await S.db.collection('leagues').where('code','==',S.joinCode).limit(1).get(); S.invite = qs.docs[0] ? {id:qs.docs[0].id, ...qs.docs[0].data()} : false; }
  catch(e){ S.invite = false; }
  render();
}
async function joinLeague(seatIdx){
  const inv = S.invite; if(!inv) return;
  const pseudo = ($('#join-pseudo')?.value||'').trim();
  const ref = S.db.doc('leagues/'+inv.id); let ok = false;
  await write(async()=>{
    const lease = await ref.acquire({holder:S.me, ttlMs:5000});
    if(!lease.acquired){ toast('Quelqu’un rejoint la ligue en même temps, réessaie.'); return false; }
    const cfg = (await ref.get()).data(); if(!cfg){ toast('Cette ligue n’existe plus.'); return false; }
    const ss = cfg.seats.map(s=>({...s})); const members = [...(cfg.members||[])];
    if(!ss.some(s=>s.uid===S.me)){
      let i = seatIdx; if(i==null || !ss[i] || ss[i].uid) i = ss.findIndex(s=>!s.uid);
      if(i<0){ toast('Cette ligue est complète.'); return false; }
      ss[i] = {name: pseudo || (ss[i].name!=='Place libre' ? ss[i].name : 'Joueur '+(i+1)), uid:S.me};
    }
    if(!members.includes(S.me)) members.push(S.me);
    await ref.update({seats:ss, members}); ok = true;
  }, 'Bienvenue dans '+inv.name);
  if(ok){ S.joinCode = null; S.invite = null; try{history.replaceState(null,'','#draft')}catch(_){} openLeague(inv.id); S.tab='draft'; render(); }
}
async function copyInvite(){
  const el = $('#invite-link'); if(!el) return;
  try{ await navigator.clipboard.writeText(el.value); toast('Lien copié'); }
  catch(e){ el.focus(); el.select(); toast('Sélectionné : copie-le avec Ctrl+C'); }
}

// ---------- Events ----------
document.addEventListener('click', e => {
  const t = e.target.closest('button'); if(!t) return;
  const seat = S.viewSeat ?? 0;
  if(t.dataset.tab){ S.tab=t.dataset.tab; try{history.replaceState(null,'','#'+S.tab)}catch(_){} S.pending=null; S.tx=null; render(); return; }
  if(t.dataset.setupn){ store.set('fw-setup-n', t.dataset.setupn); render(); return; }
  if(t.dataset.role){ S.poolRole=t.dataset.role; render(); return; }
  if(t.dataset.farole){ S.faRole=t.dataset.farole; render(); return; }
  if(t.dataset.pick){ S.pending=t.dataset.pick; setPresence({hover:S.pending}); render(); return; }
  if(t.id==='pick-cancel'){ S.pending=null; setPresence({hover:null}); render(); return; }
  if(t.id==='ready-toggle'){ toggleReady(); return; }
  if(t.id==='launch-draft'){ launchDraft(); return; }
  if(t.id==='create-league'){ t.disabled = true; createLeague(); return; }
  if(t.id==='copy-invite'){ copyInvite(); return; }
  if(t.dataset.joinSeat!==undefined){ t.disabled = true; joinLeague(Number(t.dataset.joinSeat)); return; }
  if(t.dataset.openLeague){ openLeague(t.dataset.openLeague); return; }
  if(t.id==='roll-order'){ t.disabled = true; rollOrder(); return; }
  if(t.dataset.claim){ claimSeat(Number(t.dataset.claim)); return; }
  if(t.id==='pick-ok'){ confirmPick(); return; }
  if(t.id==='undo-pick'){ undoPick(); return; }
  if(t.dataset.steal){ S.tx={mode:'steal', seat, a:t.dataset.steal, b:null}; render(); return; }
  if(t.dataset.release){ if(S.tx){ S.tx.b=t.dataset.release; render(); } return; }
  if(t.dataset.refill){ S.tx={mode:'refill', seat, a:t.dataset.refill}; render(); return; }
  if(t.dataset.swapin){ S.tx={mode:'swap', seat, a:t.dataset.swapin, b:null}; render(); window.scrollTo({top:0,behavior:'smooth'}); return; }
  if(t.dataset.drop){ if(S.tx){ S.tx.b=t.dataset.drop; render(); } return; }
  if(t.id==='tx-cancel'){ S.tx=null; render(); return; }
  if(t.id==='tx-ok' && S.tx){
    const x = S.tx, o = obligations(x.seat);
    if(x.mode==='steal' && o.steal) submitMove({type:'steal', seat:x.seat, from:o.steal.from, forDay:DAYS[o.steal.k].id, take:x.a, release:x.b});
    else if(x.mode==='refill') submitMove({type:'refill', seat:x.seat, add:x.a});
    else if(x.mode==='swap') submitMove({type:'swap', seat:x.seat, add:x.a, drop:x.b});
    return;
  }
  if(t.id==='undo-move'){ undoMove(); return; }
  if(t.dataset.luday){ S.dayId=t.dataset.luday; render(); return; }
  if(t.dataset.dsday){ S.dayId=t.dataset.dsday; render(); return; }
  if(t.id==='lu-save'){ saveLineup(); return; }
  if(t.id==='save-locks'){ saveLocks(); return; }
  if(t.id==='regen-pairs'){ regenPairs(); return; }
  if(t.id==='reset-ask'){ S.confirmReset=true; render(); return; }
  if(t.id==='reset-no'){ S.confirmReset=false; render(); return; }
  if(t.id==='reset-yes'){ resetAll(); return; }
});
document.addEventListener('change', e => {
  const t = e.target;
  if(t.id==='league-sel'){ openLeague(t.value); return; }
  if(t.id==='view-seat'){ S.viewSeat=Number(t.value); S.tx=null; store.set('fw-view:'+S.lid, t.value); render(); }
  if(t.id==='claim-seat' && t.value!==''){ claimSeat(Number(t.value)); }
  if(t.id==='pool-team'){ S.poolTeam=t.value; render(); }
});
document.addEventListener('input', e => {
  if(e.target.id==='pool-q'){ S.poolQuery=e.target.value; render(); }
  if(e.target.id && e.target.id.startsWith('seat-name-')){ const n=Number(store.get('fw-setup-n'))||8; store.set('fw-setup-names', JSON.stringify(Array.from({length:n},(_,i)=>$('#seat-name-'+i)?.value||''))); }
});

// ---------- Boot ----------
const h = (location.hash||'').slice(1); let tabChosen = false;
if(/^join-[A-Za-z0-9]{4,12}$/.test(h)){ S.joinCode = h.slice(5).toUpperCase(); S.tab = 'ligues'; tabChosen = true; }
else if(['classement','draft','compo','mercato','journees','regles','ligues'].includes(h)){ S.tab=h; tabChosen = true; }
render();
function autoTab(){
  if(tabChosen || !S.loaded.leagues) return;
  if(!S.lid){ tabChosen = true; S.tab = 'ligues'; return; }
  if(!S.loaded.config || !S.loaded.picks) return;
  tabChosen = true;
  if(S.config && (S.config.status==='lobby' || !draftDone())) S.tab = 'draft';
}
let sentSeat;
function syncPresenceSeat(){ const s = mySeat(); const key = S.lid+':'+s; if(key!==sentSeat){ sentSeat = key; setPresence({seat: s, lid: S.lid||null}); } }
let leagueUnsubs = [];
function openLeague(lid){
  leagueUnsubs.forEach(u=>{ try{u()}catch(_){} }); leagueUnsubs = [];
  Object.assign(S, {lid: lid||null, config:null, picks:[], moves:[], matchups:{}, lineups:{}, viewSeat:null, pending:null, tx:null, genBusy:{}, lastRound:undefined, confirmReset:false, anim:null, seenRoll:undefined, dayId:null});
  S.loaded = {...S.loaded, config:false, picks:false, moves:false, matchups:false};
  store.set('fw-lid', lid||'');
  setPresence({hover:null});
  if(!lid || !S.db){ render(); return; }
  const db = S.db, base = 'leagues/'+lid, fail = () => {};
  const coll = (name, fn) => leagueUnsubs.push(db.collection(base+'/'+name).onSnapshot(qs => { if(S.lid!==lid) return; fn(qs); autoTab(); render(); }, fail));
  leagueUnsubs.push(db.doc(base).onSnapshot(snap => {
    if(S.lid!==lid) return;
    S.config = snap.exists ? snap.data() : null; S.loaded.config = true;
    const saved = store.get('fw-view:'+lid); const mine = mySeat();
    if(S.config){ const n=N(); if(S.viewSeat===null || S.viewSeat>=n) S.viewSeat = mine ?? (saved!==null && Number(saved)<n ? Number(saved) : 0); }
    syncPresenceSeat(); autoTab();
    const ra = S.config?.rolledAt;
    if(ra && ra!==S.seenRoll){ S.seenRoll = ra; if(Date.now()-Date.parse(ra) < 20000){ startRollAnim(); return; } }
    render();
  }, fail));
  coll('picks', qs => { S.picks = qs.docs.map(d=>d.data()).filter(p=>p && PLAYERS[p.pid]).sort((a,b)=>a.n-b.n); S.loaded.picks = true; if(S.pending && draftOwner()[S.pending]!==undefined){ S.pending=null; setPresence({hover:null}); } });
  coll('moves', qs => { S.moves = qs.docs.map(d=>({...d.data(), id:d.id})); S.loaded.moves = true; });
  coll('matchups', qs => { const m={}; qs.docs.forEach(d=>m[d.id]=d.data()); S.matchups=m; S.loaded.matchups = true; });
  coll('lineups', qs => { const m={}; qs.docs.forEach(d=>m[d.id]=d.data()); S.lineups=m; });
  render();
}
(async () => {
  const [db, user, room] = await Promise.all([claude.use('db'), claude.use('user'), claude.use('room')]);
  S.db = db; S.room = room;
  if(user){ S.me = await user.id(); S.isOwner = await user.isOwner(); const cw = await user.can('data.write'); if(cw===false) S.readOnly = true; }
  if(room){ room.onPeers(ch => { S.peers = ch.peers; if(S.tab==='draft') render(); }, ()=>{}); }
  if(!db){ render(); return; }
  const fail = () => {};
  db.collection('stats').onSnapshot(qs => { const m={}; qs.docs.forEach(d=>m[d.id]=d.data()); S.stats=m; render(); }, fail);
  db.collection('schedule').onSnapshot(qs => { const m={}; qs.docs.forEach(d=>m[d.id]=d.data()); S.schedule=m; render(); }, fail);
  if(S.me){
    db.collection('leagues').where('members','array-contains', S.me).onSnapshot(qs => {
      S.leagues = qs.docs.map(d=>({id:d.id, ...d.data()})).sort((a,b)=> String(a.createdAt).localeCompare(String(b.createdAt)));
      S.loaded.leagues = true;
      if(!S.lid){ const saved = store.get('fw-lid'); const pick = S.leagues.find(l=>l.id===saved) || S.leagues[0]; if(pick){ openLeague(pick.id); return; } }
      autoTab(); render();
    }, () => { S.loaded.leagues = true; render(); });
  } else { S.loaded.leagues = true; }
  if(S.joinCode) findInvite();
  setInterval(()=>{ const el = document.getElementById('cs-timer'); if(el && S.config) el.textContent = clock(lastPickTime()); }, 1000);
  setInterval(()=>{ if(M) renderTicker(); }, 60000);
  render();
})();
})();
</script>
