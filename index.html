        </div>
        <div class="cs-rules">Limites : 1 joueur par équipe pro · un seul joueur 92+ · un seul joueur 90-91${oc!==null && rulesRelaxed(roster) && !done ? ' · <b>levées pour ce choix (aucun joueur disponible ne les respecte)</b>' : ''}</div>
        <div class="cs-pool">${tiles}</div>
        ${lock}
      </div>${right}
    </div>
    ${last?`<div class="cs-log">${last}</div>`:''}
    ${isComm() && !S.readOnly && S.picks.length ? '<div><button class="ghost" id="undo-pick">Annuler le dernier choix</button></div>' : ''}
  </section>`;
}

// Lineup
function viewLineup(){
  if(!N()) return setupOrWait();
  if(!draftDone()) return `<div class="panel stack"><h2>Compo</h2><p class="lede">Les compos s’ouvrent une fois la draft terminée (${S.picks.length}/${totalPicks()} choix faits).</p></div>`;
  const seat = S.viewSeat ?? 0; const day = DAYS.find(d=>d.id===S.dayId) || nextDay(); const k = day.i;
  const locked = isLocked(day); const roster = locked ? (M.snaps[k][seat]||[]) : (M.rosters[seat]||[]);
  const lu = effectiveLineup(seat, k, roster);
  const editable = canActFor(seat) && (!locked || (isComm() && !seats()[seat]?.uid));
  const playing = teamsPlaying(day);
  const playTag = pid => { if(!pid) return ''; const stTag = stateTag(k, pid); if(!playing) return stTag; return (playing.has(PLAYERS[pid].team) ? '<span class="plays yes">Joue ce jour</span>' : '<span class="plays no">Ne joue pas</span>') + (stTag ? ' '+stTag : ''); };
  const rows = ROLES.map(r => {
    const opts = roster.filter(p=>PLAYERS[p].role===r);
    const field = !lu[r] ? '<div class="err">Aucun joueur à ce poste</div>' : (editable && opts.length>1
      ? `<select class="in" id="lu-${r}">${opts.map(pid=>`<option value="${pid}" ${lu[r]===pid?'selected':''}>${PLAYERS[pid].ovr} · ${esc(pname(pid))} · ${PLAYERS[pid].team}</option>`).join('')}</select>`
      : `<div>${ovrMini(lu[r])}<b>${esc(pname(lu[r]))}</b> <span class="team">${PLAYERS[lu[r]].team}</span></div>`);
    return `<div class="lu-row"><span class="chip rc-${r}">${roleIcon(r,14)}${ROLE_FR[r]}</span>${field}${playTag(lu[r])}</div>`;
  }).join('') + `<div class="lu-row"><span class="chip rc-TEAM">${roleIcon('TEAM',14)}Équipe</span><div><b>${esc(lu.TEAM?pname(lu.TEAM):'Aucune équipe')}</b></div>${playTag(lu.TEAM)}</div>`;
  const starters = new Set([...ROLES.map(r=>lu[r]), lu.TEAM]);
  const bench = roster.filter(p=>!starters.has(p)).map(pid=>`${esc(pname(pid))} <span class="chip rc-${PLAYERS[pid].role}">${roleIcon(PLAYERS[pid].role,14)}${ROLE_FR[PLAYERS[pid].role]}</span>`).join(' · ');
  const opp = duelOf(k, seat);
  const dayBtns = DAYS.map(d=>`<button class="day" data-luday="${d.id}" aria-pressed="${d===day}"><div class="dn">J${d.n}</div><div class="dd">${esc(dayDate(d))}</div><div class="dw muted">${isLocked(d)?'Verrouillée':'Ouverte'}</div></button>`).join('');
  return `<section class="stack">
    <div><h2>Compo de ${esc(seatName(seat))}${teamOvr(seat)!==null?` <span class="pill" title="Moyenne des 5 titulaires et de l’équipe, remplaçants exclus">Note ${teamOvr(seat)}</span>`:''}</h2><p class="lede">Choisis un titulaire par poste parmi ton effectif. Sans changement, ta compo précédente est reprise.</p></div>
    <div class="days">${dayBtns}</div>
    <div class="spread"><div><b>J${day.n} · ${esc(dayLong(day))} · ${esc(day.fmt)}</b>${opp!==null?` · contre <b>${esc(seatName(opp))}</b>`:''} <span class="muted small">— ${locked?'verrouillée depuis':'verrouillage'} ${esc(dtFmt.format(lockOf(day)))}</span></div>
      <span class="pill ${locked?'':'good'}">${locked?'Verrouillée':'Modifiable'}</span></div>
    ${!playing ? '<div class="notice info small">Le programme de cette journée n’est pas encore connu. Il s’affiche dès le tirage du tour.</div>' : ''}
    ${roster.length<PICKS_PER_SEAT && !locked ? '<div class="notice small">Ton effectif est incomplet : remplace le joueur qu’on t’a pris dans le Mercato.</div>' : ''}
    <div class="lineup">${rows}</div>
    <div class="muted small">Banc : ${bench||'—'}</div>
    ${editable ? `<div class="row"><button class="btn primary" id="lu-save">Enregistrer pour la J${day.n}</button>${locked?'<span class="err small">Journée verrouillée : modification commissaire.</span>':''}</div>` : (canActFor(seat)?'':'<div class="muted small">Seul le propriétaire de cette équipe peut modifier sa compo.</div>')}
  </section>`;
}

// Mercato
function playerCard(pid, opts={}){ return futCard(pid, opts); }
function viewMercato(){
  if(!N()) return setupOrWait();
  if(!draftDone()) return `<div class="panel stack"><h2>Mercato</h2><p class="lede">Le mercato s’ouvre après la draft et la première journée.</p></div>`;
  const seat = S.viewSeat ?? 0; const o = obligations(seat); const act = canActFor(seat);
  const roster = (M.rosters[seat]||[]).slice().sort((a,b)=>ROLE_ORDER(a)-ROLE_ORDER(b));
  const fa = freeAgents(M).filter(p=>S.faRole==='ALL'||PLAYERS[p].role===S.faRole).sort((a,b)=>ROLE_ORDER(a)-ROLE_ORDER(b) || TEAMS.findIndex(t=>t.code===PLAYERS[a].team)-TEAMS.findIndex(t=>t.code===PLAYERS[b].team));
  const tx = S.tx && S.tx.seat===seat ? S.tx : null;
  const nd = DAYS[Math.min(o.w, DN-1)];
  let blocks = [];
  if(!o.open){
    blocks.push(`<div class="notice info">${esc(o.reason)}</div>`);
  } else {
    const deadline = `avant le verrouillage de la J${nd.n} (${esc(dtFmt.format(lockOf(nd)))})`;
    // 1. Steal
    if(o.steal){
      const from = o.steal.from; const opp = (M.rosters[from]||[]).slice().sort((a,b)=>ROLE_ORDER(a)-ROLE_ORDER(b));
      const t = tx && tx.mode==='steal' ? tx : null;
      const releaseOk = pid => t && t.a && kindOf(pid)===kindOf(t.a) && covers(roster.filter(p=>p!==pid).concat(t.a));
      blocks.push(`<section class="panel step">
        <div class="step-h"><span class="n">Victoire</span><h3>Prends un joueur à ${esc(seatName(from))}</h3><span class="muted small">${deadline}</span></div>
        <p class="muted small" style="margin:0">Choisis un joueur de son effectif, puis celui que tu relâches (il devient libre). Une équipe se prend contre ton équipe.</p>
        <div class="label">1 · Joueur à prendre</div>
        <div class="pool">${opp.map(pid=>playerCard(pid,{attr:`data-steal="${pid}"`, cls:t?.a===pid?'sel':'', disabled:!act})).join('')}</div>
        ${t && t.a ? `<div class="label">2 · Joueur à relâcher</div><div class="pool">${roster.map(pid=>playerCard(pid,{attr:`data-release="${pid}"`, cls:t.b===pid?'out':'', disabled:!act||!releaseOk(pid), note:releaseOk(pid)?'':'Impossible'})).join('')}</div>` : ''}
        ${t && t.a && t.b ? `<div class="confirm"><div>Prendre <b>${esc(pname(t.a))}</b> et relâcher <b>${esc(pname(t.b))}</b> ?</div><div class="row"><button class="btn" id="tx-cancel">Annuler</button><button class="btn primary" id="tx-ok">Valider</button></div></div>` : ''}
      </section>`);
    } else if(M.steals[(o.w-1)+':'+seat]){
      const m = M.steals[(o.w-1)+':'+seat];
      blocks.push(`<div class="notice info small">Prise faite : <b>${esc(pname(m.take))}</b> récupéré chez ${esc(seatName(m.from))}, <b>${esc(pname(m.release))}</b> relâché.</div>`);
    }
    if(o.waitSteal!==null) blocks.push(`<div class="notice">Tu as perdu contre <b>${esc(seatName(o.waitSteal))}</b>. Il choisit un joueur dans ton équipe. Ton mercato s’ouvre dès que c’est fait.</div>`);
    // 2. Refill
    if(o.refill){
      const t = tx && tx.mode==='refill' ? tx : null;
      const miss = ROLES.find(r=>!roster.some(p=>PLAYERS[p].role===r));
      const cand = freeAgents(M).filter(p => o.needTeam ? PLAYERS[p].role==='TEAM' : PLAYERS[p].role!=='TEAM').sort((a,b)=>ROLE_ORDER(a)-ROLE_ORDER(b));
      const okAdd = pid => !checkMove(M,{type:'refill', seat, add:pid, at:new Date().toISOString()});
      blocks.push(`<section class="panel step">
        <div class="step-h"><span class="n">Remplacement gratuit</span><h3>${o.needTeam?'Reprends une équipe':'Complète ton effectif'}</h3><span class="muted small">ne compte pas dans tes changements</span></div>
        <p class="muted small" style="margin:0">${o.needTeam?'On t’a pris ton équipe : choisis une équipe libre.':(miss?`Il te manque un ${ROLE_FR[miss]} : choisis un ${ROLE_FR[miss]} libre.`:'Choisis n’importe quel pro libre.')}</p>
        <div class="pool">${cand.map(pid=>playerCard(pid,{attr:`data-refill="${pid}"`, cls:t?.a===pid?'sel':'', disabled:!act||!okAdd(pid)})).join('')}</div>
        ${t && t.a ? `<div class="confirm"><div>Ajouter <b>${esc(pname(t.a))}</b> à ton effectif ?</div><div class="row"><button class="btn" id="tx-cancel">Annuler</button><button class="btn primary" id="tx-ok">Valider</button></div></div>` : ''}
      </section>`);
    }
    // 3. Swaps
    const t = tx && tx.mode==='swap' ? tx : null;
    const dropOk = pid => t && t.a && kindOf(pid)===kindOf(t.a) && covers(roster.filter(p=>p!==pid).concat(t.a));
    blocks.push(`<section class="panel step">
      <div class="step-h"><span class="n">Changements</span><h3>Échanger avec un pro libre</h3><span class="pill ${o.swapsLeft?'good':''}">${o.swapsLeft} / ${MAX_SWAPS} restants</span></div>
      <p class="muted small" style="margin:0">${o.swapsLeft ? `Choisis un pro libre ci-dessous, puis le joueur de ton effectif qu’il remplace, ${deadline}.` : (o.waitSteal!==null ? 'Disponible après la prise de ton adversaire.' : (roster.length<PICKS_PER_SEAT ? 'Disponible une fois ton effectif complété.' : 'Tu as utilisé tes changements pour cette journée.'))}</p>
      ${t && t.a ? `<div class="label">Joueur qui sort pour ${esc(pname(t.a))}</div><div class="pool">${roster.map(pid=>playerCard(pid,{attr:`data-drop="${pid}"`, cls:t.b===pid?'out':'', disabled:!act||!dropOk(pid), note:dropOk(pid)?'':'Impossible'})).join('')}</div>` : ''}
      ${t && t.a && t.b ? `<div class="confirm"><div>Faire entrer <b>${esc(pname(t.a))}</b> à la place de <b>${esc(pname(t.b))}</b> ?</div><div class="row"><button class="btn" id="tx-cancel">Annuler</button><button class="btn primary" id="tx-ok">Valider</button></div></div>` : ''}
    </section>`);
  }
  const swapOn = o.open && o.swapsLeft>0 && act;
  const faHtml = `<section class="stack">
    <div class="spread"><h3>Joueurs et équipes libres (${freeAgents(M).length})</h3>
      <div class="filters"><div class="seg">${['ALL',...ALLR].map(r=>`<button data-farole="${r}" aria-pressed="${S.faRole===r}">${r==='ALL'?'Tous':roleIcon(r,15)+' '+ROLE_FR[r]}</button>`).join('')}</div></div></div>
    <div class="pool">${fa.map(pid=>playerCard(pid,{attr:`data-swapin="${pid}"`, cls:tx?.mode==='swap'&&tx.a===pid?'sel':'', disabled:!swapOn, note: teamState(Math.min(currentWindow(),DN-1), PLAYERS[pid].team)==='out' ? 'Équipe éliminée' : (swapOn?'Faire entrer':'')})).join('') || '<p class="muted">Aucun pro libre à ce poste.</p>'}</div>
  </section>`;
  const teams = `<section class="stack"><h3>Effectifs actuels</h3><div class="rosters wide">${seats().map((_,i)=>{
      const r = (M.rosters[i]||[]).slice().sort((a,b)=>ROLE_ORDER(a)-ROLE_ORDER(b));
      return `<div class="roster ${i===seat?'now':''}"><div class="rh"><b>${esc(seatName(i))}</b><span class="muted small">${r.length}/${PICKS_PER_SEAT}</span></div>
        <div class="slots">${r.map(pid=>`<div class="slot"><div class="sl">${ROLE_FR[PLAYERS[pid].role]}</div><div class="sv">${ovrMini(pid)}${esc(pname(pid))}</div></div>`).join('')}</div></div>`;}).join('')}</div></section>`;
  const log = M.moves.slice().reverse().slice(0,40).map(m=>{
    const bad = M.status[m.id]; const k = windowOf(moveTime(m));
    const txt = m.type==='steal' ? `<b>${esc(seatName(m.seat))}</b> prend ${esc(pname(m.take))} à ${esc(seatName(m.from))}, relâche ${esc(pname(m.release))}`
      : m.type==='refill' ? `<b>${esc(seatName(m.seat))}</b> remplace avec ${esc(pname(m.add))}`
      : `<b>${esc(seatName(m.seat))}</b> fait entrer ${esc(pname(m.add))}, sort ${esc(pname(m.drop))}`;
    return `<div><span class="pill">avant J${Math.min(k+1,DN)}</span><span class="${bad?'void':''}">${txt}</span>${bad?`<span class="err small">annulé : ${esc(bad)}</span>`:''}</div>`;
  }).join('') || '<span class="muted">Aucun mouvement pour l’instant.</span>';
  return `<section class="stack"><div><h2>Mercato de ${esc(seatName(seat))}</h2><p class="lede">Après chaque journée : le gagnant de chaque duel prend un joueur au perdant, le perdant se renforce gratuitement, puis chacun peut faire ${MAX_SWAPS} transferts maximum avec les joueurs et équipes libres (sans propriétaire), entre chaque journée.</p></div>
    ${blocks.join('')}</section>${faHtml}${teams}
    <section class="stack"><div class="spread"><h3>Historique</h3>${isComm()&&!S.readOnly&&S.moves.length?'<button class="btn sm" id="undo-move">Annuler le dernier mouvement</button>':''}</div><div class="panel log">${log}</div></section>`;
}

// Journées
function viewDays(){
  if(!N()) return setupOrWait();
  const day = DAYS.find(d=>d.id===S.dayId) || DAYS[[...Array(DN).keys()].reverse().find(k=>M.results[k]) ?? 0];
  const k = day.i, res = M.results[k], st = S.stats[day.id];
  const dayBtns = DAYS.map(d=>`<button class="day" data-dsday="${d.id}" aria-pressed="${d===day}"><div class="dn">J${d.n}</div><div class="dd">${esc(dayDate(d))}</div><div class="dw muted">${S.stats[d.id]?(S.stats[d.id].final?'Stats finales':'Provisoires'):'—'}</div></button>`).join('');
  const sched = schedPairs(day);
  const schedHtml = sched && sched.length ? `<div class="row small"><span class="label">Matchs pros</span>${sched.map(m=>`<span class="pill">${esc(m[0])} vs ${esc(m[1])}</span>`).join('')}</div>` : '';
  const pairs = S.matchups[day.id]?.pairs || [];
  let body;
  if(res){
    const order = res.duels.flatMap(x=>[x.a,x.b]);
    body = `<div class="duels">${res.duels.map(x=>duelCard(x.a,x.b,x.sa,x.sb,x.winner)).join('')}</div>
    <div class="tscroll"><table>
    <thead><tr><th>Joueur</th>${ALLR.map(r=>`<th>${ROLE_FR[r]}</th>`).join('')}<th class="r">Total</th></tr></thead>
    <tbody>${order.map(s=>{const x=res.scores[s]; const d=res.duels.find(z=>z.a===s||z.b===s); const tag = d.winner===s?'<span class="pill good">Victoire</span>':(d.winner===null?'<span class="pill">Nul</span>':'<span class="pill bad">Défaite</span>');
      return `<tr><td class="name">${esc(seatName(s))} ${tag}</td>${ALLR.map(r=>{const p=x.parts[r]; return `<td><div class="cell-p"><span class="pn">${esc(p.pid?(r==='TEAM'?PLAYERS[p.pid].team:pname(p.pid)):'—')}</span><span class="pp">${fmt(p.pts)}${p.note?' · '+NOTE_FR[p.note]:''}</span></div></td>`;}).join('')}<td class="r big num">${fmt(x.total)}</td></tr>`;}).join('')}</tbody></table></div>`;
  } else if(pairs.length){
    body = `<div class="duels">${pairs.map(([a,b])=>duelCard(a,b,null,null,null)).join('')}</div><div class="panel muted">${isLocked(day)?'Les stats de cette journée arrivent le lendemain matin.':'Cette journée n’a pas encore commencé.'}</div>`;
  } else body = `<div class="panel muted">Les affiches de cette journée seront tirées après la journée précédente, façon Swiss : on affronte quelqu’un qui a le même bilan.</div>`;
  return `${upcomingBlock()}<section class="stack" style="margin-top:28px">
    <div><h2>Résultats par journée</h2><p class="lede">Duels du jour, scores, et points de chaque titulaire.</p></div>
    <div class="days">${dayBtns}</div>
    <div class="spread"><b>J${day.n} · ${esc(dayLong(day))} · ${esc(day.fmt)}</b>${st?`<span class="pill ${st.final?'good':'turn'}">${st.final?'Stats finales':'Stats provisoires'}</span>`:''}</div>
    ${schedHtml}${body}${st?topPlayers(st, k):''}
  </section>`;
}
function topPlayers(st, k){
  const arr = Object.entries(st.players||{}).filter(([pid])=>PLAYERS[pid]).map(([pid,s])=>({pid,s,pts:playerPoints(s)})).sort((a,b)=>b.pts-a.pts).slice(0,10);
  if(!arr.length) return '';
  const snap = M.snaps[k]; const ownerAt = pid => snap.findIndex(r=>r.includes(pid));
  return `<h3>Meilleurs pros de la journée</h3><div class="tscroll"><table>
    <thead><tr><th>Joueur</th><th>Poste</th><th class="r">Parties</th><th class="r">K / D / A</th><th class="r">CS</th><th class="r">Vision</th><th class="r">% dégâts</th><th class="r">Pts / partie</th><th>Dans l’équipe de</th></tr></thead>
    <tbody>${arr.map(x=>{const p=PLAYERS[x.pid], s=x.s, g=Number(s.g)||0, o=ownerAt(x.pid); return `<tr><td class="name">${esc(p.name)} <span class="team">${p.team}</span></td><td><span class="chip rc-${p.role}">${roleIcon(p.role,14)}${ROLE_FR[p.role]}</span></td><td class="r num">${g}</td><td class="r num">${s.k||0} / ${s.d||0} / ${s.a||0}</td><td class="r num">${s.cs||0}</td><td class="r num">${s.vis??'—'}</td><td class="r num">${g?fmt((Number(s.dmg)||0)/g)+' %':'—'}</td><td class="r num"><b>${fmt(x.pts)}</b></td><td class="muted">${o>=0?esc(seatName(o)):'Libre'}</td></tr>`;}).join('')}</tbody></table></div>`;
}

// Règles
function viewRules(){
  const nd = nextDay();
  const admin = S.db && isComm() && !S.readOnly && N() ? `
  <section class="panel stack"><h3>Espace commissaire</h3>
    <p class="muted small">Ajuste une heure de verrouillage si Riot décale un début de journée (heure de ton appareil).</p>
    <div class="pool" style="grid-template-columns:repeat(auto-fill,minmax(230px,1fr))">${DAYS.map(d=>`<label class="stack" style="gap:4px"><span class="label">J${d.n} · ${esc(dayDate(d))}</span><input class="in" type="datetime-local" id="lock-${d.id}" value="${toLocalInput(lockOf(d))}"></label>`).join('')}</div>
    <div class="row"><button class="btn" id="save-locks">Enregistrer les verrous</button>${!isLocked(nd)?`<button class="btn" id="regen-pairs">Retirer les affiches de la J${nd.n}</button>`:''}</div>
    <div class="row">${S.confirmReset ? '<span class="err">Tout effacer (draft, compos, mercato, affiches) et revenir au salon ? Les joueurs gardent leur place.</span><button class="btn" id="reset-no">Non</button><button class="btn danger" id="reset-yes">Oui, réinitialiser</button>' : '<button class="btn danger" id="reset-ask">Réinitialiser la partie</button>'}</div>
  </section>` : '';
  return `<section class="stack"><div><h2>Règles</h2><p class="lede">Duels quotidiens, barèmes de points et mercato.</p></div>
  <div class="rules-grid">
    <div class="panel prose"><h3>Duels</h3><ul>
      <li>Chaque jour de Worlds, chacun affronte un autre joueur de la ligue.</li>
      <li>J1 tirée au sort dès la fin de la draft, puis affiches façon Swiss : on affronte quelqu’un qui a le même bilan, sans revanche quand c’est possible.</li>
      <li>Avant le premier match du jour, chacun valide un titulaire par poste. L’équipe choisie compte toujours. Sans changement, la compo précédente est reprise.</li>

      <li>Le plus gros total gagne le duel. Égalité parfaite = nul. Classement : victoires, puis nuls, puis total de points.</li>
      <li>Équipe au repos ce jour-là (encore en lice mais sans match) : le joueur marque sa moyenne des journées précédentes. Équipe éliminée : la moitié de sa moyenne.</li></ul></div>
    <div class="panel"><h3>Barème joueur</h3><p class="muted small" style="margin:0 0 6px">Calculé partie par partie, puis on fait la moyenne des parties du jour : un Bo3 compte autant qu’un Bo1.</p><table class="scale"><tbody>
      <tr><td>Kill</td><td>+${SCORE.k}</td></tr><tr><td>Mort</td><td>0</td></tr><tr><td>Assist</td><td>+1,5</td></tr>
      <tr><td>Sbire tué (CS)</td><td>+0,04</td></tr><tr><td>Point de score de vision</td><td>+0,1</td></tr>
      <tr><td>Part des dégâts de l’équipe</td><td>× (1 + part) : 30 % des dégâts = +30 %</td></tr>
      <tr><td>Victoire</td><td>× 1,2 (+20 %), après les dégâts</td></tr></tbody></table>
      <p class="muted small">Exemple ADC : 5/1/7, 280 CS, 25 de vision, 28 % des dégâts, victoire. Base = 10 + 10,5 + 11,2 + 2,5 = 34,2 pts. Dégâts : 34,2 × 1,28 = 43,8. Victoire : 43,8 × 1,2 = 52,5 pts.</p>
      <p class="muted small">Exemple support : 1/3/14, 40 CS, 100 de vision, 8 % des dégâts, victoire. Base = 2 + 21 + 1,6 + 10 = 34,6, × 1,08 × 1,2 = 44,8 pts.</p></div>
    <div class="panel"><h3>Barème équipe</h3><p class="muted small" style="margin:0 0 6px">Par partie, moyenne sur la journée, puis bonus de série.</p><table class="scale"><tbody>

async function write(fn, okMsg){
  try{ const r = await fn(); if(okMsg && r!==false) toast(okMsg); }
  catch(e){
    if(e && e.code==='invalid_argument'){ S.readOnly = true; toast('Tu peux consulter la partie mais pas la modifier.'); render(); }
    else if(e && e.code==='quota_exceeded'){ toast('Espace de stockage plein.'); }
    else { toast('Échec de l’enregistrement, réessaie.'); }
  }
}

async function rollOrder(){
  if(!isComm() || rollState()) return;
  // Distinct values 1-100, so ties never happen
  const pool = Array.from({length:100},(_,i)=>i+1);
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
  const rolls = {}; seats().forEach((_,i)=>rolls[String(i)] = pool[i]);
  const order = seats().map((_,i)=>i).sort((a,b)=>pool[b]-pool[a]);
  await write(()=>S.db.doc(LG()).update({rolls, order, rolledAt:new Date().toISOString()}));
}
async function launchDraft(){
  if(!isComm()) return;
  if(!rollState()){ toast('Lance d’abord la roulette du first pick.'); return; }
  await write(()=>S.db.doc(LG()).update({status:'draft', startedAt:new Date().toISOString()}), 'La draft commence');
}
async function claimSeat(i){
  const ref = S.db.doc(LG());
  await write(async()=>{
    const lease = await ref.acquire({holder:S.me, ttlMs:5000});
    if(!lease.acquired){ toast('Quelqu’un réclame une place, réessaie.'); return false; }
    const cfg = (await ref.get()).data(); if(!cfg) return false;
    const ss = cfg.seats.map(s=>({...s}));
    if(ss.some(s=>s.uid===S.me)) return false;
    if(ss[i].uid){ toast('Cette place est déjà prise.'); return false; }
    ss[i].uid = S.me; const members = [...(cfg.members||[])]; if(!members.includes(S.me)) members.push(S.me); await ref.update({seats:ss, members});
    S.viewSeat = i; store.set('fw-view:'+S.lid, String(i)); toast('Place réclamée : '+ss[i].name);
  });
}
async function confirmPick(){
  const pid = S.pending; const n = S.picks.length; const seat = onClock(); S.pending = null;
  if(seat===null || !canActFor(seat)) return render();
  const slot = slotFor(draftSlots()[seat], PLAYERS[pid]);
  if(!slot || draftOwner()[pid]!==undefined){ toast('Ce choix n’est plus possible.'); return render(); }
  const ref = S.db.doc(LG()+'/picks/p'+pad(n));

// Pairings are generated by whichever player opens the page first once they are due
async function maybeGenerate(){
  if(!M || S.readOnly || !S.config || !N() || (!isComm() && mySeat()===null)) return;
  let k = -1, how = 'swiss';
  // J1 is drawn once the draft is over. Leagues created before that rule had their J1 drawn at creation:
  // that old draw is replaced by a real end-of-draft draw, as long as J1 has not started.
  const d01 = S.matchups.d01;
  if(!d01 || (d01.how!==J1_HOW && draftDone() && !isLocked(DAYS[0]))){ if(draftDone()){ k = 0; how = J1_HOW; } }
  else for(let j=1;j<DN;j++){ if(!S.matchups[DAYS[j].id] && S.matchups[DAYS[j-1].id] && M.results[j-1]?.final){ k=j; break; } }
  if(k<0 || S.genBusy[k]) return;
  S.genBusy[k] = true;
  try{
    const ref = S.db.doc(LG()+'/matchups/'+DAYS[k].id);
    const lease = await ref.acquire({holder:S.me||'owner', ttlMs:5000});
    if(!lease.acquired) return;
    const snap = await ref.get(); const cur = snap.exists ? snap.data() : null;
    if(cur && cur.pairs && (k>0 || cur.how===J1_HOW)) return;
    await ref.set({pairs: k===0 ? randomPairs() : swissPairs(k), createdAt:new Date().toISOString(), how});
  }catch(e){ S.genBusy[k] = false; }
  finally{ setTimeout(() => { S.genBusy[k] = false; }, 4000); } // retry later if another player held the lease and did not finish
}
const J1_HOW = 'tirage fin de draft';
const j1Ready = () => { const d = S.matchups?.d01; return d && Array.isArray(d.pairs) && d.pairs.length && d.how===J1_HOW ? d.pairs : null; };

// ---------- Sounds (original, synthesized with Web Audio: nothing copied from the game) ----------
const SFX = {ctx:null, rev:null, on: store.get('fw-sound')!=='0'};
function sfxCtx(){
  try{
    if(!SFX.ctx){ const C = window.AudioContext || window.webkitAudioContext; if(!C) return null; SFX.ctx = new C(); }
    if(SFX.ctx.state==='suspended') SFX.ctx.resume().catch(()=>{});
    return SFX.ctx;
  }catch(_){ return null; }
}
['pointerdown','keydown','touchstart'].forEach(ev => addEventListener(ev, () => sfxCtx(), {passive:true, capture:true}));
function sfxOut(ctx, vol){
  const g = ctx.createGain(); g.gain.value = vol; g.connect(ctx.destination);
  if(!SFX.rev){ // small synthetic room for a bit of air
    const len = Math.floor(ctx.sampleRate*1.6), b = ctx.createBuffer(2, len, ctx.sampleRate);
    for(let c=0;c<2;c++){ const d = b.getChannelData(c); for(let i=0;i<len;i++) d[i] = (Math.random()*2-1)*Math.pow(1-i/len, 3.2); }

      <div>
        <h3>${esc(p.name)}</h3>
        <p class="sub">${esc(tname(p.team))} · ${ROLE_FR[p.role]}${r?` · ${r.rank}${r.rank===1?'er':'e'} sur ${r.of} ${ROLE_PLURAL[p.role]} à la note`:''}</p>
        <div class="badges" style="margin-top:8px"><span class="pill turn">${tierTxt}</span>${limits.map(x=>`<span class="pill">${x}</span>`).join('')}${owner>=0?`<span class="pill good">Dans l’effectif de ${esc(seatName(owner))}</span>`:(M?'<span class="pill">Libre</span>':'')}</div>
        <div class="bars">${bars}</div>
      </div>
    </div>
    <p class="muted small" style="margin:0">Note globale ${p.ovr} : c’est la note de la ligue. ${team ? 'Les 6 sous-notes ont le même poids et leur moyenne vaut la note globale.' : `Les 6 sous-notes sont réparties autour selon le style du joueur, et leur moyenne pondérée (poids du poste ${ROLE_FR[p.role]}) vaut la note globale.`} ${p.estimated ? 'Sous-notes estimées par Claude avant les Worlds, d’après le style de jeu connu.' : 'Pas de style marqué connu : sous-notes estimées selon le poste.'} Elles ne comptent pas dans les points.</p>
    <div class="stack" style="gap:8px"><h3 style="font-size:16px">Forme Worlds</h3>${form ? `<div class="form">${form}</div>${fr?`<p class="muted small" style="margin:0">${fr.rank}${fr.rank===1?'er':'e'} sur ${fr.of} ${ROLE_PLURAL[p.role]} aux points par jour.</p>`:''}` : '<p class="muted small" style="margin:0">Se remplit avec les vraies stats dès la première journée (23 octobre).</p>'}</div>
    <button class="btn close" id="fiche-close">Fermer</button>
  </div>`;
  document.body.appendChild(el); document.getElementById('fiche-close').focus();
  el.addEventListener('click', e => { if(e.target===el) closeFiche(); });
}
function closeFiche(){ document.getElementById('fiche')?.remove(); }

// ---------- Events ----------
document.addEventListener('click', e => {
  const t = e.target.closest('button'); if(!t) return;
  const seat = S.viewSeat ?? 0;
  if(t.dataset.fiche && !t.closest('#fiche')){ openFiche(t.dataset.fiche); return; }
  if(t.id==='fiche-close'){ closeFiche(); return; }
  if(t.id==='dd-room'){ S.draftRoom = true; render(); return; }
  if(t.id==='dd-back'){ S.draftRoom = false; render(); return; }
  if(t.id==='fa-skip'){ const pairs = j1Ready(); if(FA && pairs && !document.getElementById('fa-go') && document.getElementById('fa-duels')){ FA.timers.forEach(clearTimeout); FA.timers.forEach(clearInterval); FA.timers=[]; FA.reduce = true; drawPairs(pairs); } else if(FA && pairs && !document.getElementById('fa-duels')){ FA.timers.forEach(clearTimeout); FA.timers=[]; FA.reduce = true; act2(); } else faClose(); return; }
  if(t.id==='fa-go'){ faClose(); return; }
  if(t.id==='fa-replay'){ if(!FA) draftShow(); return; }
  if(t.id==='sfx-toggle'){ SFX.on = !SFX.on; store.set('fw-sound', SFX.on?'1':'0'); render(); if(SFX.on) sfx('turn', .8, true); return; }
  if(t.dataset.tab){ S.tab=t.dataset.tab; try{history.replaceState(null,'','#'+S.tab)}catch(_){} S.pending=null; S.tx=null; render(); return; }
  if(t.dataset.setupn){ store.set('fw-setup-n', t.dataset.setupn); render(); return; }
  if(t.dataset.role){ S.poolRole=t.dataset.role; render(); return; }
  if(t.dataset.farole){ S.faRole=t.dataset.farole; render(); return; }
  if(t.dataset.pick){ S.pending=t.dataset.pick; setPresence({hover:S.pending}); render(); return; }
  if(t.id==='pick-cancel'){ S.pending=null; setPresence({hover:null}); render(); return; }
  if(t.id==='ready-toggle'){ toggleReady(); return; }
  if(t.id==='launch-draft'){ launchDraft(); return; }
  if(t.id==='create-league'){ t.disabled = true; createLeague(); return; }
  if(t.id==='copy-invite'){ copyInvite(); return; }
  if(t.dataset.joinSeat!==undefined){ t.disabled = true; joinLeague(Number(t.dataset.joinSeat)); return; }
  if(t.dataset.openLeague){ openLeague(t.dataset.openLeague); return; }
  if(t.dataset.delLeague){ S.confirmDel = t.dataset.delLeague; render(); return; }
  if(t.dataset.delCancel){ S.confirmDel = null; render(); return; }
  if(t.dataset.delConfirm){ t.disabled = true; deleteLeague(t.dataset.delConfirm); return; }
  if(t.id==='roll-order'){ t.disabled = true; rollOrder(); return; }
  if(t.dataset.claim){ claimSeat(Number(t.dataset.claim)); return; }
  if(t.id==='pick-ok'){ confirmPick(); return; }
  if(t.id==='undo-pick'){ undoPick(); return; }
  if(t.dataset.steal){ S.tx={mode:'steal', seat, a:t.dataset.steal, b:null}; render(); return; }
  if(t.dataset.release){ if(S.tx){ S.tx.b=t.dataset.release; render(); } return; }
  if(t.dataset.refill){ S.tx={mode:'refill', seat, a:t.dataset.refill}; render(); return; }
  if(t.dataset.swapin){ S.tx={mode:'swap', seat, a:t.dataset.swapin, b:null}; render(); window.scrollTo({top:0,behavior:'smooth'}); return; }
  if(t.dataset.drop){ if(S.tx){ S.tx.b=t.dataset.drop; render(); } return; }
  if(t.id==='tx-cancel'){ S.tx=null; render(); return; }
  if(t.id==='tx-ok' && S.tx){
    const x = S.tx, o = obligations(x.seat);
    if(x.mode==='steal' && o.steal) submitMove({type:'steal', seat:x.seat, from:o.steal.from, forDay:DAYS[o.steal.k].id, take:x.a, release:x.b});
    else if(x.mode==='refill') submitMove({type:'refill', seat:x.seat, add:x.a});
    else if(x.mode==='swap') submitMove({type:'swap', seat:x.seat, add:x.a, drop:x.b});
    return;
  }
  if(t.id==='undo-move'){ undoMove(); return; }
  if(t.dataset.luday){ S.dayId=t.dataset.luday; render(); return; }
  if(t.dataset.dsday){ S.dayId=t.dataset.dsday; render(); return; }
  if(t.id==='lu-save'){ saveLineup(); return; }
  if(t.id==='save-locks'){ saveLocks(); return; }
  if(t.id==='regen-pairs'){ regenPairs(); return; }
  if(t.id==='reset-ask'){ S.confirmReset=true; render(); return; }
  if(t.id==='reset-no'){ S.confirmReset=false; render(); return; }
  if(t.id==='reset-yes'){ resetAll(); return; }
});
document.addEventListener('keydown', e => { if(e.key==='Escape' && FA) faClose(); if(e.key==='Escape') closeFiche(); });
document.addEventListener('change', e => {
  const t = e.target;
  if(t.id==='league-sel'){ openLeague(t.value); return; }
  if(t.id==='view-seat'){ S.viewSeat=Number(t.value); S.tx=null; store.set('fw-view:'+S.lid, t.value); render(); }
  if(t.id==='claim-seat' && t.value!==''){ claimSeat(Number(t.value)); }
  if(t.id==='pool-team'){ S.poolTeam=t.value; render(); }
});
document.addEventListener('input', e => {
  if(e.target.id==='pool-q'){ S.poolQuery=e.target.value; render(); }
  if(e.target.id && e.target.id.startsWith('seat-name-')){ const n=Number(store.get('fw-setup-n'))||8; store.set('fw-setup-names', JSON.stringify(Array.from({length:n},(_,i)=>$('#seat-name-'+i)?.value||''))); }
});

// ---------- Boot ----------
const h = (location.hash||'').slice(1); let tabChosen = false;
if(/^join-[A-Za-z0-9]{4,12}$/.test(h)){ S.joinCode = h.slice(5).toUpperCase(); S.tab = 'ligues'; tabChosen = true; }
else if(['draft','classement','compo','mercato','journees','cartes','regles','ligues'].includes(h)){ S.tab=h; tabChosen = true; }
render();
function autoTab(){
  if(tabChosen || !S.loaded.leagues) return;
  if(!S.lid){ tabChosen = true; S.tab = 'ligues'; return; }
  if(!S.loaded.config || !S.loaded.picks) return;
  tabChosen = true;
  if(S.config && (S.config.status==='lobby' || !draftDone())) S.tab = 'draft';
}
let sentSeat;
function syncPresenceSeat(){ const s = mySeat(); const key = S.lid+':'+s; if(key!==sentSeat){ sentSeat = key; setPresence({seat: s, lid: S.lid||null}); } }
let leagueUnsubs = [];
function openLeague(lid){
  leagueUnsubs.forEach(u=>{ try{u()}catch(_){} }); leagueUnsubs = [];
  Object.assign(S, {lid: lid||null, config:null, picks:[], moves:[], matchups:{}, lineups:{}, viewSeat:null, pending:null, tx:null, genBusy:{}, lastRound:undefined, confirmReset:false, anim:null, seenRoll:undefined, dayId:null});
  S.loaded = {...S.loaded, config:false, picks:false, moves:false, matchups:false};
  store.set('fw-lid', lid||'');
  setPresence({hover:null});
  if(!lid || !S.db){ render(); return; }
  const db = S.db, base = 'leagues/'+lid, fail = () => {};
  const coll = (name, fn) => leagueUnsubs.push(db.collection(base+'/'+name).onSnapshot(qs => { if(S.lid!==lid) return; fn(qs); autoTab(); render(); }, fail));
  leagueUnsubs.push(db.doc(base).onSnapshot(snap => {
    if(S.lid!==lid) return;
    S.config = snap.exists ? snap.data() : null; S.loaded.config = true;
    const saved = store.get('fw-view:'+lid); const mine = mySeat();
    if(S.config){ const n=N(); if(S.viewSeat===null || S.viewSeat>=n) S.viewSeat = mine ?? (saved!==null && Number(saved)<n ? Number(saved) : 0); }
    syncPresenceSeat(); autoTab();
    const ra = S.config?.rolledAt;
    if(ra && ra!==S.seenRoll){ S.seenRoll = ra; if(Date.now()-Date.parse(ra) < 20000){ startRollAnim(); return; } }
    render();
  }, fail));
  S.picksSeen = null; S.turnSounded = null;
  coll('picks', qs => { S.picks = qs.docs.map(d=>d.data()).filter(p=>p && PLAYERS[p.pid]).sort((a,b)=>a.n-b.n); S.loaded.picks = true;
    const prevSeen = S.picksSeen; S.picksSeen = S.picks.length;
    if(prevSeen!==null && S.picks.length > prevSeen){ const last = S.picks[S.picks.length-1]; if(!last.by || last.by!==S.me) sfx('lock', .45); } if(S.pending && draftOwner()[S.pending]!==undefined){ S.pending=null; setPresence({hover:null}); } });
  coll('moves', qs => { S.moves = qs.docs.map(d=>({...d.data(), id:d.id})); S.loaded.moves = true; });
  coll('matchups', qs => { const m={}; qs.docs.forEach(d=>m[d.id]=d.data()); S.matchups=m; S.loaded.matchups = true; });
  coll('lineups', qs => { const m={}; qs.docs.forEach(d=>m[d.id]=d.data()); S.lineups=m; });
  render();
}
(async () => {
  const [db, user, room] = await Promise.all([claude.use('db'), claude.use('user'), claude.use('room')]);
  S.db = db; S.room = room;
  if(user){ S.me = await user.id(); S.isOwner = await user.isOwner(); const cw = await user.can('data.write'); if(cw===false) S.readOnly = true; }
  if(room){ room.onPeers(ch => { S.peers = ch.peers; if(S.tab==='draft') render(); }, ()=>{}); }
  if(!db){ render(); return; }
  const fail = () => {};
  db.collection('stats').onSnapshot(qs => { const m={}; qs.docs.forEach(d=>m[d.id]=d.data()); S.stats=m; render(); }, fail);
  db.collection('schedule').onSnapshot(qs => { const m={}; qs.docs.forEach(d=>m[d.id]=d.data()); S.schedule=m; applyCalendar(); render(); }, fail);
  if(S.me){
    db.collection('leagues').where('members','array-contains', S.me).onSnapshot(qs => {
      S.leagues = qs.docs.map(d=>({id:d.id, ...d.data()})).sort((a,b)=> String(a.createdAt).localeCompare(String(b.createdAt)));
      S.loaded.leagues = true;
      if(!S.lid){ const saved = store.get('fw-lid'); const pick = S.leagues.find(l=>l.id===saved) || S.leagues[0]; if(pick){ openLeague(pick.id); return; } }
      autoTab(); render();
    }, () => { S.loaded.leagues = true; render(); });
  } else { S.loaded.leagues = true; }
  if(S.joinCode) findInvite();
  setInterval(()=>{ const el = document.getElementById('cs-timer'); if(el && S.config) el.textContent = clock(lastPickTime()); }, 1000);
  setInterval(()=>{ if(M) renderTicker(); }, 60000);
  render();
})();
})();
</script>

</body>
