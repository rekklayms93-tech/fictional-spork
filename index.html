<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Fantasy League of Legends sur les Worlds 2026 : draft, duels quotidiens et mercato entre amis.">
<style>
/* Base reset (same as the claude.ai page skeleton) */
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Fantasy Worlds 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: black broadcast band on top, tabbed operating views below, one column on phones.
   Direction: monochrome editorial — black, white and greys only, expanded grotesk headlines,
   hairline rules, square corners; colour is never used to carry meaning. */
:root{
  --bg:#F2F2F0; --surface:#FFFFFF; --sunk:#E8E8E6; --ink:#0B0B0B; --muted:#6A6A6A; --line:#D8D8D5;
  --accent:#0B0B0B; --accent-ink:#FFFFFF; --turn:#0B0B0B; --turn-soft:#E8E8E6;
  --good:#0B0B0B; --bad:#C4161C; --good-soft:#E2E2DF; --bad-soft:#F3E3E3;
  --band:#0B0B0B; --band-ink:#FFFFFF; --band-muted:#8E8E8E;
  --r-top:#0B0B0B; --r-jng:#0B0B0B; --r-mid:#0B0B0B; --r-adc:#0B0B0B; --r-sup:#0B0B0B; --r-team:#0B0B0B;
  --rad:2px;
  --f-display:"Archivo","Helvetica Neue",Arial,system-ui,sans-serif;
  --f-body:"Archivo","Helvetica Neue",Arial,system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --f-hex:"Archivo","Helvetica Neue",Arial,system-ui,sans-serif;
  /* Draft room: always black */
  --cs-bg:#050505; --cs-glow:#1C1C1C; --cs-panel:#0D0D0D; --cs-panel2:#151515; --cs-line:#242424; --cs-line-gold:#343434;
  --cs-gold:#FFFFFF; --cs-gold-hi:#FFFFFF; --cs-gold-dim:#5C5C5C; --cs-ink:#CFCFCF; --cs-muted:#7C7C7C;
  --cs-blue:#F2F2F2; --cs-blue-dim:#161616; --cs-red:#8E8E8E; --cs-red-dim:#0F0F0F; --cs-ok:#FFFFFF;
  /* Ultimate Team style cards */
  --fut-legend-a:#FFFFFF; --fut-legend-b:#B9B9B9; --fut-legend-ink:#0B0B0B;
  --fut-elite-a:#2E2E2E; --fut-elite-b:#050505; --fut-elite-ink:#FFFFFF; --fut-elite-edge:#E6E6E6;
  --fut-pro-a:#A8703F; --fut-pro-b:#4A2A14; --fut-pro-ink:#FFF4EA; --fut-pro-edge:#C99467;      /* 80-84 : bronze */
  --fut-ch-a:#4B3A33; --fut-ch-b:#1E1714; --fut-ch-ink:#CDBFB6; --fut-ch-edge:#5E4A41;        /* 79 et moins : fonte terne */
  --fut-team-a:#2B4C7E; --fut-team-b:#0C1A2E; --fut-team-ink:#F2F7FF; --fut-team-edge:#8DB4E8; /* équipes : bleu acier */
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#080808; --surface:#121212; --sunk:#1A1A1A; --ink:#F4F4F2; --muted:#8D8D8D; --line:#262626;
  --accent:#F4F4F2; --accent-ink:#0B0B0B; --turn:#F4F4F2; --turn-soft:#1F1F1F;
  --good:#F4F4F2; --bad:#FF5A5F; --good-soft:#202020; --bad-soft:#2A1414;
  --band:#000000; --band-ink:#FFFFFF; --band-muted:#8A8A8A;
  --r-top:#F4F4F2; --r-jng:#F4F4F2; --r-mid:#F4F4F2; --r-adc:#F4F4F2; --r-sup:#F4F4F2; --r-team:#F4F4F2;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#080808; --surface:#121212; --sunk:#1A1A1A; --ink:#F4F4F2; --muted:#8D8D8D; --line:#262626;
  --accent:#F4F4F2; --accent-ink:#0B0B0B; --turn:#F4F4F2; --turn-soft:#1F1F1F;
  --good:#F4F4F2; --bad:#FF5A5F; --good-soft:#202020; --bad-soft:#2A1414;
  --band:#000000; --band-ink:#FFFFFF; --band-muted:#8A8A8A;
  --r-top:#F4F4F2; --r-jng:#F4F4F2; --r-mid:#F4F4F2; --r-adc:#F4F4F2; --r-sup:#F4F4F2; --r-team:#F4F4F2;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,.cs-title,.hexbtn{font-stretch:125%;letter-spacing:-.01em}
h3,nav.tabs button,.day .dn,.rank,.big,.rec,.duel .sc,.onclock .v,.card .pn,.csp-name,.step-h .n,.cs-phase,.label,.chip{font-stretch:88%}
.brand h1{font-weight:900!important}

.band{background:var(--band);color:var(--band-ink)}
.band .wrap{padding-block:20px 0}
.brand{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,6vw,46px);line-height:.95;letter-spacing:.01em;margin:0;text-transform:uppercase}
.brand h1 span{color:transparent;-webkit-text-stroke:1.2px var(--band-ink)}
.brand .sub{color:var(--band-muted);font-size:13px;letter-spacing:.06em;text-transform:uppercase;margin-top:6px}
.who{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.who label{color:var(--band-muted)}
.who select{background:#ffffff14;border:1px solid #ffffff26;border-radius:var(--rad);padding:6px 8px;color:var(--band-ink)}
.who select option{color:#111725}
.ticker{display:flex;gap:6px 18px;flex-wrap:wrap;margin-top:16px;font-size:13px;color:var(--band-muted)}
.ticker b{color:var(--band-ink);font-weight:600}
.ticker .dot{width:6px;height:6px;border-radius:50%;background:var(--band-ink);display:inline-block;margin-right:6px;vertical-align:middle}
nav.tabs{display:flex;gap:2px;margin-top:16px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{background:none;border:0;padding:10px 14px 12px;color:var(--band-muted);font-family:var(--f-display);font-weight:600;font-size:17px;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;position:relative}
nav.tabs button[aria-selected="true"]{color:var(--band-ink);border-bottom-color:var(--band-ink)}
nav.tabs button:hover{color:var(--band-ink)}
nav.tabs .badge{display:inline-block;min-width:8px;height:8px;border-radius:50%;background:var(--band-ink);margin-left:6px;vertical-align:middle}

main .wrap{padding-block:22px 48px;display:grid;gap:22px}
h2{font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:.02em;text-transform:uppercase;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:18px;letter-spacing:.03em;text-transform:uppercase;margin:0}
.lede{color:var(--muted);margin:4px 0 0;max-width:65ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--rad);padding:18px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.stack{display:grid;gap:12px}
.muted{color:var(--muted)}
.small{font-size:13px}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--rad);padding:8px 14px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:13px}
select.in,input.in{background:var(--surface);border:1px solid var(--line);border-radius:var(--rad);padding:8px 10px;min-width:0}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:var(--rad);background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip .ri{color:var(--rc,var(--r-team))}
.ri{display:inline-block;vertical-align:-3px;flex:none}
.rc-TOP{--rc:var(--r-top)}.rc-JNG{--rc:var(--r-jng)}.rc-MID{--rc:var(--r-mid)}.rc-ADC{--rc:var(--r-adc)}.rc-SUP{--rc:var(--r-sup)}.rc-TEAM{--rc:var(--r-team)}
.team{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.pill{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.turn{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.pill.good{background:var(--ink);color:var(--bg)}
.pill.bad{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.notice{border-left:4px solid var(--turn);background:var(--turn-soft);padding:12px 14px;border-radius:var(--rad)}
.notice.info{border-left-color:var(--accent);background:var(--sunk)}
.err{color:var(--bad)}

.tscroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--rad);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;background:var(--sunk);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.rank{font-family:var(--f-display);font-weight:800;font-size:22px;width:44px;color:var(--muted)}
tr.lead .rank{color:var(--turn)}
.name{font-weight:600}
.big{font-family:var(--f-display);font-weight:700;font-size:20px}
.rec{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.02em;white-space:nowrap}
.rec .w{color:var(--ink)} .rec .l{color:var(--muted)}
.cell-p{display:grid;gap:1px;min-width:86px}
.cell-p .pn{font-weight:600;font-size:13px;white-space:nowrap}
.cell-p .pp{font-family:var(--f-mono);font-size:12px;color:var(--muted)}

.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.day{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:var(--rad);padding:8px 10px;min-width:92px;cursor:pointer;text-align:left}
.day[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.day .dn{font-family:var(--f-display);font-weight:700;font-size:16px;letter-spacing:.03em}
.day .dd{font-size:12px;color:var(--muted)}
.day .dw{font-size:12px;font-weight:600;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}

/* Duels */
.duels{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.duel{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--rad);padding:12px 14px}
.duel.mine{border-color:var(--turn);box-shadow:inset 0 0 0 1px var(--turn)}
.duel .side{min-width:0}
.duel .side.b{text-align:right}
.duel .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.duel .rc{font-size:12px;color:var(--muted)}
.duel .sc{font-family:var(--f-display);font-weight:800;font-size:24px;white-space:nowrap;font-variant-numeric:tabular-nums}
.duel .sc .vs{color:var(--muted);font-size:15px;margin:0 6px;font-weight:600}
.duel .won .nm{color:var(--good)}

/* Draft + cards */
.draft-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:820px){.draft-grid{grid-template-columns:1fr}}
.onclock{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--band);color:var(--band-ink);border-radius:var(--rad);padding:14px 18px}
.onclock .k{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--band-muted)}
.onclock .v{font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1.05;text-transform:uppercase}
.onclock .v.me{color:var(--turn)}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters .seg{display:flex;border:1px solid var(--line);border-radius:var(--rad);overflow:hidden;background:var(--surface);flex-wrap:wrap}
.filters .seg button{border:0;background:none;padding:7px 10px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.filters .seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.pool{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.card{border:1px solid var(--line);background:var(--surface);border-radius:var(--rad);padding:10px 12px;display:grid;gap:6px;text-align:left;cursor:pointer;position:relative;min-width:0}
.card:hover:not(:disabled){border-color:var(--accent)}
.card:disabled{cursor:not-allowed}
.card.taken{opacity:.42}
.card.blocked{opacity:.6}
.card.sel{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.card.out{border-color:var(--bad);box-shadow:inset 0 0 0 2px var(--bad)}
.card .pn{font-family:var(--f-display);font-weight:700;font-size:19px;line-height:1.05;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .meta{display:flex;justify-content:space-between;align-items:center;gap:6px}
.card .owner{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.confirm{border:1px solid var(--accent);background:var(--surface);border-radius:var(--rad);padding:14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.rosters{display:grid;gap:10px}
.rosters.wide{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.roster{border:1px solid var(--line);background:var(--surface);border-radius:var(--rad);padding:10px 12px}
.roster.now{border-color:var(--turn);box-shadow:inset 0 0 0 1px var(--turn)}
.roster .rh{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:6px}
.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.slot{background:var(--sunk);border-radius:var(--rad);padding:5px 6px;min-width:0}
.slot .sl{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.slot .sv{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .sv.empty{color:var(--muted);font-weight:400}
.log{display:grid;gap:6px;max-height:320px;overflow:auto;font-size:13px}
.log div{display:flex;gap:8px;align-items:baseline}
.log .void{text-decoration:line-through;color:var(--muted)}

.step{display:grid;gap:10px}
.step-h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.step-h .n{font-family:var(--f-display);font-weight:800;font-size:15px;color:var(--accent);letter-spacing:.06em;text-transform:uppercase}

.lineup{display:grid;gap:8px}
.lu-row{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--rad)}
@media (max-width:480px){.lu-row{grid-template-columns:1fr}}
.plays{font-size:12px;font-weight:600}
.plays.yes{color:var(--good)} .plays.no{color:var(--muted)}

.rules-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.scale td:last-child{font-family:var(--f-mono);text-align:right;white-space:nowrap}
.prose li{max-width:65ch}
.prose ul{padding-left:18px;margin:6px 0}

/* ===== Champ select ===== */
.cs{--r-top:#F2F2F2;--r-jng:#F2F2F2;--r-mid:#F2F2F2;--r-adc:#F2F2F2;--r-sup:#F2F2F2;--r-team:#F2F2F2;background:radial-gradient(ellipse 90% 60% at 50% -10%, var(--cs-glow) 0%, var(--cs-bg) 70%);color:var(--cs-ink);border:1px solid var(--cs-line-gold);padding:18px;display:grid;gap:16px;color-scheme:dark;min-width:0}
.cs-top{display:grid;justify-items:center;text-align:center;gap:2px;padding-bottom:12px;border-bottom:1px solid var(--cs-line-gold);position:relative}
.cs-phase{font-family:var(--f-display);font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--cs-blue)}
.cs-title{font-family:var(--f-hex);font-weight:800;font-size:clamp(24px,4.6vw,38px);letter-spacing:.06em;text-transform:uppercase;color:var(--cs-gold-hi);line-height:1.1;text-wrap:balance}
.cs-title.me{color:var(--cs-gold);text-shadow:0 0 18px color-mix(in srgb, var(--cs-gold) 45%, transparent)}
.cs-sub{font-size:14px;color:var(--cs-muted)}
.cs-sub b{color:var(--cs-gold-hi)}
.cs-timer{font-family:var(--f-mono);font-size:15px;color:var(--cs-gold);margin-top:6px;letter-spacing:.06em}
.cs-sound{position:absolute;left:0;top:0;display:inline-flex;align-items:center;gap:6px;background:none;border:1px solid var(--cs-line);color:var(--cs-muted);padding:4px 9px;font-family:var(--f-display);font-size:12px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.cs-sound:hover{color:var(--cs-ink);border-color:var(--cs-line-gold)}
.cs-sound[aria-pressed="true"]{color:var(--cs-gold-hi)}
.cs-sound svg{width:15px;height:15px}
@media (max-width:600px){ .cs-sound{position:static;margin-bottom:6px} }
.cs-count{position:absolute;right:0;top:0;font-family:var(--f-display);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--cs-muted)}
.cs-grid{display:grid;grid-template-columns:minmax(190px,240px) minmax(0,1fr) minmax(190px,240px);grid-template-areas:"left center right";gap:14px;align-items:start}
.cs-side{grid-area:left;display:grid;gap:8px}
.cs-side.right{grid-area:right}
.cs-center{grid-area:center;display:grid;gap:12px;min-width:0}
@media (max-width:900px){.cs-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"left right" "center center"}}
@media (max-width:420px){.cs{padding:12px} .cs-grid{gap:8px}}

.csp{background:linear-gradient(90deg, var(--cs-blue-dim), var(--cs-panel) 55%);border:1px solid var(--cs-line);border-left:3px solid var(--cs-blue);padding:8px 10px;display:grid;gap:6px;min-width:0;position:relative}
.cs-side.right .csp{background:linear-gradient(270deg, var(--cs-red-dim), var(--cs-panel) 55%);border-left:1px solid var(--cs-line);border-right:3px solid var(--cs-red);text-align:right}
.csp.now{border-color:var(--cs-gold);box-shadow:0 0 0 1px var(--cs-gold), 0 0 22px color-mix(in srgb, var(--cs-gold) 30%, transparent)}
.csp.now::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(100deg, transparent 30%, color-mix(in srgb, var(--cs-gold) 14%, transparent) 50%, transparent 70%);background-size:250% 100%}
@media (prefers-reduced-motion:no-preference){.csp.now::after{animation:sheen 2.4s linear infinite}}
@keyframes sheen{from{background-position:130% 0}to{background-position:-130% 0}}
.csp-h{display:flex;align-items:center;gap:8px;justify-content:space-between;min-width:0}
.cs-side.right .csp-h{flex-direction:row-reverse}
.csp-name{font-family:var(--f-hex);font-weight:700;font-size:15px;color:var(--cs-gold-hi);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.csp-pos{font-family:var(--f-mono);font-size:11px;color:var(--cs-muted);margin-right:6px}
.cs-side.right .csp-pos{margin:0 0 0 6px}
.csp-st{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;color:var(--cs-muted)}
.csp-st.turn{color:var(--cs-gold)} .csp-st.ok{color:var(--cs-ok)} .csp-st.free{color:var(--cs-muted)}
.csp-on{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--cs-ok);margin:0 5px;vertical-align:middle}
.csp-rows{display:grid;gap:2px;font-size:13px}
.csp-row{display:grid;grid-template-columns:34px minmax(0,1fr);gap:6px;align-items:center}
.cs-side.right .csp-row{grid-template-columns:minmax(0,1fr) 34px}
.cs-side.right .csp-row .rl{order:2}
.csp-row .rl{font-family:var(--f-display);font-weight:700;font-size:11px;letter-spacing:.08em;color:var(--rc,var(--cs-muted));display:flex;align-items:center}
.cs-side.right .csp-row .rl{justify-content:flex-end}
.cs-seg button{display:inline-flex;align-items:center;justify-content:center;min-height:34px}
.cst .tr{display:flex}
.csp-row .pv{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--cs-gold-hi);font-weight:600}
.csp-row .pv.empty{color:var(--cs-muted);font-weight:400}
.csp-row .pv.hover{color:var(--cs-gold);font-style:italic}
.csp-row.team{border-top:1px solid var(--cs-line);padding-top:3px;margin-top:2px}
.csp-row.subs .pv{color:var(--cs-ink)}
.csp .join{justify-self:start;font-size:12px;padding:3px 10px}
.cs-side.right .csp .join{justify-self:end}

.cs-filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cs-seg{display:flex;flex-wrap:wrap;border:1px solid var(--cs-line-gold);background:var(--cs-panel)}
.cs-seg button{border:0;background:none;color:var(--cs-muted);padding:7px 10px;font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.cs-seg button[aria-pressed="true"]{color:var(--cs-gold-hi);background:var(--cs-line-gold)}
.cs input.in,.cs select.in{background:var(--cs-panel);border:1px solid var(--cs-line-gold);color:var(--cs-gold-hi);border-radius:0}
.cs-pool{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px;max-height:620px;overflow:auto;padding:2px}
.cst{position:relative;display:grid;gap:3px;align-content:end;min-height:92px;padding:8px;border:1px solid var(--cs-line);background:linear-gradient(180deg, var(--cs-panel2), var(--cs-panel));color:var(--cs-gold-hi);text-align:left;cursor:pointer;overflow:hidden;min-width:0}
.cst::before{content:attr(data-team);position:absolute;top:2px;right:6px;font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1;color:var(--cs-line);letter-spacing:.02em}
.cst .rb{position:absolute;top:0;left:0;right:0;height:3px;background:var(--rc,var(--cs-muted))}
.cst .tr{font-family:var(--f-display);font-weight:700;font-size:11px;letter-spacing:.1em;color:var(--rc,var(--cs-muted));position:relative}
.cst .nm{font-family:var(--f-display);font-weight:700;font-size:18px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative}
.cst .ow{font-size:11px;color:var(--cs-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative}
.cst:hover:not(:disabled){border-color:var(--cs-gold-dim)}
.cst:disabled{cursor:not-allowed}
.cst.taken{filter:grayscale(1);opacity:.35}
.cst.blocked{opacity:.45}
.cst.sel{border-color:var(--cs-gold);box-shadow:inset 0 0 0 1px var(--cs-gold), 0 0 14px color-mix(in srgb, var(--cs-gold) 35%, transparent)}
.cst.peer{border-color:var(--cs-blue)}
.cst .hv{position:absolute;left:6px;top:8px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--cs-blue)}

.cs-lock{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--cs-line-gold);padding-top:12px}
.cs-lock .what{color:var(--cs-muted);font-size:14px}
.cs-lock .what b{color:var(--cs-gold-hi)}
.hexbtn{font-family:var(--f-hex);font-weight:800;font-size:17px;letter-spacing:.12em;text-transform:uppercase;padding:12px 34px;border:2px solid var(--cs-gold);background:linear-gradient(180deg, var(--cs-panel2), var(--cs-panel));color:var(--cs-gold-hi);cursor:pointer}
.hexbtn:hover:not(:disabled){box-shadow:0 0 16px color-mix(in srgb, var(--cs-gold) 45%, transparent);border-color:var(--cs-gold-hi)}
.hexbtn:disabled{border-color:var(--cs-gold-dim);color:var(--cs-muted);cursor:not-allowed}
.hexbtn.ready{border-color:var(--cs-ok);color:var(--cs-ok)}
.hexbtn.sm{font-size:13px;padding:8px 18px}
.cs .ghost{background:none;border:1px solid var(--cs-line-gold);color:var(--cs-ink);padding:6px 12px;cursor:pointer;font-weight:600}
.cs .ghost:hover{border-color:var(--cs-gold)}
.cs-lobby{display:grid;gap:14px;justify-items:center;text-align:center;padding:24px 8px;border:1px solid var(--cs-line);background:var(--cs-panel)}
.cs-lobby p{margin:0;max-width:48ch;color:var(--cs-muted)}
.cs-bar{height:6px;width:min(320px,100%);background:var(--cs-line);overflow:hidden}
.cs-bar span{display:block;height:100%;background:var(--cs-ok)}
.cs-rolls{list-style:none;margin:0;padding:0;display:grid;gap:6px;width:min(420px,100%)}
.cs-rolls li{display:grid;grid-template-columns:28px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 12px;border:1px solid var(--cs-line);background:var(--cs-panel2);text-align:left}
.cs-rolls li.first{border-color:var(--cs-gold);box-shadow:0 0 16px color-mix(in srgb, var(--cs-gold) 30%, transparent)}
.cs-rolls .rk{font-family:var(--f-hex);font-weight:800;color:var(--cs-gold)}
.cs-rolls .nm{font-family:var(--f-hex);font-weight:700;color:var(--cs-gold-hi);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cs-rolls .fp{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--cs-bg);background:var(--cs-gold);padding:2px 7px;white-space:nowrap}
.roll{font-family:var(--f-mono);font-weight:600;font-size:22px;min-width:3ch;text-align:right;color:var(--cs-muted);font-variant-numeric:tabular-nums}
.roll.done{color:var(--cs-gold-hi)}
.roll.mini{font-size:15px;min-width:3ch}
.roll.pop{animation:pop .45s ease-out}
@keyframes pop{0%{transform:scale(1.6);color:var(--cs-gold)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.roll.pop{animation:none}}
.cs-rules{font-size:12px;letter-spacing:.04em;color:var(--cs-muted)}
.cs-rules b{color:var(--cs-gold-hi);font-weight:600}
.csp-ovr{display:inline-block;margin-left:8px;padding:1px 5px;font-family:var(--f-mono);font-size:11px;font-weight:600;background:var(--cs-gold-hi);color:var(--cs-bg);vertical-align:2px}
.cs-j1{display:grid;gap:10px;justify-items:center;text-align:center;padding:4px 0 14px;border-bottom:1px solid var(--cs-line-gold)}
.cs-j1 p{margin:0;color:var(--cs-muted)}
.cs-j1 .duels{width:100%}
.cs .duel{background:var(--cs-panel2);border-color:var(--cs-line);color:var(--cs-ink);text-align:left}
.cs .duel .nm{color:var(--cs-gold-hi)}
.cs .duel .rc,.cs .duel .vs{color:var(--cs-muted)}
.cs .duel.mine{border-color:var(--cs-gold);box-shadow:inset 0 0 0 1px var(--cs-gold)}
.cs-log{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--cs-muted)}
.cs-log span{border:1px solid var(--cs-line);padding:3px 8px;white-space:nowrap}
.cs-log b{color:var(--cs-gold-hi);font-weight:600}





.fut .f-attr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px 4px;font-size:8.5px;font-weight:700;letter-spacing:.06em;opacity:.85}
.fut .f-attr span{display:flex;gap:3px;align-items:baseline;white-space:nowrap}
.fut .f-attr b{font-family:var(--f-mono);font-size:12px;font-weight:700;letter-spacing:0}
.fut{container-type:inline-size}
@container (max-width:150px){ .fut .f-attr{gap:1px 2px;font-size:7px;letter-spacing:.02em} .fut .f-attr span{gap:2px} .fut .f-attr b{font-size:10px} }
/* ===== Card sheet (fiche) ===== */
#fiche{position:fixed;inset:0;z-index:65;display:flex;padding:24px 16px;overflow:auto;background:rgba(0,0,0,.72)}
#fiche .box{margin:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:var(--rad);width:min(760px,100%);padding:20px;display:grid;gap:16px}
#fiche .top{display:grid;grid-template-columns:200px minmax(0,1fr);gap:22px;align-items:start}
#fiche .top .fut{width:200px;min-height:230px;cursor:default}
#fiche .top .fut .f-ovr{font-size:56px}
#fiche h3{margin:0}
#fiche .sub{color:var(--muted);font-size:14px;margin:2px 0 0}
#fiche .bars{display:grid;gap:9px;margin-top:12px}
#fiche .bar{display:grid;grid-template-columns:96px 34px minmax(0,1fr);gap:10px;align-items:center;font-size:14px}
#fiche .bar .v{font-family:var(--f-mono);font-weight:700;text-align:right}
#fiche .bar .t{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}
#fiche .bar .t i{display:block;height:100%;background:var(--ink);border-radius:4px}
#fiche .bar .w{font-size:11px;color:var(--muted)}
#fiche .badges{display:flex;flex-wrap:wrap;gap:6px}
#fiche .form{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
#fiche .form div{background:var(--sunk);border-radius:var(--rad);padding:8px 10px}
#fiche .form b{display:block;font-family:var(--f-mono);font-size:17px}
#fiche .form span{font-size:12px;color:var(--muted)}
#fiche .close{justify-self:end}
@media (max-width:600px){ #fiche .top{grid-template-columns:1fr} #fiche .top .fut{justify-self:center} #fiche .bar{grid-template-columns:84px 30px minmax(0,1fr)} }

/* ===== Draft finished ===== */
.dd-hero{display:grid;justify-items:center;gap:10px;text-align:center;padding:30px 16px;background:radial-gradient(ellipse 80% 70% at 50% 0%,#1E1E1E,#050505 70%);color:#F4F4F2;border-radius:var(--rad)}
.dd-hero .fa-kicker{font:700 12px var(--f-display);letter-spacing:.3em;text-transform:uppercase;color:#8A8A8A}
.dd-t{font-family:var(--f-display);font-weight:900;font-stretch:115%;font-size:clamp(30px,6vw,56px);text-transform:uppercase;line-height:.95;padding:6px 16px;border:3px solid #F4F4F2;transform:rotate(-2deg)}
.dd-hero .btn{background:transparent;color:#F4F4F2;border-color:#555}
.dd-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.dd-r{background:var(--surface);border:1px solid var(--line);border-radius:var(--rad);padding:10px 12px;display:grid;gap:8px}
.dd-r.mine{box-shadow:inset 0 0 0 2px var(--ink)}
.dd-n{display:flex;justify-content:space-between;align-items:center;gap:8px}
.dd-l{display:grid;gap:3px}
.dd-p{display:flex;align-items:center;gap:6px;font-size:14px}
.dd-p .ovr-mini{margin-left:auto}
/* ===== Journées: schedule, Swiss bracket ===== */
.nd-wrap{display:grid;gap:8px}
.up-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.up-day{display:grid;gap:6px;align-content:start}
.up-row{display:grid;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:var(--rad);padding:8px 10px}
.pm{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto;align-items:center;gap:8px;font-size:14px}
.pm-t{display:flex;gap:6px;align-items:baseline;min-width:0}
.pm-t.l{justify-content:flex-end} .pm-t.r{justify-content:flex-start}
.pm-t b{font-family:var(--f-display);font-weight:800;letter-spacing:.02em}
.pm-t i{font-style:normal;font-family:var(--f-mono);font-size:13px}
.pm-t.lost{color:var(--muted)} .pm-t.won b{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:2px}
.pm-vs{color:var(--muted);font-size:12px}
.pm-when{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap;justify-self:end}
.pm-chips{display:flex;flex-wrap:wrap;gap:4px}
.chip.own{background:var(--ink);color:var(--bg)}
.chip.opp{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.sw-scroll{overflow-x:auto;padding-bottom:4px}
.sw-grid{display:grid;grid-template-columns:repeat(6,minmax(148px,1fr));gap:8px;min-width:940px}
.sw-col{display:grid;gap:8px;align-content:start}
.sw-pool{background:var(--surface);border:1px solid var(--line);border-radius:var(--rad);padding:8px 10px;display:grid;gap:6px;align-content:start}
.sw-pool.end{background:var(--sunk)}
.sw-h{font-family:var(--f-display);font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.sw-pool .pm{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);font-size:13px}
.sw-pool .pm-when{grid-column:1 / -1;justify-self:center;font-size:11px}
.sw-wait{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.sw-end{display:flex;justify-content:space-between;font-size:13px}
.sw-end span{font-family:var(--f-mono);color:var(--muted)}
.ko-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.ko-d{margin-top:4px}
/* ===== End-of-draft show: title, then J1 draw ===== */
#fw-anim{position:fixed;inset:0;z-index:70;overflow:auto;color:#F4F4F2;font-family:var(--f-body);
  background:radial-gradient(ellipse 80% 55% at 50% 30%, #1E1E1E 0%, #070707 62%, #020202 100%);
  display:flex;padding:56px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));animation:fa-in .35s ease-out both}
#fw-anim .fa-skip{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px));background:none;border:1px solid #3A3A3A;color:#9A9A9A;background:#0B0B0B;padding:6px 12px;font:600 12px var(--f-display);letter-spacing:.12em;text-transform:uppercase;cursor:pointer;z-index:2}
#fw-anim .fa-skip:hover{color:#FFF;border-color:#777}
#fw-anim .fa-stage{display:grid;justify-items:center;text-align:center;gap:14px;width:min(860px,100%);margin:auto}
#fw-anim .fa-kicker{font:700 13px var(--f-display);letter-spacing:.32em;text-transform:uppercase;color:#8A8A8A}
#fw-anim .fa-logo{font-family:var(--f-display);font-weight:900;font-stretch:125%;text-transform:uppercase;line-height:.9;letter-spacing:-.01em;font-size:clamp(40px,10vw,104px)}
#fw-anim .fa-logo span{display:inline-block;opacity:0;transform:translateY(40%) scale(.96);animation:fa-up .6s cubic-bezier(.2,.9,.2,1) forwards}
#fw-anim .fa-logo .o{color:transparent;-webkit-text-stroke:2px #F4F4F2}
#fw-anim .fa-line{height:2px;width:0;background:#F4F4F2;animation:fa-grow .7s .9s cubic-bezier(.6,0,.2,1) forwards}
#fw-anim .fa-stamp{font-family:var(--f-display);font-weight:900;font-stretch:110%;font-size:clamp(22px,4.6vw,40px);letter-spacing:.14em;text-transform:uppercase;
  padding:8px 18px;border:3px solid #F4F4F2;opacity:0;transform:scale(1.9) rotate(-4deg);animation:fa-stamp .38s 1.45s cubic-bezier(.3,1.6,.5,1) forwards}
#fw-anim .fa-sub{color:#A5A5A5;font-size:15px;max-width:52ch;opacity:0;animation:fa-fade .5s forwards}
#fw-anim .fa-title2{font-family:var(--f-display);font-weight:900;font-stretch:115%;font-size:clamp(28px,6vw,58px);text-transform:uppercase;line-height:.95;opacity:0;animation:fa-up .55s cubic-bezier(.2,.9,.2,1) forwards}
#fw-anim .fa-duels{display:grid;gap:10px;width:100%;margin-top:10px}
#fw-anim .fa-duel{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px;opacity:0;transform:translateY(14px);animation:fa-up .4s cubic-bezier(.2,.9,.2,1) forwards}
#fw-anim .fa-slot{display:grid;gap:2px;padding:12px 14px;border:1px solid #333;background:linear-gradient(180deg,#141414,#0B0B0B);min-width:0;min-height:64px;align-content:center;position:relative;overflow:hidden}
#fw-anim .fa-slot.l{text-align:right} #fw-anim .fa-slot.r{text-align:left}
#fw-anim .fa-slot b{font-family:var(--f-display);font-weight:800;font-stretch:90%;font-size:clamp(17px,3vw,24px);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#fw-anim .fa-slot small{font:500 12px var(--f-mono);color:#8A8A8A;min-height:15px}
#fw-anim .fa-slot.spin b{color:#6E6E6E;filter:blur(.4px)}
#fw-anim .fa-slot.done{border-color:#F4F4F2;background:linear-gradient(180deg,#1C1C1C,#0E0E0E);animation:fa-hit .35s ease-out}
#fw-anim .fa-slot.me{box-shadow:inset 0 0 0 2px #F4F4F2}
#fw-anim .fa-vs{font-family:var(--f-display);font-weight:900;font-size:22px;letter-spacing:.06em;color:#555;transition:color .2s,transform .2s}
#fw-anim .fa-vs.on{color:#F4F4F2;transform:scale(1.15)}
#fw-anim .fa-go{margin-top:14px;font:800 15px var(--f-display);font-stretch:115%;letter-spacing:.12em;text-transform:uppercase;padding:14px 30px;border:0;background:#F4F4F2;color:#050505;cursor:pointer;opacity:0;animation:fa-fade .4s forwards}
#fw-anim .fa-go:hover{background:#D9D9D9}
#fw-anim .fa-wait{color:#8A8A8A;font-size:14px}
@keyframes fa-in{from{opacity:0}to{opacity:1}}
@keyframes fa-up{to{opacity:1;transform:none}}
@keyframes fa-fade{to{opacity:1}}
@keyframes fa-grow{to{width:min(520px,80%)}}
@keyframes fa-stamp{to{opacity:1;transform:scale(1) rotate(-4deg)}}
@keyframes fa-hit{0%{transform:scale(1.06)}100%{transform:none}}
@media (max-width:560px){ #fw-anim .fa-duel{gap:6px} #fw-anim .fa-slot{padding:9px 8px;min-height:54px} #fw-anim .fa-slot b{font-size:15px} #fw-anim .fa-slot small{font-size:10.5px} #fw-anim .fa-vs{font-size:15px} }
@media (prefers-reduced-motion: reduce){ #fw-anim *, #fw-anim{animation-duration:.01s!important;animation-delay:0s!important} }
/* ===== Card figure ===== */
.fut > div{position:relative;z-index:1}
/* Generic figure on every card: a silhouette for players, a crest for teams (no photos) */
.fut .f-sil{position:absolute;z-index:0;right:4%;top:8px;width:58%;height:calc(100% - 78px);color:var(--i);opacity:.2;pointer-events:none}
.fut.t-legend .f-sil{opacity:.16}
.fut .f-top{flex-direction:column;align-items:flex-start;gap:4px}
.fut .f-side{justify-items:start;gap:3px}
.ph-teams{display:grid;gap:22px}
.ph-team h3{margin:0 0 10px;display:flex;gap:10px;align-items:baseline}
.ph-team h3 small{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-weight:500}
.ph-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.ph-cell{display:grid;gap:6px;min-width:0}
.ph-cell .fut{cursor:pointer}
/* ===== Ultimate Team style cards ===== */
.fut{--a:var(--fut-pro-a);--b:var(--fut-pro-b);--i:var(--fut-pro-ink);--e:var(--fut-pro-edge);
  position:relative;display:grid;grid-template-rows:auto 1fr auto auto;gap:5px;min-height:172px;min-width:0;padding:11px 11px 9px;
  background:linear-gradient(155deg,var(--a),var(--b));color:var(--i);border:0;box-shadow:inset 0 0 0 1px var(--e);
  clip-path:polygon(14px 0,calc(100% - 14px) 0,100% 14px,100% 100%,0 100%,0 14px);
  text-align:left;cursor:pointer;font-family:var(--f-body);overflow:hidden;color-scheme:dark}
.fut.t-legend{--a:var(--fut-legend-a);--b:var(--fut-legend-b);--i:var(--fut-legend-ink);--e:var(--fut-legend-a);color-scheme:light}
.fut.t-elite{--a:var(--fut-elite-a);--b:var(--fut-elite-b);--i:var(--fut-elite-ink);--e:var(--fut-elite-edge)}
.fut.t-chall{--a:var(--fut-ch-a);--b:var(--fut-ch-b);--i:var(--fut-ch-ink);--e:var(--fut-ch-edge);

(() => {

// Lane icons drawn for this game: a small map with the lane highlighted (Top, Mid, Bot), leaves for Jungle, a shield for Support, a banner for the team.

  JNG: '<path d="M12 21.5c-.4-6.2 1.3-11 7.6-15.4-.5 6.6-2.7 11-7.6 13.3z" fill="currentColor"/><path d="M11.4 21.5C11.6 16.8 10 13.3 4.5 10.4c.2 5.3 2.3 8.6 6.9 9.9z" fill="currentColor" fill-opacity=".7"/><path d="M12 21.5v-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>',

function tierOf(o){ return o>=90 ? 'legend' : o>=85 ? 'elite' : o>=80 ? 'pro' : 'chall'; }
// Real Worlds numbers shown at the bottom of each card (average fantasy points, KDA or series record, CS per game)
function seasonLine(pid){
  const p = PLAYERS[pid]; let days=0, pts=0, g=0, k=0, d=0, a=0, cs=0;
  DAYS.forEach(day => { const st = S.stats[day.id]; if(!st) return;
    if(p.role==='TEAM'){ const t = st.teams?.[p.team]; if(t){ days++; pts += teamPoints(t); g += (Number(t.gw)||0)+(Number(t.gl)||0); k += Number(t.sw)||0; d += Number(t.sl)||0; } }
    else { const s = st.players?.[pid]; if(s && Number(s.g)>0){ days++; pts += playerPoints(s); g += Number(s.g); k += Number(s.k)||0; d += Number(s.d)||0; a += Number(s.a)||0; cs += Number(s.cs)||0; } } });
  if(!days) return null;
  return p.role==='TEAM' ? {pts:pts/days, x:`${k}-${d}`, y:g} : {pts:pts/days, x:((k+a)/Math.max(1,d)).toFixed(1), y:Math.round(cs/Math.max(1,g))};
}
function futCard(pid, o){
  o = o || {}; const p = PLAYERS[pid]; const L = seasonLine(pid); const team = p.role==='TEAM';
  return `<button class="fut t-${team?'team':tierOf(p.ovr)} ${o.cls||''}" ${o.attr||''} ${o.disabled?'disabled':''} title="${esc(p.name)} · ${p.team} · ${ROLE_FR[p.role]} · note ${p.ovr}">

    <div class="f-name ${p.name.length>14?'xlong':(p.name.length>8?'long':'')}">${esc(p.name)}</div>
    <div class="f-attr">${ATTR[team?'TEAM':'PLAYER'].map(([k,ab])=>`<span><b>${p.attr[k]}</b>${ab}</span>`).join('')}</div>
    <div class="f-foot">${o.note || (L ? `Worlds : ${fmt(L.pts)} pts / jour` : '&nbsp;')}</div></button>`;
}
const ovrMini = pid => pid && PLAYERS[pid] ? `<span class="ovr-mini">${PLAYERS[pid].ovr}</span>` : '';
function roleIcon(role, size){ size = size || 16; return `<svg class="ri" viewBox="0 0 24 24" width="${size}" height="${size}" aria-hidden="true" focusable="false">${ICON_PATHS[role]||''}</svg>`; }
const PICKS_PER_SEAT = 8, MAX_SWAPS = 2;

// r = notes façon Ultimate Team [Top, Jungle, Mid, ADC, Support, Équipe], estimées d'après le top 20 Worlds 2026 de Sheep Esports,
// les classements par poste de Strafe et le power ranking Sheep Esports (octobre 2026), puis ajustées par la ligue le 19/10.
const TEAMS = [

  {code:'CFO', name:'CTBC Flying Oyster', p:['Rest','Shad0w','Pout','Doggo','Kino'], r:[75, 77, 76, 83, 76, 73]},
  {code:'LOS', name:'LOS', p:['ZEST','Curse','Feisty','Duduhh','Ackerman'], r:[75, 75, 77, 74, 74, 74]},
];
const PLAYERS = {};
TEAMS.forEach(t => {
  ROLES.forEach((r,i) => PLAYERS[t.code+'-'+r] = {id:t.code+'-'+r, name:t.p[i], role:r, team:t.code, ovr:t.r[i]});
  PLAYERS[t.code+'-TEAM'] = {id:t.code+'-TEAM', name:t.name, role:'TEAM', team:t.code, ovr:t.r[5]};
});
const ROLE_ORDER = p => ALLR.indexOf(PLAYERS[p].role);

// ---------- Sub-ratings (Ultimate Team style) ----------
// Estimated by Claude before the Worlds from each player's known style; they are spread around the
// league's overall rating, whose value never changes: the weighted average of the 6 sub-ratings (weights by position) = overall rating.
const ATTR = {
  PLAYER: [['early','EAR','Early game'],['meca','MÉC','Mécanique'],['tf','TF','Teamfight'],['macro','MAC','Macro'],['farm','FRM','Farm'],['vision','VIS','Vision']],
  TEAM:   [['early','EAR','Early game'],['obj','OBJ','Objectifs'],['tf','TF','Teamfight'],['macro','MAC','Macro'],['const','CST','Constance'],['draft','DRF','Draft']],
};
const ATTR_W = {
  TOP:{early:.22, meca:.22, tf:.18, macro:.14, farm:.16, vision:.08},
  JNG:{early:.20, meca:.14, tf:.18, macro:.26, farm:.10, vision:.12},
  MID:{early:.20, meca:.22, tf:.20, macro:.16, farm:.14, vision:.08},
  ADC:{early:.16, meca:.22, tf:.24, macro:.10, farm:.22, vision:.06},
  SUP:{early:.18, meca:.12, tf:.22, macro:.20, farm:.03, vision:.25},
  TEAM:{early:1/6, obj:1/6, tf:1/6, macro:1/6, const:1/6, draft:1/6},
};
const ROLE_BASE = {TOP:{vision:-6, farm:1}, JNG:{farm:-6, vision:2}, MID:{vision:-5, farm:1}, ADC:{vision:-9, farm:3, macro:-2}, SUP:{farm:-30, vision:3, meca:-2}, TEAM:{}};
const TAG_FX = {
  lane:{early:4, farm:2}, farm:{farm:4, early:1}, tf:{tf:4}, meca:{meca:4}, macro:{macro:4, vision:1}, vision:{vision:4, macro:1},
  aggro:{early:3, meca:2, macro:-2}, carry:{meca:2, farm:2, tf:1}, engage:{tf:3, early:1}, veteran:{macro:3, tf:1, meca:-2}, rookie:{meca:2, macro:-3},
  obj:{obj:4}, const:{const:4}, draft:{draft:4},
};
const STYLE = {
  'GEN-TOP':['lane','tf'], 'GEN-JNG':['meca','carry'], 'GEN-MID':['lane','farm'], 'GEN-ADC':['tf','carry'], 'GEN-SUP':['vision'],
  'HLE-TOP':['meca','aggro'], 'HLE-JNG':['aggro'], 'HLE-MID':['meca','tf'], 'HLE-ADC':['tf','veteran'], 'HLE-SUP':['engage','vision'],
  'T1-TOP':['tf'], 'T1-JNG':['aggro','tf'], 'T1-MID':['veteran','tf'], 'T1-ADC':['carry','lane'], 'T1-SUP':['meca','vision'],
  'DK-TOP':['rookie'], 'DK-JNG':['aggro'], 'DK-MID':['veteran','macro'], 'DK-ADC':['lane','carry'], 'DK-SUP':['rookie'],
  'AL-TOP':['tf'], 'AL-JNG':['macro','farm'], 'AL-MID':['lane'], 'AL-ADC':['carry'], 'AL-SUP':['engage'],
  'BLG-TOP':['meca','aggro'], 'BLG-JNG':['aggro'], 'BLG-MID':['meca','carry'], 'BLG-ADC':['carry','tf'], 'BLG-SUP':['engage','aggro'],
  'TES-TOP':['tf'], 'TES-JNG':['macro'], 'TES-MID':['meca'], 'TES-ADC':['aggro','meca'],
  'IG-TOP':['meca','aggro'], 'IG-JNG':['macro'], 'IG-MID':['veteran','lane'], 'IG-ADC':['rookie'], 'IG-SUP':['veteran','vision'],
  'G2-TOP':['tf'], 'G2-JNG':['aggro'], 'G2-MID':['meca','aggro'], 'G2-ADC':['lane','meca'], 'G2-SUP':['engage'],
  'MKOI-TOP':['aggro'], 'MKOI-JNG':['aggro','macro'], 'MKOI-MID':['meca'], 'MKOI-ADC':['farm'], 'MKOI-SUP':['engage'],
  'KC-TOP':['lane'], 'KC-JNG':['aggro'], 'KC-ADC':['meca','lane'], 'KC-SUP':['vision'],
  'TL-TOP':['tf'], 'TL-JNG':['macro'], 'TL-ADC':['carry'], 'TL-SUP':['veteran','vision'],
  'LYON-TOP':['tf'], 'LYON-JNG':['macro','aggro'], 'LYON-ADC':['carry','meca'],
  'CFO-ADC':['carry'],
  'GEN-TEAM':['macro','const'], 'HLE-TEAM':['tf','early'], 'T1-TEAM':['tf','draft'], 'BLG-TEAM':['early','tf'], 'AL-TEAM':['obj','macro'],
  'DK-TEAM':['draft'], 'G2-TEAM':['early'], 'TES-TEAM':['early'], 'KC-TEAM':['tf'],
};
function computeAttrs(p){
  const kind = p.role==='TEAM' ? 'TEAM' : 'PLAYER', w = ATTR_W[p.role];
  const raw = {};
  ATTR[kind].forEach(([k]) => raw[k] = p.ovr + (ROLE_BASE[p.role][k]||0));
  (STYLE[p.id]||[]).forEach(t => Object.entries(TAG_FX[t]||{}).forEach(([k,v]) => { if(k in raw) raw[k] += v; }));
  const avg = Object.entries(raw).reduce((t,[k,v]) => t + v*w[k], 0);
  const shift = p.ovr - avg;
  const out = {}; Object.keys(raw).forEach(k => out[k] = Math.max(30, Math.min(99, Math.round(raw[k] + shift))));
  return out;
}
Object.values(PLAYERS).forEach(p => { p.attr = computeAttrs(p); p.estimated = !!STYLE[p.id]; });


const DAYS = [
  {id:'d01', date:'2026-10-23', stage:'Swiss', fmt:'Ronde 1 · Bo1', lock:'2026-10-23T17:00:00Z'},

  {id:'d15', date:'2026-11-14', stage:'Finale', lock:'2026-11-14T18:00:00Z'},
];
DAYS.forEach((d,i) => { d.n = i+1; d.i = i; if(!d.fmt) d.fmt = d.stage; });
const DN = DAYS.length;

// League scale (2026). Player, per game: (2 per kill + 1.5 per assist + 0.04 per CS + 0.1 per vision point),
// deaths count 0, then × (1 + share of the team's damage), then × 1.2 on a win.
// Team, per game: win 20, dragon 3, baron 4, void grub 2; averaged over the day, then +5 per Bo3 won, +10 per Bo5 won.
const SCORE = {k:2, d:0, a:1.5, cs:0.04, vis:0.1, win:0.2, tWin:20, tDr:3, tBn:4, tGr:2, tBo3:5, tBo5:10};
function gamePoints(l){
  const v = x => Number(l[x])||0;
  const base = SCORE.k*v('k') + SCORE.a*v('a') + SCORE.cs*v('cs') + SCORE.vis*v('v');
  return base * (1 + v('p')/100) * (v('w') ? 1+SCORE.win : 1);
}
// Points are averaged over the games played that day, so a Bo3 weighs the same as a Bo1.
function playerPoints(s){
  if(!s) return 0; const v = x => Number(s[x])||0;
  if(Array.isArray(s.gl) && s.gl.length) return s.gl.reduce((t,l) => t + gamePoints(l), 0) / s.gl.length;
  const g = Math.max(1, v('g')); // older documents without per-game lines: same formula on the day's averages
  return gamePoints({k:v('k')/g, a:v('a')/g, cs:v('cs')/g, v:v('vis')/g, p:v('dmg')/g, w:0}) * (1 + SCORE.win*v('w')/g);
}
function teamPoints(t){
  if(!t) return 0; const v = x => Number(t[x])||0; const g = Math.max(1, v('gw') + v('gl'));
  const perGame = SCORE.tWin*v('gw') + SCORE.tDr*v('dr') + SCORE.tBn*v('bn') + SCORE.tGr*v('gr');
  return perGame/g + SCORE.tBo3*v('s3') + SCORE.tBo5*v('s5');
}

// ---------- State ----------
const S = {db:null, me:null, isOwner:false, readOnly:false,
  config:null, picks:[], lineups:{}, stats:{}, schedule:{}, moves:[], matchups:{},
  tab:'classement', viewSeat:null, dayId:null, poolRole:'ALL', poolTeam:'ALL', poolQuery:'', pending:null,
  tx:null, faRole:'ALL', confirmReset:false, room:null, peers:[], loaded:{config:false,picks:false,moves:false,matchups:false,leagues:false}, genBusy:{}, lid:null, leagues:[], joinCode:null, invite:undefined};
let M = null; // computed model

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => (Math.round(n*10)/10).toLocaleString('fr-FR',{minimumFractionDigits:1,maximumFractionDigits:1});
const pad = n => String(n).padStart(3,'0');
const store = {get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,3000)}
const dtFmt = new Intl.DateTimeFormat('fr-FR',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit',timeZone:'Europe/Paris'});
const dFmt = new Intl.DateTimeFormat('fr-FR',{weekday:'short',day:'numeric',month:'short',timeZone:'UTC'});
const dayDate = d => dFmt.format(new Date(d.date+'T12:00:00Z'));
const dLong = new Intl.DateTimeFormat('fr-FR',{weekday:'long',day:'numeric',month:'long',timeZone:'UTC'});
const dayLong = d => { const t = dLong.format(new Date(d.date+'T12:00:00Z')); return t.charAt(0).toUpperCase()+t.slice(1); };
const lockOf = d => new Date((S.config?.locks||{})[d.id] || d.lock);
const isLocked = d => Date.now() >= lockOf(d).getTime();
const seats = () => S.config?.seats || [];
const N = () => seats().length;
// Unclaimed seats all share the default name: number them so duels and the draw stay readable
const seatName = i => { const st = seats()[i]; if(!st) return '—'; const n = st.name || ''; return (!st.uid && (!n || /^place libre$/i.test(n.trim()))) ? 'Place libre '+(i+1) : (n || '—'); };
const totalPicks = () => N()*PICKS_PER_SEAT;
const pname = pid => PLAYERS[pid]?.name || '—';

// ---------- Draft helpers ----------
function seatForPick(n){
  const order = S.config.order, k = order.length, round = Math.floor(n/k), idx = n%k;
  return order[round%2===0 ? idx : k-1-idx];
}
function draftSlots(){ const r = seats().map(()=>({})); S.picks.forEach(p => { if(r[p.seat]) r[p.seat][p.slot] = p.pid; }); return r; }
function draftOwner(){ const m={}; S.picks.forEach(p=>m[p.pid]=p.seat); return m; }
function draftDone(){ return !!S.config && N()>0 && S.picks.length >= totalPicks(); }
function onClock(){ if(!S.config || S.config.status!=='draft' || draftDone()) return null; return seatForPick(S.picks.length); }
const LG = () => 'leagues/'+S.lid;
const isComm = () => !!(S.config && S.me && S.config.owner === S.me);
// Each player acts only for their own seat. The commissioner can also act for a seat nobody has taken yet (testing, absent friend not yet joined).
function canActFor(seat){ if(S.readOnly) return false; const s = seats()[seat]; if(!s || !S.me) return false; if(s.uid === S.me) return true; return isComm() && !s.uid; }
function mySeat(){ if(!S.me) return null; const i = seats().findIndex(s=>s.uid===S.me); return i<0?null:i; }
// One position per round: 1 Top, 2 Jungle, 3 Mid, 4 ADC, 5 Support, 6 pro team, 7-8 subs (any player position, no team).
const MAIN_ROUNDS = 6;
const ROUND_ROLE = ['TOP','JNG','MID','ADC','SUP','TEAM'];
const ROUND_LABEL = ['Tops','Junglers','Mids','ADC','Supports','Équipes','Remplaçants','Remplaçants'];
const ROUND_ASK = ['ton Top','ton Jungler','ton Mid','ton ADC','ton Support','ton équipe','un remplaçant, n’importe quel poste','ton deuxième remplaçant, n’importe quel poste'];
function baseSlot(roster, player){
  const filled = Object.keys(roster).length;
  if(filled >= PICKS_PER_SEAT) return null;
  if(filled < MAIN_ROUNDS) return player.role===ROUND_ROLE[filled] && !roster[player.role] ? player.role : null;
  if(player.role==='TEAM') return null;
  return !roster.SUB1 ? 'SUB1' : (!roster.SUB2 ? 'SUB2' : null);
}
// Draft limits for each participant's roster (pro players only, the team pick is not counted):
// at most 1 player per pro team, at most one player rated 92+, at most one player rated 90-91.
const CAP_TOP = 92, CAP_HIGH = 90;
function ruleBlock(roster, player){
  if(player.role==='TEAM') return '';
  const mine = Object.values(roster).map(id => PLAYERS[id]).filter(p => p && p.role!=='TEAM');
  if(mine.some(p => p.team===player.team)) return 'Déjà un joueur '+player.team;
  if(player.ovr>=CAP_TOP && mine.some(p => p.ovr>=CAP_TOP)) return 'Déjà un joueur 92+';
  if(player.ovr>=CAP_HIGH && player.ovr<CAP_TOP && mine.some(p => p.ovr>=CAP_HIGH && p.ovr<CAP_TOP)) return 'Déjà un joueur 90-91';
  return '';
}
// Safety net: if no available pro fits the limits, the limits are lifted for that pick so nobody is stuck.
const relaxCache = {};
function rulesRelaxed(roster){
  const key = S.picks.length+'|'+Object.values(roster).join(',');
  if(key in relaxCache) return relaxCache[key];
  const own = draftOwner();
  return relaxCache[key] = !Object.values(PLAYERS).some(p => own[p.id]===undefined && baseSlot(roster,p) && !ruleBlock(roster,p));
}
function slotFor(roster, player){
  const s = baseSlot(roster, player); if(!s) return null;
  return (!ruleBlock(roster, player) || rulesRelaxed(roster)) ? s : null;
}
function blockReason(roster, player){
  const filled = Object.keys(roster).length;
  if(filled >= MAIN_ROUNDS){ if(player.role==='TEAM') return 'Pas en sub'; }
  else if(player.role!==ROUND_ROLE[filled]) return 'Tour des '+ROUND_LABEL[filled];
  return ruleBlock(roster, player);
}

// ---------- Season engine (rosters replayed from draft + moves) ----------
const kindOf = pid => PLAYERS[pid].role==='TEAM' ? 'TEAM' : 'PLAYER';
function covers(list){ return ROLES.every(r=>list.some(p=>PLAYERS[p].role===r)) && list.filter(p=>PLAYERS[p].role==='TEAM').length===1; }
const windowOf = ms => { const i = DAYS.findIndex(d => lockOf(d).getTime() > ms); return i<0 ? DN : i; };
const moveTime = m => Date.parse(m.at) || 0;

function effectiveLineup(seat, k, roster){
  const out = {};
  ROLES.forEach(r => {
    let pick = null;
    for(let i=k;i>=0 && !pick;i--){ const lu = S.lineups[DAYS[i].id+'-s'+seat]; const pid = lu && lu[r]; if(pid && roster.includes(pid) && PLAYERS[pid]?.role===r) pick = pid; }
    out[r] = pick || roster.find(p=>PLAYERS[p].role===r) || null;
  });
  out.TEAM = roster.find(p=>PLAYERS[p].role==='TEAM') || null;
  out._saved = !!S.lineups[DAYS[k].id+'-s'+seat];
  return out;
}
// ---- Days without a match ----
// A pick whose pro team has no match that day scores its average of previous days:
// 100% if the team is still in the tournament (qualified, or simply not scheduled), 50% if it is eliminated.
const REST = {alive:1, out:0.5};
function teamPlayed(k, code){ const st = S.stats[DAYS[k]?.id]; return !!(st && st.teams && st.teams[code]); }
function teamState(k, code){
  let w = 0, l = 0, ko = false;
  for(let j=0;j<k;j++){
    const t = S.stats[DAYS[j].id]?.teams?.[code]; if(!t) continue;
    if(DAYS[j].stage==='Swiss'){ w += Number(t.sw)||0; l += Number(t.sl)||0; }
    else if((Number(t.sl)||0) > 0) ko = true;
  }
  return (l>=3 || ko) ? 'out' : (w>=3 ? 'qualified' : 'alive');
}
function pastAvg(pid, k){
  const p = PLAYERS[pid]; let sum = 0, n = 0;
  for(let j=0;j<k;j++){
    const st = S.stats[DAYS[j].id]; if(!st) continue;
    if(p.role==='TEAM'){ const t = st.teams?.[p.team]; if(t){ sum += teamPoints(t); n++; } }
    else { const s = st.players?.[pid]; if(s && Number(s.g)>0){ sum += playerPoints(s); n++; } }
  }
  return n ? sum/n : 0;
}
function pickScore(pid, k){
  const st = S.stats[DAYS[k].id]; if(!st || !pid) return {pts:0, note:''};
  const p = PLAYERS[pid];
  if(teamPlayed(k, p.team)) return {pts: p.role==='TEAM' ? teamPoints(st.teams[p.team]) : playerPoints(st.players?.[pid]), note:''};
  const state = teamState(k, p.team);
  return {pts: pastAvg(pid, k) * (state==='out' ? REST.out : REST.alive), note: state==='out' ? 'out' : 'rest'};
}
function scoreSeat(seat, k, roster, st){
  const lu = effectiveLineup(seat, k, roster); const parts = {}; let total = 0;
  // Only the 5 starters and the team pick score. Subs never score: they sit on the bench until moved into the lineup.
  ROLES.forEach(r => {
    const pid = lu[r];
    const sc = st && pid ? pickScore(pid, k) : {pts:0, note:''};
    parts[r] = {pid, pts:sc.pts, note:sc.note}; total += sc.pts;
  });
  const c = lu.TEAM; const sc = st && c ? pickScore(c, k) : {pts:0, note:''};
  parts.TEAM = {pid:c, pts:sc.pts, note:sc.note}; total += sc.pts;
  return {seat, total, parts};
}
const NOTE_FR = {rest:'repos · moyenne', out:'éliminé · moyenne ×0,5'};
function stateTag(k, pid){
  if(!pid) return ''; const st = teamState(k, PLAYERS[pid].team);
  return st==='out' ? '<span class="plays no">Équipe éliminée</span>' : (st==='qualified' ? '<span class="plays yes">Équipe qualifiée</span>' : '');
}
function computeResult(E, k){
  const d = DAYS[k], mu = S.matchups[d.id], st = S.stats[d.id];
  if(!mu || !st || !Array.isArray(mu.pairs)) return null;
  const scores = {}; seats().forEach((_,s) => scores[s] = scoreSeat(s, k, E.snaps[k][s]||[], st));
  const duels = mu.pairs.filter(p => Array.isArray(p) && p.length===2 && scores[p[0]] && scores[p[1]]).map(([a,b]) => {
    const sa = scores[a].total, sb = scores[b].total, tie = Math.abs(sa-sb) < 1e-9;
    return {a, b, sa, sb, winner: tie?null:(sa>sb?a:b), loser: tie?null:(sa>sb?b:a)};
  });
  return {final: !!st.final, scores, duels};
}
function isFree(E, pid){ return !E.rosters.some(r => r.includes(pid)); }
function freeAgents(E){ return Object.keys(PLAYERS).filter(pid => isFree(E,pid)); }
function lockedOut(E, seat, w){
  const res = E.results[w-1]; if(!res) return false;
  const d = res.duels.find(x => x.loser===seat); return !!(d && !E.steals[(w-1)+':'+d.winner]);
}
function checkMove(E, m){
  const R = E.rosters, seat = m.seat, roster = R[seat];
  if(!roster) return 'Équipe inconnue';
  const w = windowOf(moveTime(m));
  if(m.type==='steal'){
    const k = DAYS.findIndex(d=>d.id===m.forDay);
    if(k<0 || w!==k+1) return 'Hors délai';
    const res = E.results[k]; if(!res || !res.final) return 'Résultats pas encore validés';
    const duel = res.duels.find(d=>d.winner===seat); if(!duel || duel.loser!==m.from) return 'Pas de victoire contre cette équipe';
    if(E.steals[k+':'+seat]) return 'Prise déjà faite';
    if(!R[m.from]?.includes(m.take)) return 'Ce joueur n’est plus chez l’adversaire';
    if(!roster.includes(m.release)) return 'Ce joueur n’est pas dans ton équipe';
    if(kindOf(m.take)!==kindOf(m.release)) return 'Une équipe s’échange uniquement contre une équipe';
    if(!covers(roster.filter(p=>p!==m.release).concat(m.take))) return 'Ton équipe doit garder au moins un joueur par poste';
    return null;
  }
  if(w<1 || w>=DN) return 'Mercato fermé';
  const prev = E.results[w-1]; if(!prev || !prev.final) return 'Mercato fermé tant que les stats de la journée ne sont pas validées';
  if(m.type==='refill'){
    if(roster.length!==PICKS_PER_SEAT-1) return 'Rien à remplacer';
    if(!PLAYERS[m.add] || !isFree(E,m.add)) return 'Ce pro n’est plus libre';
    const hasTeam = roster.some(p=>PLAYERS[p].role==='TEAM');
    if(hasTeam && PLAYERS[m.add].role==='TEAM') return 'Tu as déjà une équipe';
    if(!hasTeam && PLAYERS[m.add].role!=='TEAM') return 'Tu dois reprendre une équipe';
    if(!covers([...roster, m.add])){
      const miss = ROLES.find(r=>!roster.some(p=>PLAYERS[p].role===r));
      if(miss && freeAgents(E).some(p=>PLAYERS[p].role===miss)) return 'Il te manque un '+ROLE_FR[miss]+' : prends un '+ROLE_FR[miss];
    }
    return null;
  }
  if(m.type==='swap'){
    if(roster.length<PICKS_PER_SEAT) return 'Remplace d’abord le joueur qu’on t’a pris';
    if(lockedOut(E, seat, w)) return 'Attends que ton adversaire ait pris son joueur';
    if((E.swaps[w+':'+seat]||0) >= MAX_SWAPS) return 'Plus de changement disponible avant la prochaine journée';
    if(!roster.includes(m.drop)) return 'Ce joueur n’est pas dans ton équipe';
    if(!PLAYERS[m.add] || !isFree(E,m.add)) return 'Ce pro n’est plus libre';
    if(kindOf(m.add)!==kindOf(m.drop)) return 'Une équipe s’échange uniquement contre une équipe';
    if(!covers(roster.filter(p=>p!==m.drop).concat(m.add))) return 'Ton équipe doit garder au moins un joueur par poste';
    return null;
  }
  return 'Mouvement inconnu';
}
function applyMove(E, m){
  const R = E.rosters, w = windowOf(moveTime(m));
  if(m.type==='steal'){
    const k = DAYS.findIndex(d=>d.id===m.forDay);
    R[m.from] = R[m.from].filter(p=>p!==m.take);
    R[m.seat] = R[m.seat].filter(p=>p!==m.release).concat(m.take);
    E.steals[k+':'+m.seat] = m;
  } else if(m.type==='refill'){ R[m.seat] = R[m.seat].concat(m.add); }
  else if(m.type==='swap'){ R[m.seat] = R[m.seat].filter(p=>p!==m.drop).concat(m.add); E.swaps[w+':'+m.seat] = (E.swaps[w+':'+m.seat]||0)+1; }
}
function compute(){
  const E = {rosters: seats().map(()=>[]), snaps:{}, results:{}, steals:{}, swaps:{}, status:{}};
  [...S.picks].sort((a,b)=>a.n-b.n).forEach(p => { if(E.rosters[p.seat] && isFree(E,p.pid)) E.rosters[p.seat].push(p.pid); });
  const moves = [...S.moves].sort((a,b)=> moveTime(a)-moveTime(b) || (a.id<b.id?-1:1));
  let i = 0;
  const step = m => { const err = checkMove(E,m); E.status[m.id] = err; if(!err) applyMove(E,m); };
  for(let k=0;k<DN;k++){
    const lk = lockOf(DAYS[k]).getTime();
    while(i<moves.length && moveTime(moves[i]) < lk){ step(moves[i]); i++; }
    E.snaps[k] = E.rosters.map(r=>r.slice());
    E.results[k] = computeResult(E, k);
  }
  while(i<moves.length){ step(moves[i]); i++; }
  E.moves = moves;
  return E;
}
function standings(){
  const rows = seats().map((_,i)=>({seat:i, w:0, d:0, l:0, pts:0, played:0}));
  for(let k=0;k<DN;k++){
    const res = M.results[k]; if(!res) continue;
    res.duels.forEach(x => {
      [x.a,x.b].forEach(s=>{ rows[s].played++; rows[s].pts += res.scores[s].total; });
      if(x.winner===null){ rows[x.a].d++; rows[x.b].d++; } else { rows[x.winner].w++; rows[x.loser].l++; }
    });
  }
  return rows.sort((a,b)=> b.w-a.w || b.d-a.d || b.pts-a.pts || a.seat-b.seat);
}
function swissPairs(k){
  const rows = seats().map((_,i)=>({seat:i, w:0, d:0, pts:0}));
  const met = new Set();
  for(let j=0;j<k;j++){
    (S.matchups[DAYS[j].id]?.pairs||[]).forEach(([a,b])=>{ met.add(a+'-'+b); met.add(b+'-'+a); });
    const res = M.results[j]; if(!res) continue;
    res.duels.forEach(x=>{ rows[x.a].pts+=res.scores[x.a].total; rows[x.b].pts+=res.scores[x.b].total; if(x.winner===null){rows[x.a].d++;rows[x.b].d++;} else rows[x.winner].w++; });
  }
  const order = rows.sort((a,b)=> b.w-a.w || b.d-a.d || b.pts-a.pts || a.seat-b.seat).map(r=>r.seat);
  const used = new Set(), pairs = [];
  for(const a of order){
    if(used.has(a)) continue; used.add(a);
    let b = order.find(x=>!used.has(x) && !met.has(a+'-'+x));
    if(b===undefined) b = order.find(x=>!used.has(x));
    if(b===undefined) break;
    used.add(b); pairs.push([a,b]);
  }
  return pairs;
}
function randomPairs(n){
  const ids = Array.from({length: n ?? N()},(_,i)=>i); for(let i=ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]];}
  const pairs=[]; for(let i=0;i+1<ids.length;i+=2) pairs.push([ids[i],ids[i+1]]); return pairs;
}
function duelOf(k, seat){ const p = (S.matchups[DAYS[k]?.id]?.pairs||[]).find(x=>x.includes(seat)); return p ? (p[0]===seat?p[1]:p[0]) : null; }
const currentWindow = () => windowOf(Date.now());
const nextDay = () => DAYS[Math.min(currentWindow(), DN-1)];
// Pro schedule: "schedule/all" (whole event, refreshed automatically) or older per-day documents.
const proMatches = () => Array.isArray(S.schedule.all?.matches) ? S.schedule.all.matches : [];
function schedPairs(day){
  const all = proMatches().filter(m => m.d===day.id).map(m => [m.a, m.b]);
  if(all.length) return all;
  const sc = S.schedule[day.id]; if(!sc || !Array.isArray(sc.matches)) return null;
  return sc.matches.map(m => Array.isArray(m) ? m : [m?.a, m?.b]).filter(p => p[0] && p[1]);
}
function teamsPlaying(day){
  const pairs = schedPairs(day); if(!pairs) return null;
  const set = new Set(); pairs.forEach(p => p.forEach(t=>set.add(t))); return set;
}
// Real dates from Leaguepedia: day dates and default lock = first match of the day (a commissioner lock still wins).
DAYS.forEach(d => { d.date0 = d.date; d.lock0 = d.lock; d.fmt0 = d.fmt; });
function applyCalendar(){
  const all = S.schedule.all || {};
  DAYS.forEach(d => {
    d.date = all.days?.[d.id] || d.date0;
    d.lock = all.first?.[d.id] || d.lock0;
    const bos = [...new Set(proMatches().filter(m => m.d===d.id && m.bo).map(m => 'Bo'+m.bo))];
    d.fmt = bos.length ? d.stage + ' · ' + bos.join(' / ') : d.fmt0;
  });
}
function obligations(seat){
  // What this seat must or can do in the current mercato window
  const w = currentWindow(); const out = {w, open:false, reason:'', steal:null, waitSteal:null, refill:false, swapsLeft:0};
  if(w<1){ out.reason = 'Le mercato ouvre après la J1, dès que les stats sont validées.'; return out; }
  if(w>=DN){ out.reason = 'La saison est terminée.'; return out; }
  const res = M.results[w-1];
  if(!res || !res.final){ out.reason = `Le mercato ouvre dès que les stats de la J${w} sont validées (mise à jour automatique dès la fin des matchs).`; return out; }
  out.open = true;
  const duel = res.duels.find(d=>d.a===seat||d.b===seat);
  if(duel && duel.winner===seat && !M.steals[(w-1)+':'+seat]) out.steal = {from:duel.loser, k:w-1};
  if(duel && duel.loser===seat && !M.steals[(w-1)+':'+duel.winner]) out.waitSteal = duel.winner;
  const roster = M.rosters[seat]||[];
  out.refill = roster.length===PICKS_PER_SEAT-1;
  out.needTeam = !roster.some(p=>PLAYERS[p].role==='TEAM');
  out.swapsLeft = (out.waitSteal!==null || roster.length<PICKS_PER_SEAT) ? 0 : Math.max(0, MAX_SWAPS-(M.swaps[w+':'+seat]||0));
  return out;
}
function todo(seat){ if(seat===null || !draftDone()) return false; const o = obligations(seat); return !!(o.steal || o.refill); }

// ---------- Render ----------
function render(){
  M = (S.config && S.loaded.picks) ? compute() : null;
  renderWho(); renderTicker();
  document.querySelectorAll('#tabs button').forEach(b=>{
    b.setAttribute('aria-selected', b.dataset.tab===S.tab ? 'true':'false');
    if(b.dataset.tab==='mercato'){ const has = M && canActFor(S.viewSeat??-1) && todo(S.viewSeat); b.innerHTML = 'Mercato'+(has?'<span class="badge" aria-label="Action à faire"></span>':''); }
  });
  const v = $('#view');
  const free = {ligues:viewLeagues, regles:viewRules, cartes:viewCards}[S.tab];
  if(!S.db && !free){ v.innerHTML = noDb(); return; }
  const ready = S.lid && S.loaded.config && S.loaded.picks && S.loaded.moves && S.loaded.matchups;
  let fn = free || (S.db && S.loaded.leagues && !S.lid ? noLeague : null) || (ready ? (S.config ? {classement:viewStandings, draft:viewDraft, compo:viewLineup, mercato:viewMercato, journees:viewDays}[S.tab] : noLeague) : null);
  if(!fn){ v.innerHTML = '<div class="panel muted">Chargement de la partie…</div>'; return; }
  const ae = document.activeElement; const keep = ae && ae.id && v.contains(ae) ? {id:ae.id, s:ae.selectionStart, e:ae.selectionEnd} : null;
  v.innerHTML = fn();
  if(keep){ const el = document.getElementById(keep.id); if(el){ el.focus({preventScroll:true}); try{ if(keep.s!=null) el.setSelectionRange(keep.s, keep.e); }catch(_){} } }
  if(ready) maybeGenerate();
  turnCue();
  maybeDraftShow();
}
function noDb(){
  return `<div class="panel stack"><h2>Partie indisponible ici</h2><p class="lede">La base de données ne répond pas. Vérifie ta connexion Internet, puis le fichier config.js (voir LISEZMOI.md).</p></div>` + (S.tab==='regles'?viewRules():'');
}
function renderWho(){
  const el = $('#who');
  const lgs = S.leagues||[];
  const lsel = lgs.length>1 ? `<select id="league-sel" aria-label="Ligue">${lgs.map(l=>`<option value="${esc(l.id)}" ${l.id===S.lid?'selected':''}>${esc(l.name)}</option>`).join('')}</select>` : (S.config?.name ? `<b>${esc(S.config.name)}</b>` : '');
  if(!S.config || !N()){ el.innerHTML = lsel; return; }
  const mine = mySeat();

// Live presence (who is online, what they are hovering)
function peerInfo(){
  const online = {}, hover = {}, hoveredBy = {};
  (S.peers||[]).forEach(p => {
    const pr = p.presence || {}; const s = pr.seat;
    if(pr.lid !== S.lid || typeof s !== 'number' || !seats()[s]) return;
    online[s] = true;
    if(typeof pr.hover === 'string' && PLAYERS[pr.hover] && !p.isMe){ hover[s] = pr.hover; (hoveredBy[pr.hover] ||= []).push(s); }
  });
  return {online, hover, hoveredBy};
}

function lastPickTime(){

function clock(ms){ if(ms===null) return '--:--'; const s = Math.max(0, Math.floor((Date.now()-ms)/1000)); const m = Math.floor(s/60); return (m>=60?Math.floor(m/60)+'h ':'') + String(m%60).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }

function csPlayer(i, side, mode){

// ---- First-pick roulette ----
function rollState(){ const r = S.config?.rolls; return r && Object.keys(r).length ? r : null; }
function rollNum(seat, cls){
  const rolls = rollState() || {}; const v = rolls[seat];
  const stop = S.anim?.stops?.[seat]; const spinning = stop!==undefined && Date.now() < stop;
  return `<span class="roll ${cls||''} ${spinning?'':'done'}" data-roll-seat="${seat}">${spinning ? 1+Math.floor(Math.random()*100) : (v ?? '—')}</span>`;
}
function startRollAnim(){
  const rolls = rollState(); if(!rolls) return;
  try{ if(matchMedia('(prefers-reduced-motion: reduce)').matches) return; }catch(_){}
  const asc = Object.keys(rolls).map(Number).sort((a,b)=>rolls[a]-rolls[b]); // lowest stops first, first pick last
  const t0 = Date.now(), stops = {};
  asc.forEach((s,k) => stops[s] = t0 + 900 + k*260);
  S.anim = {stops, end: t0 + 900 + asc.length*260 + 700};
  clearInterval(S.animTimer); S.animTimer = setInterval(tickRoll, 55);
  if(S.tab!=='draft'){ S.tab = 'draft'; }
  render();
}
function tickRoll(){
  if(!S.anim){ clearInterval(S.animTimer); return; }
  const now = Date.now(), rolls = rollState() || {};
  document.querySelectorAll('[data-roll-seat]').forEach(el => {
    const s = Number(el.dataset.rollSeat), stop = S.anim.stops[s];
    if(stop===undefined) return;
    if(now >= stop){ if(!el.classList.contains('done')){ el.textContent = rolls[s]; el.classList.add('done','pop'); } }
    else el.textContent = 1+Math.floor(Math.random()*100);
  });
  if(now >= S.anim.end){ clearInterval(S.animTimer); S.anim = null; render(); }
}
